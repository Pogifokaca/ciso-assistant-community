      a.5.24:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me your incident management procedure, roles and escalation paths.
        - id: q2
          stage: 2
          who:
          - ciso
          - sec_ops
          text: When did you last exercise the incident process, and what did you change after it?
        - id: q3
          stage: 2
          who:
          - ciso
          text: Who is allowed to handle incidents, and how do you know they are trained for it?
        requests:
        - id: r1
          label: Incident management policy and procedure with roles, severity scale and escalation
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.incident
        - id: r2
          label: Incident response team contact list including external parties
          kind: document
        - id: r3
          label: Tabletop or simulation exercise report
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.ir_exercise
        - id: r4
          label: Training records for incident response staff
          kind: record
          fresh_days: 400
