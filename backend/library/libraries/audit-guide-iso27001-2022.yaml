urn: urn:intuitem:risk:library:audit-guide-iso27001-2022
locale: en
ref_id: audit-guide-iso27001-2022
name: ISO/IEC 27001:2022 auditor guide
description: What a certification auditor will ask for each requirement of ISO/IEC 27001:2022 (questions,
  records, sampling, pitfalls, who answers) and the sessions a Stage 2 audit runs. Written in our own
  words; copy and adapt it to make your own.
copyright: intuitem
version: 2
publication_date: 2026-11-19
provider: intuitem
packager: intuitem
autoload: true
translations:
  mk:
    name: Водич за ревизори за ISO/IEC 27001:2022
    description: Што ќе праша сертификацискиот ревизор за секое барање од ISO/IEC 27001:2022 (прашања,
      записи, примероци, вообичаени грешки, кој одговара) и сесиите што се спроведуваат во ревизијата
      во фаза 2. Напишано со наши зборови; копирајте го и прилагодете го за ваша употреба.
objects:
  audit_guides:
  - urn: urn:intuitem:risk:audit_guide:iso27001-2022
    ref_id: iso27001-2022
    name: ISO/IEC 27001:2022 auditor guide
    framework: urn:intuitem:risk:framework:iso27001-2022
    entries:
      '4.1':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - top
          text: Show me where you recorded the internal and external issues that shape your ISMS, and
            when that list was last revisited.
        - id: q2
          stage: 1
          who:
          - top
          text: Did you decide whether climate change matters for your information security? Walk me through
            how you reached that answer.
        - id: q3
          stage: 2
          who:
          - ciso
          text: Pick one issue on this list and show me where it turned into a risk, an objective or a
            control.
        requests:
        - id: r1
          label: Context analysis (internal and external issues, e.g. PESTLE/SWOT) with date and owner
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.context
        - id: r2
          label: Record of the decision on climate change relevance (auditors expect the reasoning, the
            standard does not mandate it)
          kind: document
        - id: r3
          label: Management review minutes showing the issues list was revisited
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: issues
          population: issues listed in the context analysis
          method: trace each issue to a risk register entry, objective or control
        interviewees:
        - top
        - ciso
        pitfalls:
        - id: p1
          text: No decision at all on whether climate change is relevant (required by 4.1 since Amendment
            1:2024, so a likely nonconformity); a bare one-line dismissal usually draws a question or
            an improvement point, as 4.1 asks for no written reasoning
        - id: p2
          text: Context analysis written once for certification and never updated after a reorganisation,
            acquisition or move to cloud
        - id: p3
          text: Issues listed but disconnected from the risk assessment, so the auditor cannot see how
            they influenced anything
      '4.2':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - legal
          - dpo
          text: Who are the interested parties that matter to your ISMS, and what does each of them expect
            from you on security?
        - id: q2
          stage: 1
          who:
          - ciso
          text: Which of those expectations have you chosen to address through the ISMS, and which have
            you left out?
        - id: q3
          stage: 2
          who:
          - legal
          - ciso
          text: Take a customer contract or a regulation from this list and show me the controls that
            satisfy it.
        - id: q4
          stage: 2
          who:
          - legal
          text: Do any of your interested parties have climate-related expectations, such as resilience
            commitments from customers or regulators?
        requests:
        - id: r1
          label: Interested parties register with requirements and which ones the ISMS addresses
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.context
        - id: r2
          label: Legal, regulatory and contractual requirements register (links to A.5.31)
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.legal
        - id: r3
          label: Sample customer contract or DPA with security clauses
          kind: record
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: requirements
          population: legal, regulatory and contractual obligations in the register
          method: trace each to an implemented control and its evidence
        interviewees:
        - ciso
        - legal
        - dpo
        pitfalls:
        - id: p1
          text: Register lists parties but not their actual requirements, or does not say which requirements
            the ISMS will address (an explicit 2022 expectation)
        - id: p2
          text: Major customer contract with specific security clauses (breach notification hours, audit
            rights) missing from the register
        - id: p3
          text: No review of interested parties after a new regulation (NIS2, DORA) came into force
      '4.3':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Read me your scope statement. Which locations, teams, products and systems are in, and
            what is excluded?
        - id: q2
          stage: 1
          who:
          - ciso
          - it_lead
          text: Where something is left out, how do you handle the connections and hand-offs with it?
        - id: q4
          stage: 1
          who:
          - ciso
          - top
          text: Which of your context issues and stakeholder requirements shaped where you drew the scope
            boundary?
        - id: q3
          stage: 2
          who:
          - ciso
          text: 'This team or site I saw on your org chart: is it in scope? Show me how the scope document
            says so.'
        requests:
        - id: r1
          label: ISMS scope statement (documented, approved, versioned)
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.scope
        - id: r2
          label: List of links and hand-offs with what sits outside scope, including outsourced and cloud
            services
          kind: document
        - id: r3
          label: Network or architecture diagram matching the scope boundary
          kind: technical
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.is_map
        sampling: []
        interviewees:
        - ciso
        - top
        - it_lead
        pitfalls:
        - id: p1
          text: Scope wording on the certificate draft does not match the scope statement or the website
            marketing claims
        - id: p2
          text: Excluded areas share networks, admins or data with in-scope systems and those interfaces
            are not addressed (certification bodies also expect each exclusion to be explained)
        - id: p3
          text: Cloud providers and remote workers ignored when drawing the boundary
      '4.4':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: 'Show me how your ISMS processes connect: which outputs feed which inputs?'
        - id: q2
          stage: 2
          who:
          - ciso
          text: How do you know the ISMS is maintained and improved, not just documented? Give me an example
            of something that changed this year.
        requests:
        - id: r1
          label: ISMS manual or process map showing processes, owners and interactions
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.overview
        - id: r2
          label: Change log or version history of ISMS documents over the last 12 months
          kind: record
          fresh_days: 400
        sampling: []
        interviewees:
        - ciso
        pitfalls:
        - id: p1
          text: Documents exist for each clause but nobody can explain how outputs of one process feed
            the next (e.g. audit results into management review)
        - id: p2
          text: No evidence of any improvement since the last audit, suggesting the ISMS is static
      '5.1':
        questions:
        - id: q1
          stage: 2
          who:
          - top
          text: What is your personal role in the ISMS? Tell me in your own words what the security objectives
            are.
        - id: q2
          stage: 2
          who:
          - top
          text: Give me an example where you allocated budget or people to information security in the
            last year.
        - id: q3
          stage: 2
          who:
          - top
          text: How does security show up in the way the business already runs, such as budgeting, projects
            or purchasing?
        requests:
        - id: r1
          label: Evidence of resources approved for the ISMS (budget line, headcount, tool purchase)
          kind: record
          fresh_days: 400
        - id: r2
          label: Top management communications on information security (all-hands slide, memo, intranet
            post)
          kind: record
          fresh_days: 400
        - id: r3
          label: Management review attendance list showing top management presence
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review
        sampling: []
        interviewees:
        - top
        pitfalls:
        - id: p1
          text: CEO or managing director delegates the whole interview to the CISO and cannot name the
            policy or objectives
        - id: p2
          text: Security spend requests repeatedly deferred, visible in risk treatment plan delays
        - id: p3
          text: Top management does not attend management review, only signs the minutes afterwards
      '5.2':
        questions:
        - id: q1
          stage: 1
          who:
          - top
          - ciso
          text: Show me your information security policy. Who approved it and when?
        - id: q2
          stage: 1
          who:
          - top
          text: Read me the lines that set the policy's intent. Does it say how objectives are set, commit
            you to meeting the security requirements that apply to you, and promise to keep getting better?
        - id: q3
          stage: 2
          who:
          - ciso
          - staff
          text: How did staff and relevant external parties get this policy? Show me.
        requests:
        - id: r1
          label: Information security policy, signed or approved by top management, with version and date
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.main
        - id: r2
          label: Evidence the policy was communicated internally and made available to relevant interested
            parties (acknowledgements also serve A.5.1)
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: staff
          population: in-scope employees and contractors
          method: ask whether they know where the policy is and what it means for their role
        interviewees:
        - top
        - ciso
        - staff
        pitfalls:
        - id: p1
          text: Policy approved by the CISO only, not by top management
        - id: p2
          text: 'Policy misses a required element: objectives or a way to set them, a commitment to meet
            applicable requirements, or a commitment to keep improving'
        - id: p3
          text: Policy text no longer matches the current ISMS, for example it still cites the 2013 Annex
            A
      '5.3':
        questions:
        - id: q1
          stage: 1
          who:
          - top
          text: Who answers for the ISMS meeting the standard, and who briefs top management on how it
            is doing?
        - id: q2
          stage: 2
          who:
          - hr
          text: Show me where security responsibilities are written into job descriptions or a RACI.
        - id: q3
          stage: 2
          who:
          - ciso
          text: You are listed as owner of this process. Tell me what you do as owner.
        requests:
        - id: r1
          label: ISMS roles and responsibilities document or RACI
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.raci
        - id: r2
          label: Appointment letter or org chart naming the ISMS manager / CISO
          kind: document
        - id: r3
          label: Job descriptions for key security roles
          kind: document
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: role holders
          population: named owners in the RACI (risk owners, control owners)
          method: interview to confirm they know and perform the role
        interviewees:
        - top
        - ciso
        - hr
        pitfalls:
        - id: p1
          text: Named risk or control owners who have left the company or do not know they hold the role
        - id: p2
          text: Nobody formally assigned to report ISMS performance to top management
      6.1.1:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - risk
          text: 'Take your context issues and stakeholder expectations: which risks and opportunities
            for the ISMS itself did they produce?'
        - id: q2
          stage: 2
          who:
          - ciso
          text: Show me one opportunity you identified and what you did with it.
        requests:
        - id: r1
          label: Register of ISMS-level risks and opportunities (distinct from or part of the information
            security risk register)
          kind: document
        - id: r2
          label: Plan of actions on ISMS risks and opportunities, showing which ISMS process carries each
            and how you will know it worked
          kind: record
          fresh_days: 400
        sampling: []
        interviewees:
        - ciso
        - risk
        pitfalls:
        - id: p1
          text: Only information security risks considered; risks to the ISMS achieving its outcomes (loss
            of key staff, budget cuts) ignored
        - id: p2
          text: Opportunities never identified or recorded
      6.1.2:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: 'Walk me through your risk assessment methodology: criteria for acceptance, how you score
            likelihood and consequence.'
        - id: q2
          stage: 1
          who:
          - ciso
          text: If two people scored the same risk a year apart, why would they land on the same answer?
        - id: q3
          stage: 2
          who:
          - risk
          - ciso
          text: Show me the latest risk assessment. When was it done and what triggered it?
        - id: q4
          stage: 2
          who:
          - risk
          text: For this risk, who is the owner? Let me ask them about it.
        requests:
        - id: r1
          label: Risk assessment methodology with acceptance criteria and scales
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.risk
        - id: r2
          label: Risk register / latest risk assessment results with owners
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.risk_register
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: risks
          population: risk register entries, weighted to high risks
          method: check scoring against methodology, interview owner, follow to treatment
        interviewees:
        - risk
        - ciso
        pitfalls:
        - id: p1
          text: Risk criteria or the assessment method not defined, so results cannot be repeated or compared
        - id: p2
          text: Risks without named owners, or owners are the CISO for everything
        - id: p3
          text: Scores do not match the documented scales, or acceptance criteria are not defined
      6.1.3:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me your Statement of Applicability. For each excluded Annex A control, why is it
            excluded?
        - id: q2
          stage: 1
          who:
          - ciso
          text: You picked your controls from your risks. How did you then check Annex A for anything
            you overlooked?
        - id: q3
          stage: 2
          who:
          - risk
          - top
          text: Who approved the risk treatment plan and accepted the residual risks?
        - id: q4
          stage: 2
          who:
          - ciso
          text: This control says implemented in the SoA. Show me it working.
        requests:
        - id: r1
          label: 'Statement of Applicability: every necessary control (the 93 Annex A ones plus any you
            added), why each is included or excluded, and whether it is implemented'
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.soa
        - id: r2
          label: Risk treatment plan with actions, owners, deadlines and status
          kind: record
          fresh_days: 200
        - id: r3
          label: Risk owner approval of the plan and acceptance of residual risk
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: controls
          population: SoA entries marked applicable and implemented
          method: request evidence of operation for each
        interviewees:
        - risk
        - ciso
        - top
        pitfalls:
        - id: p1
          text: SoA still on the 2013 structure (114 controls) or missing the 11 new 2022 controls such
            as threat intelligence and data masking
        - id: p2
          text: Exclusions justified with 'not applicable' only, or excluded controls that are clearly
            needed by the risks
        - id: p3
          text: Treatment plan overdue items with no rescheduling or residual risk acceptance by the owner
      '6.2':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me your information security objectives. How are they measured and who owns each?
        - id: q2
          stage: 2
          who:
          - ciso
          text: Where are you against these objectives today? Show me the data.
        - id: q3
          stage: 2
          who:
          - top
          - ciso
          text: What happens when an objective is missed?
        - id: q4
          stage: 2
          who:
          - ciso
          - top
          text: Which risks or requirements drove these objectives, and when did you last revise them?
        requests:
        - id: r1
          label: 'Objectives list: target, owner, budget or people, due date and how progress is measured'
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.so_register
        - id: r2
          label: Progress tracking against objectives (dashboard or report)
          kind: record
          fresh_days: 100
        sampling: []
        interviewees:
        - ciso
        - top
        pitfalls:
        - id: p1
          text: Objectives are vague ('improve security') with no measurable target or date
        - id: p2
          text: Objectives set but never monitored; no data at the audit
        - id: p3
          text: Objectives not consistent with the policy or not communicated to those who must deliver
            them
        - id: p4
          text: 'Objectives and indicators exist, but no plan for each: what will be done, with which
            resources, by whom, by when and how the result is judged'
      '6.3':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: How do you decide that a change to the ISMS needs formal planning?
        - id: q2
          stage: 2
          who:
          - ciso
          text: Tell me about a significant ISMS change this year, such as scope, structure or a key outsourcing.
            Show me how it was planned.
        requests:
        - id: r1
          label: Criteria for when an ISMS change needs planning (good practice, not required by 6.3)
          kind: document
        - id: r2
          label: Evidence a recent ISMS change was planned before it was made (auditors commonly look
            for purpose, impact, resources and owner)
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 1
          max: 2
          unit: changes
          population: ISMS-level changes in the last 12 months
          method: check planning was done before the change, not after
        interviewees:
        - ciso
        pitfalls:
        - id: p1
          text: Confused with operational change management (A.8.32); no evidence of planning for changes
            to the ISMS itself
        - id: p2
          text: Reorganisation or scope extension carried out with no sign it was planned beforehand
      '7.1':
        questions:
        - id: q1
          stage: 1
          who:
          - top
          - ciso
          text: How did you decide what the ISMS needs in people, budget and tools, and where is that
            recorded?
        - id: q2
          stage: 2
          who:
          - ciso
          text: Is any resource you asked for still missing, and what does that hold back?
        - id: q3
          stage: 2
          who:
          - ciso
          text: How much of your working time actually goes to the ISMS?
        requests:
        - id: r1
          label: ISMS budget or resource plan
          kind: record
          fresh_days: 400
        - id: r2
          label: Staffing of security roles (org chart, FTE allocation)
          kind: document
        sampling: []
        interviewees:
        - top
        - ciso
        pitfalls:
        - id: p1
          text: CISO role held part-time by an IT manager with no protected time, and treatment plan slips
            confirm under-resourcing
        - id: p2
          text: Resource needs never formally assessed or discussed in management review
      '7.2':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - hr
          text: For admins, developers and the ISMS team, what skills did you decide each role needs?
        - id: q2
          stage: 2
          who:
          - hr
          text: Show me the competence evidence for your ISMS manager and internal auditor.
        - id: q3
          stage: 2
          who:
          - hr
          text: Tell me about someone who lacked a skill their role needs. What did you do, and how do
            you know it helped?
        requests:
        - id: r1
          label: Competence matrix or requirements per security role
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.competency
        - id: r2
          label: Training certificates, CVs or qualifications for key ISMS roles
          kind: record
        - id: r3
          label: Evaluation of training effectiveness
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: people
          population: holders of security-relevant roles (admins, developers, auditors)
          method: compare required competence to retained evidence
        interviewees:
        - hr
        - ciso
        pitfalls:
        - id: p1
          text: No retained evidence (training, qualification or experience) that the internal auditor
            is competent
        - id: p2
          text: Training attended but no evaluation of whether it was effective
        - id: p3
          text: Competence requirements not defined for admins or developers
      '7.3':
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: What must every person in scope know about security, and where is that set out?
        - id: q2
          stage: 2
          who:
          - staff
          text: What does the information security policy mean for your daily work?
        - id: q3
          stage: 2
          who:
          - staff
          text: What would you do if you clicked a suspicious link or lost your laptop?
        - id: q4
          stage: 2
          who:
          - staff
          text: What happens here if someone does not follow the security rules?
        requests:
        - id: r1
          label: Awareness programme plan and content
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_plan
        - id: r2
          label: Awareness completion records for in-scope staff
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: staff
          population: staff met during the site tour and interviews, including new joiners
          method: short conversational questions on policy, reporting and their role
        interviewees:
        - staff
        - hr
        pitfalls:
        - id: p1
          text: Staff cannot say how their own role contributes to security
        - id: p2
          text: Contractors and new joiners missing from completion records
      '7.4':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which security topics do you communicate inside and outside the company, when, to whom
            and through which channel?
        - id: q2
          stage: 2
          who:
          - legal
          - ciso
          text: Give me an example of a security communication to an external party, such as a customer
            or authority.
        requests:
        - id: r1
          label: Communication plan or matrix (topic, audience, timing, channel; owner optional)
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.com
        - id: r2
          label: Examples of internal and external security communications
          kind: record
          fresh_days: 400
        sampling: []
        interviewees:
        - ciso
        - legal
        pitfalls:
        - id: p1
          text: No defined communication with regulators or customers for incidents, despite contractual
            obligations
        - id: p2
          text: Plan exists but none of the communications listed can be evidenced
      7.5.1:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me the documented information the standard requires and what you added yourselves.
        - id: q2
          stage: 1
          who:
          - ciso
          text: How did you decide how much documentation your organisation needs?
        requests:
        - id: r1
          label: Master list of ISMS documents and records
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.doc_register
        - id: r2
          label: 'Documented information the standard requires: scope, policy, objectives, risk assessment
            and treatment process, SoA, plus the records asked for by 7.2, 8.1 to 8.3, 9.1, 9.2, 9.3 and
            10.2'
          kind: document
        sampling: []
        interviewees:
        - ciso
        pitfalls:
        - id: p1
          text: A required item missing, most often evidence of competence, monitoring results or internal
            audit programme
        - id: p2
          text: Procedures listed in the master list that do not exist or are drafts
      7.5.2:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: How does a document get its name, version and owner, and who signs it off before it is
            published? Show me the history of one.
        - id: q2
          stage: 2
          who:
          - ciso
          text: Who approved this policy revision and where is that recorded?
        requests:
        - id: r1
          label: How documents are identified, formatted and approved (a written procedure is optional)
          kind: document
        - id: r2
          label: Approval records for recent document revisions
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: documents
          population: ISMS policies and procedures
          method: check version, owner, approval and review date
        interviewees:
        - ciso
        pitfalls:
        - id: p1
          text: Documents with no version, owner or approval record
        - id: p2
          text: Different versions of the same policy in circulation (intranet vs shared drive)
      7.5.3:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: How are ISMS documents approved, versioned, distributed and retired, and how long do you
            keep records?
        - id: q2
          stage: 2
          who:
          - ciso
          text: How do you make sure people use the current version and obsolete versions are withdrawn?
        - id: q3
          stage: 2
          who:
          - it_lead
          text: Where do records live, who can alter them, and when do you delete them?
        - id: q4
          stage: 2
          who:
          - ciso
          text: How do you keep track of documents you did not write, such as standards or supplier manuals?
        requests:
        - id: r1
          label: Record retention schedule
          kind: document
        - id: r2
          label: Access rights on the ISMS document repository
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: documents
          population: documents found at point of use during the tour
          method: compare against the current master list version
        interviewees:
        - ciso
        - it_lead
        pitfalls:
        - id: p1
          text: Printed or locally saved outdated procedures in use
        - id: p2
          text: Everyone has edit rights on the ISMS repository
      '8.1':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which processes, including outsourced ones, did you identify as needing planning and control
            for security?
        - id: q2
          stage: 2
          who:
          - it_lead
          text: 'Pick a process that delivers a risk treatment action: what does done right look like,
            and how do you check it?'
        - id: q3
          stage: 2
          who:
          - proc
          text: Which processes are outsourced, and how do you control them?
        - id: q4
          stage: 2
          who:
          - it_lead
          text: Tell me about a change that did not go to plan. What did you do about the side effects?
        requests:
        - id: r1
          label: List of outsourced processes and bought-in services the ISMS depends on, with how each
            is controlled
          kind: document
        - id: r2
          label: Operational records showing processes carried out as planned (e.g. backup logs, patch
            reports)
          kind: record
          fresh_days: 100
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: processes
          population: operational security processes and outsourced services
          method: check criteria exist and records prove execution
        interviewees:
        - it_lead
        - ciso
        - proc
        pitfalls:
        - id: p1
          text: Outsourced IT or cloud services not listed as outsourced processes, so nothing controls
            them
        - id: p2
          text: Processes run, but nothing kept to prove they ran when and how they should
      '8.2':
        questions:
        - id: q1
          stage: 1
          who:
          - risk
          text: Are the results of each risk assessment cycle kept, or only today's register?
        - id: q2
          stage: 2
          who:
          - risk
          text: How often do you reassess risks, and what triggers an unscheduled reassessment?
        - id: q3
          stage: 2
          who:
          - risk
          text: Show me the assessment you did after your last significant change.
        requests:
        - id: r1
          label: Risk assessment results from each scheduled cycle (last two)
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.risk_register
        - id: r2
          label: Ad-hoc risk assessment following a significant change or incident
          kind: record
        sampling:
        - id: s1
          min: 1
          max: 2
          unit: changes
          population: significant changes in the last 12 months
          method: check a risk assessment was triggered and recorded
        interviewees:
        - risk
        pitfalls:
        - id: p1
          text: Reassessment done annually but never triggered by changes such as a new SaaS platform
            or acquisition
        - id: p2
          text: Results not retained, only the current snapshot of the register
        - id: p3
          text: Reassessments not done at the intervals the organisation planned itself, or not triggered
            by significant changes
      '8.3':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which treatment actions are due before Stage 2, and which are already done?
        - id: q2
          stage: 2
          who:
          - risk
          text: Show me progress on the risk treatment plan. Which actions are complete and how do you
            know they work?
        - id: q3
          stage: 2
          who:
          - ciso
          - risk
          text: What happens to treatment actions that miss their deadline?
        requests:
        - id: r1
          label: Risk treatment plan status report
          kind: record
          fresh_days: 100
        - id: r2
          label: Evidence of completed treatment actions
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: treatment actions
          population: actions due in the last 12 months
          method: verify completion evidence and update of residual risk
        interviewees:
        - risk
        - ciso
        pitfalls:
        - id: p1
          text: Actions marked done without evidence or without updating the residual risk score
        - id: p2
          text: Large backlog of overdue actions with no escalation
      '9.1':
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which numbers tell you the ISMS is working, where do they come from, and who looks at
            them?
        - id: q2
          stage: 2
          who:
          - ciso
          text: Show me the latest measurement results and what decision they led to.
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Which of these numbers would move if a control stopped working?
        - id: q4
          stage: 2
          who:
          - ciso
          text: If someone else measured this KPI next quarter, would they get a comparable number? And
            how do you conclude the ISMS is effective overall?
        requests:
        - id: r1
          label: 'KPI catalogue: each metric with its source, cadence, who collects it and who interprets
            it'
          kind: document
        - id: r2
          label: Latest KPI / metrics report with analysis
          kind: record
          fresh_days: 100
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: metrics
          population: KPIs in the measurement plan
          method: check data source, frequency met and results used
        interviewees:
        - ciso
        - sec_ops
        pitfalls:
        - id: p1
          text: Metrics count activity (number of trainings) without saying anything about effectiveness
        - id: p2
          text: Results collected but never analysed or reported to management
        - id: p3
          text: Nobody named for collecting or interpreting the metrics
      9.2.1:
        questions:
        - id: q1
          stage: 1
          who:
          - auditor
          text: Has a full internal audit been carried out yet, and which parts of the ISMS did it cover?
        - id: q2
          stage: 2
          who:
          - auditor
          text: Over its cycle, does your audit programme cover all ISMS clauses and the applicable Annex
            A controls? Show me where.
        - id: q3
          stage: 2
          who:
          - auditor
          text: Did the audit test your own procedures as well as the standard? Where does the report
            show it?
        - id: q4
          stage: 2
          who:
          - ciso
          - auditor
          text: Who ran the internal audit, how do you know they are competent on the current edition
            of the standard, and that they did not audit their own work?
        requests:
        - id: r1
          label: Internal audit report(s) with findings (certification bodies expect at least one internal
            audit cycle covering the ISMS before Stage 2)
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:pol.audit
        - id: r2
          label: Internal audit checklists and evidence notes
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: audit findings
          population: findings from the last internal audit
          method: trace to corrective action and closure
        interviewees:
        - auditor
        - ciso
        pitfalls:
        - id: p1
          text: No internal audit cycle completed before Stage 2; certification bodies expect one and
            often raise its absence as a major finding
        - id: p2
          text: Internal audit is a checklist tick-off with no evidence recorded
        - id: p3
          text: Applicable Annex A controls skipped across the whole programme, with only policies ever
            audited
      9.2.2:
        questions:
        - id: q1
          stage: 1
          who:
          - auditor
          text: Show me your audit programme. How did you decide frequency and coverage?
        - id: q2
          stage: 2
          who:
          - ciso
          text: Who are your internal auditors, and how do you ensure they don't audit their own work?
        - id: q3
          stage: 2
          who:
          - ciso
          text: Who received the audit report, and what did they do with it?
        requests:
        - id: r1
          label: Internal audit programme (frequency, methods, responsibilities, planning, reporting),
            often aligned to the 3-year certification cycle
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.audit_plan
        - id: r2
          label: 'Plan of each internal audit: what was checked and against which requirements'
          kind: record
          fresh_days: 400
        - id: r3
          label: Auditor independence and competence evidence
          kind: record
        sampling: []
        interviewees:
        - auditor
        - ciso
        pitfalls:
        - id: p1
          text: ISMS manager audits the processes they run, breaking objectivity
        - id: p2
          text: Every area audited at the same pace, ignoring which processes matter most and where the
            last audit found problems
        - id: p3
          text: Sites or departments in scope never audited
      9.3.1:
        questions:
        - id: q1
          stage: 1
          who:
          - top
          - ciso
          text: When was the last management review, and who attended?
        - id: q2
          stage: 2
          who:
          - ciso
          text: How often do you hold the review, and was one skipped or postponed this cycle?
        - id: q3
          stage: 2
          who:
          - ciso
          text: Was the management review done before this certification audit?
        requests:
        - id: r1
          label: Management review minutes with date and attendance
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review
        - id: r2
          label: Management review schedule
          kind: document
        sampling: []
        interviewees:
        - top
        - ciso
        pitfalls:
        - id: p1
          text: No management review held before Stage 2
        - id: p2
          text: Top management absent, review done by the CISO alone
      9.3.2:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me the agenda of the last management review. Where is each expected input covered?
        - id: q2
          stage: 2
          who:
          - ciso
          text: Show me where the minutes discuss what customers, regulators and other stakeholders now
            expect.
        - id: q3
          stage: 2
          who:
          - ciso
          - top
          text: How did audit results, nonconformities, metrics and risk status feed the discussion? Show
            me the trends, not just current figures.
        requests:
        - id: r1
          label: Management review input pack (follow-up of last actions, what changed inside and outside,
            performance and audit results, risks, improvement ideas)
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review
        - id: r2
          label: Mapping of review agenda items to each required input
          kind: document
        sampling: []
        interviewees:
        - ciso
        - top
        pitfalls:
        - id: p1
          text: One or more required inputs missing, typically what stakeholders now expect (added in
            2022) or the feedback they gave
        - id: p2
          text: Status of actions from the previous review not tracked
        - id: p3
          text: Risk assessment results and progress on the treatment plan left out of the review pack
      9.3.3:
        questions:
        - id: q1
          stage: 1
          who:
          - top
          - ciso
          text: What decisions came out of the last management review, and where are they tracked?
        - id: q2
          stage: 2
          who:
          - top
          text: Which review decisions changed the ISMS scope, resources or objectives?
        - id: q3
          stage: 2
          who:
          - ciso
          text: Show me one decision from the review that has been implemented.
        requests:
        - id: r1
          label: 'Management review outputs: what was decided, who owns each action, and by when'
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review
        - id: r2
          label: Action tracker showing follow-up of review decisions
          kind: record
          fresh_days: 200
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: actions
          population: decisions from the last management review
          method: verify implementation evidence
        interviewees:
        - top
        - ciso
        pitfalls:
        - id: p1
          text: Minutes record discussion only, with no decisions, owners or deadlines
        - id: p2
          text: Review decisions never followed up before the next review
        - id: p3
          text: No recorded conclusion on whether the ISMS still fits, is sufficient and works, and no
            decision on resource needs
      '10.1':
        questions:
        - id: q1
          stage: 2
          who:
          - ciso
          text: Give me examples of improvements to the ISMS in the last year. Where did they come from?
        - id: q2
          stage: 2
          who:
          - ciso
          text: How do you capture improvement ideas from staff and incidents?
        requests:
        - id: r1
          label: Improvement register or log
          kind: record
          fresh_days: 400
        - id: r2
          label: Before/after evidence for one completed improvement (e.g. revised procedure, KPI trend)
          kind: record
        sampling: []
        interviewees:
        - ciso
        pitfalls:
        - id: p1
          text: No improvement evident beyond fixing nonconformities (often raised as an improvement point)
        - id: p2
          text: Nothing in the ISMS measurably better than at the last audit
      '10.2':
        questions:
        - id: q1
          stage: 2
          who:
          - ciso
          text: Walk me through a nonconformity from discovery to closure. What did you do about its consequences,
            how did you decide whether the cause needed removing, and did it change the ISMS?
        - id: q2
          stage: 2
          who:
          - auditor
          text: How did you check the corrective action actually worked?
        - id: q3
          stage: 2
          who:
          - ciso
          text: Could the same problem be happening in another team or system? How did you check?
        requests:
        - id: r1
          label: Nonconformity and corrective action register
          kind: record
          fresh_days: 200
          reference_control: urn:intuitem:risk:function:doc-pol:doc.nc_log
        - id: r2
          label: Root cause analysis records for closed nonconformities
          kind: record
        - id: r3
          label: Effectiveness review records for corrective actions
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: nonconformities
          population: nonconformities from internal audit, incidents and complaints in the last 12 months
          method: check correction, root cause, action, effectiveness review
        interviewees:
        - ciso
        - auditor
        pitfalls:
        - id: p1
          text: Correction only, with no evaluation of whether the cause needed removing, or no root cause
            work on significant or repeated nonconformities
        - id: p2
          text: Corrective actions closed without checking they were effective
        - id: p3
          text: Internal audit findings never logged as nonconformities, so no corrective action was started
      a.5.1:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - top
          text: Show me the top-level security policy and the topic-specific policies that sit under it.
            Who approved each one and when?
        - id: q2
          stage: 2
          who:
          - ciso
          - staff
          text: How do staff and relevant external parties learn about a new or changed policy, and how
            do you know they acknowledged it?
        - id: q3
          stage: 2
          who:
          - ciso
          text: 'Pick one topic-specific policy and walk me through its last review: what triggered it
            and what changed.'
        requests:
        - id: r1
          label: Information security policy with approval signature or record and version history
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.main
        - id: r2
          label: List of topic-specific policies with owner, version, last review date and next review
            date
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.doc_register
        - id: r3
          label: Policy acknowledgement records for staff and contractors
          kind: record
          fresh_days: 400
        - id: r4
          label: Minutes or tickets showing the most recent policy review
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: staff
          population: current workforce in scope
          method: check acknowledgement of the current policy versions
          note: including contractors and recent joiners
        interviewees:
        - top
        - ciso
        - staff
        pitfalls:
        - id: p1
          text: Policies reviewed on paper but the review date is older than the interval the policy itself
            sets
        - id: p2
          text: Acknowledgement collected at onboarding only, never after a policy change, and never from
            contractors or other interested parties
        - id: p3
          text: Policies still cite 2013 control numbers or titles after the 2022 transition
      a.5.2:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me where security roles and responsibilities are defined, including asset and risk
            owners.
        - id: q2
          stage: 2
          who:
          - it_lead
          text: Pick an asset owner from your inventory. Can they tell me what they are accountable for
            in security terms?
        - id: q3
          stage: 2
          who:
          - ciso
          - top
          text: How do you make sure the people in security roles have, and keep, the competence those
            roles need?
        requests:
        - id: r1
          label: RACI or responsibility matrix for the ISMS and security processes
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.raci
        - id: r2
          label: Job descriptions or role definitions for the CISO and other named security roles
          kind: document
        - id: r3
          label: Appointment letters or minutes formally assigning ISMS roles
          kind: record
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: named role holders
          population: asset owners, risk owners and ISMS roles
          method: interview and compare stated duties to the documented role
        interviewees:
        - top
        - ciso
        - it_lead
        pitfalls:
        - id: p1
          text: Asset and risk owners named in registers have never been told they hold that role
        - id: p2
          text: Roles assigned to people who have since left or changed job
      a.5.3:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which duties have you identified as conflicting, and where is that analysis recorded?
        - id: q2
          stage: 2
          who:
          - iam
          - dev
          text: Show me how you stop one person from both requesting and approving their own access or
            change, in a real system.
        - id: q3
          stage: 2
          who:
          - ciso
          text: Where segregation is not possible because the team is small, what compensating control
            do you run and where is the evidence?
        requests:
        - id: r1
          label: Segregation of duties matrix or list of incompatible role combinations
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.seg_duty
        - id: r2
          label: Workflow configuration showing requester and approver must differ (change, access, payments)
          kind: technical
          fresh_days: 400
        - id: r3
          label: Records of compensating reviews where segregation is not technically enforced
          kind: record
          fresh_days: 100
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: changes or access approvals
          population: last 6 months
          method: check requester and approver are different people
        interviewees:
        - ciso
        - iam
        - dev
        pitfalls:
        - id: p1
          text: Developers can push straight to production with no second approver on the pipeline
        - id: p2
          text: Admins approve their own access tickets or changes
        - id: p3
          text: Small-team exception claimed but no compensating log review exists
      a.5.4:
        questions:
        - id: q1
          stage: 1
          who:
          - top
          - hr
          text: Where do you say what you expect from managers on security, and how does that reach their
            objectives or appraisals?
        - id: q2
          stage: 2
          who:
          - top
          text: How does management make sure managers and staff actually apply the security policies
            day to day?
        - id: q3
          stage: 2
          who:
          - top
          - staff
          text: Give me an example where a manager enforced or escalated a security rule within their
            team.
        requests:
        - id: r1
          label: Management communications on security expectations (memos, town hall slides, objectives)
          kind: record
          fresh_days: 400
        - id: r2
          label: If used, manager objectives or appraisal criteria that include security duties
          kind: document
        - id: r3
          label: Training completion report broken down by team or manager
          kind: record
          fresh_days: 100
          reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: line managers
          population: managers of in-scope teams
          method: interview on how they brief and supervise security behaviour
        interviewees:
        - top
        - hr
        - staff
        pitfalls:
        - id: p1
          text: Leadership commitment shown only in the policy signature, with no visible follow-through
        - id: p2
          text: Managers unaware of overdue training or open findings in their own team
      a.5.5:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me the list of authorities you would contact and in which situations.
        - id: q2
          stage: 2
          who:
          - dpo
          - ciso
          text: Who decides to notify the data protection authority or a national CSIRT, and within what
            deadline? Walk me through the last time it happened or was rehearsed.
        requests:
        - id: r1
          label: Authority contact register (regulators, CSIRT, police, supervisory authority) with owner
            and trigger
          kind: document
        - id: r2
          label: Evidence the contact list was checked recently (review date, test call or email)
          kind: record
          fresh_days: 400
        - id: r3
          label: Past notifications to authorities or exercise records
          kind: record
        sampling: []
        interviewees:
        - ciso
        - legal
        - dpo
        pitfalls:
        - id: p1
          text: Contact list has outdated numbers or names and no review date
        - id: p2
          text: Notification deadlines (for example 72 hours for personal data breaches, NIS2 timelines)
            not reflected in the incident procedure
      a.5.6:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which security communities, ISACs, forums or professional associations do you belong to,
            and who maintains each contact?
        - id: q2
          stage: 2
          who:
          - ciso
          - sec_ops
          text: Which professional groups, forums or information-sharing communities are you part of?
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Give me one example where something learned from one of those groups changed what you
            do.
        requests:
        - id: r1
          label: List of memberships and subscriptions (ISAC, CERT mailing lists, associations)
          kind: document
        - id: r2
          label: Evidence of participation (event attendance, shared advisories, forum posts)
          kind: record
          fresh_days: 400
        sampling: []
        interviewees:
        - ciso
        - sec_ops
        pitfalls:
        - id: p1
          text: Memberships listed but no one can show anything received or acted upon in the past year
      a.5.7:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: Show me which threat intelligence sources you use, who reads them, and how often.
        - id: q2
          stage: 2
          who:
          - sec_ops
          text: Pick a threat advisory from the last quarter and show me what decision or action it led
            to.
        - id: q3
          stage: 2
          who:
          - ciso
          - risk
          - sec_ops
          text: How does threat intelligence feed into your risk assessment, your detection rules and
            the scope of your security testing?
        requests:
        - id: r1
          label: Threat intelligence procedure or section defining sources, cadence, analysis and distribution
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.threat_intel
        - id: r2
          label: Recent threat intelligence summaries or bulletins issued internally
          kind: record
          fresh_days: 100
        - id: r3
          label: Tickets, risk register updates or detection rule changes triggered by intelligence
          kind: record
          fresh_days: 200
        - id: r4
          label: Configuration of feeds or platform integrations (SIEM, EDR, vulnerability scanner)
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: advisories
          population: intelligence received in the last 6 months
          method: trace each from receipt to assessment to action or documented no-action
        interviewees:
        - ciso
        - sec_ops
        - risk
        pitfalls:
        - id: p1
          text: Feeds subscribed to and landing in a mailbox nobody triages, with no record of analysis
        - id: p2
          text: 'No link between intelligence and the risk assessment: the threat catalogue has not changed
            since the last cycle'
        - id: p3
          text: Only strategic news collected; tactical and operational intelligence never considered
            or fed into detection or preventive controls
      a.5.8:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me where your project methodology requires a security assessment, and at which stage
            gates.
        - id: q2
          stage: 2
          who:
          - dev
          - it_lead
          text: Pick a project delivered this year and show me its security requirements, risk assessment
            and sign-off.
        requests:
        - id: r1
          label: Project management methodology or gate checklist with security steps
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.project
        - id: r2
          label: Project portfolio list for the last 12 months
          kind: record
          fresh_days: 400
        - id: r3
          label: Security requirement or risk assessment records for sampled projects
          kind: record
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: projects
          population: projects started or closed in the last 12 months, including non-IT ones
          method: check security step at initiation and before go-live
        interviewees:
        - ciso
        - dev
        - it_lead
        pitfalls:
        - id: p1
          text: Security checklist exists in the template but is left blank or ticked without content
        - id: p2
          text: Only product or IT development goes through the security step; infrastructure moves, new
            suppliers, office or process changes never do
      a.5.9:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me your asset inventory. How does it cover information, not just hardware?
        - id: q2
          stage: 2
          who:
          - service_desk
          text: I will pick a laptop, a server and a SaaS application from what I see today. Show me each
            one in the inventory with its owner.
        - id: q3
          stage: 2
          who:
          - service_desk
          text: How do new assets get into the inventory, and how is it kept accurate?
        requests:
        - id: r1
          label: Asset inventory export with owner, classification and location
          kind: record
          fresh_days: 100
          reference_control: urn:intuitem:risk:function:doc-pol:doc.asset_register
        - id: r2
          label: Reconciliation evidence against discovery tools (MDM, EDR, cloud console, CMDB)
          kind: technical
          fresh_days: 100
          reference_control: urn:intuitem:risk:function:doc-pol:tech.asset_discovery
        - id: r3
          label: Procedure describing how the inventory is maintained
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.asset
        sampling:
        - id: s1
          min: 10
          max: 15
          unit: assets
          population: assets observed on site, in the cloud console and in discovery tools
          method: floor-to-list and list-to-floor tracing
        interviewees:
        - service_desk
        - ciso
        pitfalls:
        - id: p1
          text: Inventory lists hardware only; information assets and SaaS tools are missing
        - id: p2
          text: Devices seen in the EDR console are absent from the inventory, or the inventory still
            lists disposed devices
        - id: p3
          text: Owner column names people who have left, or a group with no accountable contact who can
            explain what ownership involves
      a.5.10:
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: Show me your acceptable use rules for information and devices.
        - id: q2
          stage: 2
          who:
          - staff
          text: 'Ask any staff member: can they use personal cloud storage or AI chat tools for work data?
            Does their answer match the policy?'
        requests:
        - id: r1
          label: Acceptable use policy covering devices, email, internet, cloud and generative AI tools
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.accept
        - id: r2
          label: Signed acceptable use acknowledgements
          kind: record
        - id: r3
          label: Technical controls enforcing the rules (web filtering, DLP, app allow-list)
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: staff
          population: staff across departments
          method: short interview on key rules plus acknowledgement check
        interviewees:
        - staff
        - hr
        - endpoint
        pitfalls:
        - id: p1
          text: Policy silent on generative AI tools while staff use them with client data
        - id: p2
          text: Acknowledgement missing for contractors or temporary staff
      a.5.11:
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: Which assets must come back when someone leaves, and where is that list kept for each
            person?
        - id: q2
          stage: 2
          who:
          - hr
          - endpoint
          text: Walk me through what happens to a leaver's laptop, badge and tokens on their last day.
        - id: q3
          stage: 2
          who:
          - endpoint
          text: How do you make sure company data on personal devices is removed when someone leaves?
        requests:
        - id: r1
          label: Leaver checklist including asset return steps
          kind: document
        - id: r2
          label: Completed leaver checklists or asset return receipts
          kind: record
          fresh_days: 400
        - id: r3
          label: MDM records of device wipe or retirement for leavers
          kind: technical
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: leavers
          population: leavers in the last 12 months
          method: compare HR leaver list to asset return records and inventory status
        interviewees:
        - hr
        - endpoint
        pitfalls:
        - id: p1
          text: Leaver checklist completed for employees but not for contractors or interns
        - id: p2
          text: Laptops still assigned to leavers in the inventory months after departure
      a.5.12:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Show me your classification scheme and the handling rules for each level.
        - id: q3
          stage: 1
          who:
          - ciso
          - dpo
          text: How does your scheme reflect integrity and availability needs and client or contractual
            requirements, and when is a classification revisited?
        - id: q2
          stage: 2
          who:
          - staff
          text: Pick three documents from a shared drive. Who classified them and does the classification
            match the content?
        requests:
        - id: r1
          label: Classification policy with levels, criteria and handling rules
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.classif
        - id: r2
          label: Asset or information inventory showing assigned classification
          kind: record
          fresh_days: 400
        - id: r3
          label: Classification tool configuration (for example sensitivity labels)
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: documents or data sets
          population: shared drives, document management and email
          method: check assigned label against content and scheme
        interviewees:
        - ciso
        - staff
        - dpo
        pitfalls:
        - id: p1
          text: Scheme defined but staff cannot name the levels or apply them
        - id: p2
          text: Everything marked internal by default, including clearly confidential HR and client data
        - id: p3
          text: Scheme covers confidentiality only, so data whose integrity or availability is critical
            gets no distinct handling
      a.5.13:
        questions:
        - id: q1
          stage: 1
          who:
          - endpoint
          text: Show me your labelling rules. Which classification levels get a visible label, and on
            which media?
        - id: q2
          stage: 2
          who:
          - staff
          text: Show me how a confidential document is labelled, both electronically and on paper.
        - id: q3
          stage: 2
          who:
          - staff
          - endpoint
          text: What happens with labelling when information is exported, printed or emailed outside?
        requests:
        - id: r1
          label: Labelling procedure covering electronic, physical and exported formats
          kind: document
        - id: r2
          label: Screenshot of labelling tool or document templates with labels
          kind: technical
          fresh_days: 400
        - id: r3
          label: Sample labelled documents and reports
          kind: observation
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: documents
          population: documents classified above internal
          method: check presence and correctness of label
        interviewees:
        - staff
        - endpoint
        pitfalls:
        - id: p1
          text: Labels exist in templates but are stripped from exports, reports and printed copies
        - id: p2
          text: Labelling silently skipped for some outputs, such as system exports, with no written rule
            saying when that is acceptable
      a.5.14:
        questions:
        - id: q1
          stage: 1
          who:
          - network
          - legal
          text: Show me the rules for sending information outside the organisation, by channel and classification
            level.
        - id: q2
          stage: 2
          who:
          - staff
          text: Show me how a staff member would send a confidential file to a client today. Which tool,
            which protection?
        requests:
        - id: r1
          label: Information transfer policy or procedure (email, file transfer, removable media, verbal)
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.transfer
        - id: r2
          label: Agreements covering information exchange with key partners (NDA, data exchange clauses)
          kind: document
        - id: r3
          label: Configuration of secure transfer tools (email encryption, TLS enforcement, secure file
            share expiry)
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: transfers
          population: recent external transfers of sensitive data
          method: check channel used against policy for that classification
        interviewees:
        - network
        - staff
        - legal
        pitfalls:
        - id: p1
          text: Public file-sharing links with no expiry or password used for confidential data
        - id: p2
          text: Policy covers email but not messaging apps, phone calls or courier transfers
      a.5.15:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - facilities
          text: Show me your access control policy. How does it cover physical access as well as logical
            access?
        - id: q2
          stage: 2
          who:
          - iam
          text: How do you apply need-to-know and least privilege in practice? Show me the role model
            for one key application.
        requests:
        - id: r1
          label: Access control policy covering logical and physical access, need-to-know and least privilege
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.access
        - id: r2
          label: Role or profile definitions for key applications
          kind: document
        - id: r3
          label: Access control rules for one key application, showing need-to-know and need-to-use applied
          kind: document
        sampling: []
        interviewees:
        - ciso
        - iam
        - facilities
        pitfalls:
        - id: p1
          text: Policy only covers logical access; physical access rules are not aligned with data sensitivity
        - id: p2
          text: Role model documented but most users hold an admin or broad default profile
      a.5.16:
        questions:
        - id: q1
          stage: 1
          who:
          - iam
          text: Where is the identity lifecycle described, including shared, service and non-human accounts?
        - id: q2
          stage: 2
          who:
          - iam
          - hr
          text: Show me how an identity is created and who approves it. How do you link each personal
            account to one individual, and each non-human account to an accountable owner?
        - id: q3
          stage: 2
          who:
          - iam
          text: How do you handle shared, service and generic accounts? Show me the list and their owners.
        requests:
        - id: r1
          label: Identity lifecycle procedure (create, change, disable, delete)
          kind: document
        - id: r2
          label: Export of active accounts from the identity provider
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.iam
        - id: r3
          label: Register of shared, service and non-personal accounts with owner and justification
          kind: record
          fresh_days: 200
        sampling:
        - id: s1
          min: 10
          max: 10
          unit: accounts
          population: active accounts in the identity provider
          method: match each account to an HR record or a documented owner
        interviewees:
        - iam
        - hr
        pitfalls:
        - id: p1
          text: Generic and service accounts without an owner or justification
        - id: p2
          text: Accounts in the directory that do not match any current employee or contractor
      a.5.17:
        questions:
        - id: q1
          stage: 1
          who:
          - iam
          text: What are your rules for passwords, MFA and secrets, and how is a reset done without a
            phishing risk?
        - id: q5
          stage: 1
          who:
          - iam
          - staff
          text: How are staff told how to handle their passwords and tokens, and where is that written
            (policy, onboarding, terms of employment)?
        - id: q2
          stage: 2
          who:
          - iam
          text: Show me your password and MFA configuration in the identity provider.
        - id: q3
          stage: 2
          who:
          - iam
          text: How are initial passwords and reset credentials delivered, and how do you verify the person
            asking for a reset?
        - id: q4
          stage: 2
          who:
          - dev
          - iam
          text: Where are shared secrets, API keys and service passwords stored?
        - id: q6
          stage: 2
          who:
          - iam
          text: How do new users receive their first credentials, and are vendor default passwords changed
            before a system goes live?
        requests:
        - id: r1
          label: Password and MFA policy settings from the identity provider (see also A.8.5)
          kind: technical
          fresh_days: 40
        - id: r2
          label: MFA coverage report listing users without MFA (see also A.8.5)
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.mfa
        - id: r3
          label: Help desk reset procedure with identity verification steps
          kind: document
        - id: r4
          label: Evidence of a password manager or secrets vault in use
          kind: technical
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:tech.password_manager
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: password reset tickets
          population: help desk tickets in the last 6 months
          method: check identity verification was performed and recorded
        interviewees:
        - iam
        - dev
        - staff
        pitfalls:
        - id: p1
          text: MFA enforced for most users but exempted for admins, service accounts or legacy protocols
        - id: p2
          text: Secrets hard-coded in repositories or shared in chat
        - id: p3
          text: Help desk resets passwords on a phone call without verification
        - id: p4
          text: Users share credentials or reuse work passwords elsewhere, and nobody was ever briefed
            against it
      a.5.18:
        questions:
        - id: q1
          stage: 1
          who:
          - iam
          - ciso
          text: 'Show me how access rights are requested, approved and reviewed on paper: who approves,
            and how often you review.'
        - id: q2
          stage: 2
          who:
          - hr
          - iam
          text: Walk me through a joiner, a mover and a leaver, from the HR trigger to the account change.
        - id: q3
          stage: 2
          who:
          - iam
          text: Show me your last two access review cycles for a critical system. What was removed as
            a result?
        requests:
        - id: r1
          label: Access request and approval records for sampled joiners and movers
          kind: record
        - id: r2
          label: Access review records for critical systems, last 2 cycles, with sign-off and actions
          kind: record
          fresh_days: 200
          reference_control: urn:intuitem:risk:function:doc-pol:proc.recertification
        - id: r3
          label: HR leaver list and account disable dates for the same period
          kind: record
          fresh_days: 400
        - id: r4
          label: Privileged access review evidence
          kind: record
          fresh_days: 200
          reference_control: urn:intuitem:risk:function:doc-pol:proc.pam
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: joiners
          population: last 12 months
          method: compare HR dates to account creation, change and disable dates; check approvals
        - id: s2
          min: 5
          max: 5
          unit: movers
          population: last 12 months
          method: compare HR dates to account creation, change and disable dates; check approvals
        - id: s3
          min: 5
          max: 5
          unit: leavers
          population: last 12 months
          method: compare HR dates to account creation, change and disable dates; check approvals
        interviewees:
        - iam
        - hr
        - ciso
        pitfalls:
        - id: p1
          text: Access reviews signed off but no record that the revocations were actually carried out
        - id: p2
          text: Movers keep their previous rights because only joiners and leavers are processed
        - id: p3
          text: Leaver accounts disabled days or weeks after the exit date, or SaaS accounts outside SSO
            never disabled
      a.5.19:
        questions:
        - id: q1
          stage: 1
          who:
          - proc
          - ciso
          text: Show me how you classify suppliers by security risk and what you require from each tier.
        - id: q2
          stage: 2
          who:
          - proc
          text: Pick a supplier onboarded this year and show me the security assessment done before signing.
        requests:
        - id: r1
          label: Supplier security policy or procedure with tiering criteria
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.supplier
        - id: r2
          label: Supplier register with criticality, data accessed and assessment status
          kind: record
          fresh_days: 200
          reference_control: urn:intuitem:risk:function:doc-pol:doc.supplier_register
        - id: r3
          label: Completed pre-contract security assessments for new suppliers
          kind: record
          reference_control: urn:intuitem:risk:function:doc-pol:proc.tprm_assessment
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: suppliers
          population: suppliers onboarded or renewed in the last 12 months
          method: check assessment happened before contract and matches tier
          note: weighted to critical tiers
        interviewees:
        - proc
        - ciso
        - legal
        pitfalls:
        - id: p1
          text: Supplier register is a procurement list with no security tiering
        - id: p2
          text: Assessments done after the supplier was already in production
        - id: p3
