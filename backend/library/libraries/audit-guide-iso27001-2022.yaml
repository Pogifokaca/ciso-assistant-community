        - id: q3
          stage: 2
          who:
          - endpoint
          text: Show me the last lost or stolen device report and the actions taken.
        - id: q4
          stage: 2
          who:
          - endpoint
          text: Which of your equipment sits permanently outside your premises (kiosks, antennas, branch
            or remote-site network kit), and how is it protected against tampering and theft?
        requests:
        - id: r1
          label: Rules for assets used off site, in the acceptable use or remote working policy
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.work
        - id: r2
          label: Device encryption and remote wipe compliance report
          kind: technical
          fresh_days: 40
        - id: r3
          label: Lost or stolen device incident records
          kind: record
        - id: r4
          label: Record of approved equipment removals or custody hand-overs, where you require them
          kind: record
