          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.siem
        - id: r3
          label: Log retention settings and access rights to the log store
          kind: technical
          fresh_days: 100
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: systems
          population: critical assets
          method: confirm each sends logs, retrieve a specific historic event within retention
        interviewees:
        - sec_ops
        - infra
        pitfalls:
        - id: p1
          text: Critical apps or cloud services not sending logs centrally
        - id: p2
          text: Retention shorter than policy, e.g. 30 day default in a SaaS tier
        - id: p3
          text: Admins can clear the logs of their own activity
      a.8.16:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: What counts as abnormal behaviour on your network and systems, and who is responsible
            for watching for it?
        - id: q2
          stage: 2
          who:
          - sec_ops
          text: Show me your monitoring console and walk me through an alert from detection to closure.
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Is monitoring coverage outside working hours defined, and does it match how critical the
            systems are?
        requests:
        - id: r1
          label: 'Monitoring procedure: use cases, alert severities, response times, on-call'
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.monitor
        - id: r2
          label: Monitoring rules or use cases (SIEM, MDR, IDS or equivalent) and the sources they cover
          kind: technical
          fresh_days: 40
        - id: r3
          label: Alert triage tickets or MDR monthly reports
          kind: record
          fresh_days: 100
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: alerts
          population: alerts raised in last 3 months
          method: check each was triaged within target time and outcome recorded
        interviewees:
        - sec_ops
        pitfalls:
        - id: p1
          text: SIEM collects logs but nobody reviews alerts; queue of thousands untouched
        - id: p2
          text: Monitoring outsourced to an MSSP with no reports reviewed internally
        - id: p3
          text: No baseline of normal activity, so 'anomalous' is undefined
      a.8.17:
        questions:
        - id: q1
          stage: 1
          who:
          - infra
          text: Which time source do your systems use, and where is that standard documented?
        - id: q2
          stage: 2
          who:
          - infra
          text: Which time source do your systems use, and how do you know they agree?
        requests:
        - id: r1
          label: NTP configuration on domain controllers, network devices and cloud
