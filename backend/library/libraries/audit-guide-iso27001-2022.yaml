          kind: document
        - id: r3
          label: Gap tracking for legacy contracts lacking required clauses
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: contracts
          population: critical and high-tier suppliers
          method: check each required clause is present
        interviewees:
        - legal
        - proc
        pitfalls:
        - id: p1
          text: Contracts signed on supplier paper with no incident notification timeframe
        - id: p2
          text: Audit or assessment rights missing, so the organisation relies on whatever the supplier
