      a.7.7:
        questions:
        - id: q1
          stage: 1
          who:
          - facilities
          text: Show me your clear desk and clear screen rule. Does it cover home and shared workspaces?
        - id: q2
          stage: 2
          who:
          - staff
          text: What is the rule for desks and screens when people step away, and how do you check it
