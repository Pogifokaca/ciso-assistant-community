      a.7.10:
        questions:
        - id: q1
          stage: 1
          who:
          - endpoint
          text: Do you allow removable media at all? If yes, how is it controlled through its lifecycle?
        - id: q3
          stage: 1
          who:
          - endpoint
          text: How do your media handling rules change with the classification level, from purchase through
            transport to disposal, and do they include paper?
        - id: q2
          stage: 2
          who:
          - endpoint
          text: 'What stops sensitive data leaving on USB storage: a technical block, enforced encryption
            or something else? Show me.'
        requests:
        - id: r1
          label: Removable media and storage media handling rules
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.removable_media
        - id: r2
          label: Endpoint policy blocking or encrypting removable storage, with exceptions list
          kind: technical
          fresh_days: 40
        - id: r3
          label: Register or transfer log for media carrying sensitive data, such as backup tapes
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 3
          unit: exceptions or media transfers
          population: approved USB exceptions and physical media transfers in the last 12 months
          method: check approval, encryption and return or destruction
