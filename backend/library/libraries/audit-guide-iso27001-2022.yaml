        - proc
        pitfalls:
        - id: p1
          text: SaaS tools bought by business units without any security requirements
        - id: p2
          text: Requirements defined but never tested before go-live
        - id: p3
          text: Requirements drafted but never formally approved before build or purchase
      a.8.27:
        questions:
        - id: q1
          stage: 1
          who:
          - dev
          text: Which secure engineering principles do your architects follow, and where are they written?
        - id: q2
          stage: 2
          who:
          - dev
          text: Show me how a recent design was reviewed against them.
        requests:
        - id: r1
          label: Secure architecture principles or reference architecture
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.arc_principles
        - id: r2
          label: Architecture or threat model review for a recent system
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.threat_modeling
        sampling: []
        interviewees:
        - dev
        pitfalls:
        - id: p1
          text: Principles are generic copies not applied in design reviews
        - id: p2
          text: Designs of internet-facing systems not reviewed against known attack patterns (for example
            through threat modelling)
        - id: p3
          text: Principles never reviewed since they were written, and never passed on to external developers
      a.8.28:
        questions:
        - id: q1
          stage: 1
          who:
          - dev
          text: What secure coding standard do your developers follow, and how are they trained on it?
        - id: q2
          stage: 2
          who:
          - dev
          text: 'Show me a recent pull request: who reviewed it and what security checks ran automatically?'
        - id: q3
          stage: 2
          who:
          - dev
          text: How do you track and update vulnerable third-party libraries?
        requests:
        - id: r1
          label: Secure coding guideline (for example OWASP based) per language
          kind: document
        - id: r2
          label: SAST and dependency scan results from the pipeline
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.sast_dast
        - id: r3
          label: Developer secure coding training records
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:train.secdev
        - id: r4
          label: Exceptions to blocking findings with risk acceptance
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: merged pull requests
          population: merges to main branch in last 3 months
          method: check peer review, scan result and handling of findings
        interviewees:
        - dev
        pitfalls:
        - id: p1
          text: Scanners run but results ignored; criticals merged without justification
        - id: p2
          text: Self-approved merges or reviews that are a rubber stamp
        - id: p3
          text: Third-party libraries not inventoried or kept up to date; hard-coded credentials found
            in code
      a.8.29:
        questions:
        - id: q1
          stage: 1
          who:
          - dev
          text: Which security tests must pass before a release, and who signs off?
        - id: q2
          stage: 2
          who:
          - dev
          text: What security testing happens before a release goes live, and who signs off?
        - id: q3
          stage: 2
          who:
          - dev
          text: Show me the acceptance test evidence for the last significant release.
        - id: q4
          stage: 2
          who:
          - dev
          text: Who other than the developers performs acceptance testing, and how close is the test environment
            to production?
        requests:
        - id: r1
          label: Test plan or criteria including security tests
          kind: document
        - id: r2
          label: Security test results (DAST, pentest, functional security tests) for a recent release
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: releases
          population: major releases in audit period
          method: check security tests ran and acceptance was signed before deployment
        interviewees:
        - dev
        pitfalls:
        - id: p1
          text: Security testing only once a year via pentest, not per significant release
        - id: p2
          text: No acceptance criteria, so failed tests do not block go-live
      a.8.30:
        questions:
        - id: q1
          stage: 1
          who:
          - proc
          text: Which development do you outsource, and what security terms apply to it?
        - id: q2
          stage: 2
          who:
          - proc
          text: Do you use external developers? What security terms are in their contracts?
        - id: q3
          stage: 2
          who:
          - dev
          text: How do you check the code they deliver?
        requests:
        - id: r1
          label: Contracts or SOWs with secure development, IP and access clauses
          kind: document
        - id: r2
          label: Acceptance or code review records for outsourced deliverables
          kind: record
        - id: r3
          label: Supplier evidence of security testing on delivery, and the contract's right-to-audit
            clause
          kind: record
        sampling:
        - id: s1
          min: 1
          max: 2
          unit: suppliers
          population: outsourced development suppliers
          method: check contract clauses and acceptance evidence
        interviewees:
        - dev
        - proc
        pitfalls:
        - id: p1
          text: No ongoing review of the supplier's development practices, only the final deliverable
            checked
        - id: p2
          text: No review of delivered code; contract silent on security
      a.8.31:
        questions:
        - id: q1
          stage: 1
          who:
          - infra
          text: How are development, test and production kept apart, and who may access each?
        - id: q2
          stage: 2
          who:
          - infra
          text: How are development, test and production separated, and who can access production?
        - id: q3
          stage: 2
          who:
          - dev
          text: Can a developer change production directly? Show me.
        - id: q4
          stage: 2
          who:
          - infra
          text: How are development and test environments themselves protected (access, patching, secure
            configuration, monitoring)?
        requests:
        - id: r1
          label: Environment diagram showing separate accounts, subscriptions or networks
          kind: document
        - id: r2
          label: Production access list
          kind: technical
          fresh_days: 40
        sampling: []
        interviewees:
        - dev
        - infra
        pitfalls:
        - id: p1
          text: Developers have standing admin rights in production
        - id: p2
          text: Test and production share credentials or databases
      a.8.32:
        questions:
        - id: q1
          stage: 1
          who:
          - service_desk
          text: What is your change process, including emergency changes?
        - id: q2
          stage: 2
          who:
          - service_desk
          text: 'Take this change from your list: show me the request, risk assessment, approval, test
            and rollback plan.'
        - id: q3
          stage: 2
          who:
          - service_desk
          - dev
          text: How do you detect a change that bypassed the process?
        requests:
        - id: r1
          label: Change management procedure
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.change_mgmt
        - id: r2
          label: Change log or ticket export for audit period
          kind: record
          fresh_days: 40
        - id: r3
          label: Emergency change records with retrospective approval
          kind: record
        sampling:
        - id: s1
          min: 10
          max: 25
          unit: changes
          population: changes in audit period, including emergency ones
          method: auditor picks from the full list or from system logs, then checks approval, testing
            and separation of approver and implementer
        interviewees:
        - service_desk
        - dev
        pitfalls:
        - id: p1
          text: Changes seen in deployment or audit logs with no ticket
        - id: p2
          text: Implementer approves own change
        - id: p3
          text: Emergency changes never reviewed after the fact
      a.8.33:
        questions:
        - id: q1
          stage: 1
          who:
          - dev
          text: What are your rules for using production data in test, and who approves exceptions?
        - id: q2
          stage: 2
          who:
          - dev
          text: Where does your test data come from, and is any of it real production data?
        - id: q3
          stage: 2
          who:
          - dev
          - dpo
          text: If production data is copied to test, who approves it and when is it removed?
        requests:
        - id: r1
          label: Test data rules or procedure
          kind: document
        - id: r2
          label: Approval and deletion records for production data copies
          kind: record
        sampling:
        - id: s1
          min: 1
          max: 1
          unit: test environment
          population: non-production environments
          method: inspect sample records for real personal or confidential data
        interviewees:
        - dev
        - dpo
        pitfalls:
        - id: p1
          text: Full production dumps in test with weaker access control
        - id: p2
          text: Copies never deleted after testing
      a.8.34:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          - auditor
          text: How do you plan and approve audits or tests that touch live systems?
        - id: q2
          stage: 2
          who:
          - sec_ops
          text: When auditors or pentesters test live systems, how do you plan and control that access?
        requests:
        - id: r1
          label: Rules of engagement or authorisation for the last penetration test or technical audit
          kind: record
          fresh_days: 400
        - id: r2
          label: Evidence that temporary auditor or tester accounts were removed
          kind: record
        sampling: []
        interviewees:
        - sec_ops
        - auditor
        pitfalls:
        - id: p1
          text: Pentest run without written scope or timing agreed with operations
        - id: p2
          text: Tester accounts still active months later
        - id: p3
          text: Testers given write or admin access to live systems when read-only would do, or disruptive
            tests run during business hours
    sessions:
    - id: opening
      label: Opening meeting
      members: []
      requests:
      - id: r1
        label: 'What changed since Stage 1: scope, organisation, sites, systems, key suppliers'
        kind: document
      - id: r2
        label: Each Stage 1 finding with the action taken and its evidence
        kind: record
      - id: r3
        label: Current Statement of Applicability, dated, with the reason for each exclusion
        kind: document
        reference_control: urn:intuitem:risk:function:doc-pol:doc.soa
      - id: r4
        label: A named contact reachable for the whole audit, sent with the documents ahead of day 1
        kind: document
      - id: r5
        label: Complaints about the certified scope and how they were handled; use of the certification
          mark once certified
        kind: record
      - id: r6
        label: Progress on the controls the Statement of Applicability showed as planned or in progress
          at Stage 1
        kind: record
      pitfalls:
      - id: p1
        text: Documents not ready at the opening meeting, or shared over an unprotected channel
      - id: p2
        text: An in-scope system not in its production state on the day can be taken out of scope
      - id: p3
        text: 'What was only stated at Stage 1 is now expected as a record: signatures, test results,
          logs'
