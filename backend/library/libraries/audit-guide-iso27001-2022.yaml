          fresh_days: 40
        sampling: []
        interviewees:
        - facilities
        - infra
        pitfalls:
        - id: p1
          text: Network equipment in an open office cupboard or under a desk, reachable by anyone
        - id: p2
          text: Equipment room with no temperature monitoring or alerting
      a.7.9:
        questions:
        - id: q1
          stage: 1
          who:
          - endpoint
          text: What are the rules for laptops, phones and media used outside your premises?
        - id: q2
          stage: 2
          who:
          - endpoint
          text: How do you protect laptops and other assets that leave the office, and what happens when
