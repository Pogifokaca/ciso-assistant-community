      a.8.20:
        questions:
        - id: q1
          stage: 1
          who:
          - network
          text: Show me your current network diagram. Where are the trust boundaries and remote access
            paths?
        - id: q2
          stage: 2
          who:
          - network
          text: Show me your current network diagram and tell me when it was last updated.
        - id: q3
          stage: 2
          who:
          - network
          text: How are firewall rules reviewed, and when was the last review?
        - id: q4
          stage: 2
          who:
          - network
          text: How is admin access to network devices controlled?
        requests:
        - id: r1
          label: Up-to-date network diagram including cloud and remote access
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.is_map
        - id: r2
