      a.8.1:
        questions:
        - id: q1
          stage: 1
          who:
          - endpoint
          text: Which rules apply to laptops and phones that hold company data, and where are they written
            down?
        - id: q2
          stage: 2
          who:
          - endpoint
          - staff
          text: Pick any laptop in this room. Show me it is encrypted, managed and patched.
        - id: q3
          stage: 2
          who:
          - endpoint
          text: What happens when a device is lost or stolen? Walk me through the last case.
        requests:
        - id: r1
          label: Endpoint or acceptable use policy covering company and personal devices
          kind: document
        - id: r2
          label: 'MDM or endpoint management export: device list with encryption, OS version and last
            check-in'
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.mdm
        - id: r3
          label: Lost or stolen device records showing the procedure followed (for example lock or remote
            wipe)
          kind: record
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: devices
          population: managed endpoint inventory
          method: pick devices from the MDM list and from people met on site, compare compliance status
            with the policy
        interviewees:
        - endpoint
        - staff
        pitfalls:
        - id: p1
          text: 'Device inventory does not match HR headcount: some staff use unmanaged laptops'
        - id: p2
          text: Personal phones read company email with no MDM or app protection policy, even though BYOD
            is said to be banned
        - id: p3
          text: Devices that stopped checking in months ago are still counted as compliant
      a.8.2:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: How do you define a privileged account, and who approves granting one?
        - id: q2
          stage: 2
          who:
          - iam
          text: Show me the list of admin accounts on your identity provider, cloud console and production
            servers today.
        - id: q3
          stage: 2
          who:
          - iam
          text: Do administrators use a separate account for admin work, or their everyday account?
        - id: q4
          stage: 2
          who:
          - iam
          text: How do you limit privileged access in time, including break-glass accounts, and where
            is privileged activity logged?
        requests:
        - id: r1
          label: Inventory of privileged accounts, including service and break-glass accounts, with named
            owners
          kind: record
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:doc.pam_register
        - id: r2
          label: Approval tickets for privileged access granted in the audit period
          kind: record
        - id: r3
          label: Last privileged access review with reviewer, decisions and removals applied
          kind: record
          fresh_days: 100
          reference_control: urn:intuitem:risk:function:doc-pol:proc.pam
        - id: r4
          label: Live export of admin role members from the IdP and main cloud tenant
          kind: technical
          fresh_days: 40
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: privileged accounts
          population: current admin role members across IdP, cloud and production
          method: trace each to an approval and a review entry; check for leavers and shared logins
        interviewees:
        - iam
        - ciso
        pitfalls:
        - id: p1
          text: No single list of privileged accounts exists; it is rebuilt for the audit
        - id: p2
          text: Global admin role held by more people than needed, including former contractors
        - id: p3
          text: Service accounts with admin rights have no owner, and their credentials are not managed
            or changed when an administrator leaves
        - id: p4
          text: Administrators never acknowledged the rules that apply to their privileged accounts
      a.8.3:
        questions:
        - id: q1
          stage: 1
          who:
          - iam
          text: How do you decide who can see what inside your main business applications?
        - id: q2
          stage: 2
          who:
          - iam
          - staff
          text: Log in with a standard user and show me you cannot open records outside that user's role.
        - id: q3
          stage: 2
          who:
          - iam
          text: How do you control access to shared drives and SharePoint sites holding confidential data?
        requests:
        - id: r1
          label: Role or permission matrix for key applications
          kind: document
        - id: r2
          label: Export of permissions on a confidential share or site
          kind: technical
          fresh_days: 40
        - id: r3
          label: Configuration showing how access is enforced per role in one business application (periodic
            reviews are checked under A.5.18)
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: users
          population: users of one critical application
          method: compare actual permissions with role matrix and job title
        interviewees:
        - iam
        - staff
        pitfalls:
        - id: p1
          text: Confidential folders shared with 'Everyone' or via anonymous links
        - id: p2
          text: Role matrix exists on paper but application permissions were granted ad hoc
      a.8.4:
        questions:
        - id: q1
          stage: 1
          who:
          - dev
          text: Who may read or change source code, and where is that rule written for each repository?
        - id: q2
          stage: 2
          who:
          - dev
          text: Who has write access to your source code repositories, and how is that reviewed?
        - id: q3
          stage: 2
          who:
          - dev
          text: Can a developer push directly to the main branch? Show me the branch protection settings.
        - id: q4
          stage: 2
          who:
          - dev
          text: Who can change CI/CD pipelines, build tools and internal package registries?
        requests:
        - id: r1
          label: Repository access list with roles per repo or group
          kind: technical
          fresh_days: 40
        - id: r2
          label: Branch protection or merge rule screenshots for production repositories
          kind: technical
          fresh_days: 40
        - id: r3
          label: Offboarding evidence removing a leaver from the code platform
          kind: record
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: repositories
          population: production code repos and recent leavers with dev access
          method: check protection settings and confirm leaver accounts removed
        - id: s2
          min: 3
          max: 3
          unit: leavers
          population: production code repos and recent leavers with dev access
          method: check protection settings and confirm leaver accounts removed
        interviewees:
        - dev
        pitfalls:
        - id: p1
          text: Ex-employees or external contractors still members of the GitHub or GitLab organisation
        - id: p2
          text: Admins can bypass branch protection and do so without trace of review
        - id: p3
          text: Write access to production repositories or build pipelines broader than the designated
            owners
      a.8.5:
        questions:
        - id: q1
          stage: 1
          who:
          - iam
          text: What is your password and MFA rule, and which systems does it cover?
        - id: q4
          stage: 1
          who:
          - iam
          text: How did you decide which systems and accounts need MFA or other stronger authentication?
        - id: q2
          stage: 2
          who:
          - iam
          text: Show me the MFA enforcement settings and the list of users or apps excluded from it.
        - id: q3
          stage: 2
          who:
          - iam
          text: How do you handle legacy protocols and apps that cannot do MFA?
        requests:
        - id: r1
          label: 'Authentication standard: password rules, MFA scope, lockout'
          kind: document
        - id: r2
          label: IdP conditional access or MFA policy configuration export
          kind: technical
          fresh_days: 40
        - id: r3
          label: Report of accounts without MFA registered
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.mfa
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: systems
          population: internet-facing and critical apps
          method: test login flow and confirm SSO or MFA is enforced
        interviewees:
        - iam
        pitfalls:
        - id: p1
          text: Where policy requires MFA, it is enforced for staff but excluded for admin, service or
            'VIP' accounts
        - id: p2
          text: Legacy authentication still allowed, bypassing MFA
        - id: p3
          text: Some SaaS tools use local logins outside SSO with weak passwords
      a.8.6:
        questions:
        - id: q1
          stage: 1
          who:
          - infra
          text: Which resources do you track for capacity, and what thresholds trigger action?
        - id: q2
          stage: 2
          who:
          - infra
          text: How do you know when a critical system is running out of storage, CPU or licences before
            it fails?
        - id: q3
          stage: 2
          who:
          - infra
          text: Show me a capacity alert and what was done about it.
        - id: q4
          stage: 2
          who:
          - infra
          text: How do you project future capacity needs for new business or projects, especially resources
            with long lead times?
        requests:
        - id: r1
          label: Monitoring dashboard or thresholds for critical systems
          kind: technical
          fresh_days: 40
        - id: r2
          label: Capacity review or planning minutes, or ticket resulting from a capacity alert
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.capacity_mgmt
        sampling: []
        interviewees:
        - infra
        pitfalls:
        - id: p1
          text: Thresholds configured but alerts go to an unmonitored mailbox
        - id: p2
          text: Past incident caused by full disk or quota with no follow-up capacity action
      a.8.7:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: What is your malware protection approach across endpoints, servers, email and cloud?
        - id: q2
          stage: 2
          who:
          - sec_ops
          - endpoint
          text: What anti-malware or EDR covers your endpoints and servers, and how do you know none are
            missing it?
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Show me the last malware detection and how it was handled.
        - id: q4
          stage: 2
          who:
          - staff
          - sec_ops
          text: How do staff learn to spot phishing, and what happens when they report one?
        requests:
        - id: r1
          label: 'Anti-malware or EDR console export: coverage, agent health, outdated agents'
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.endpoint_protection
        - id: r2
          label: Detection or quarantine events with handling tickets
          kind: record
          fresh_days: 100
        - id: r3
          label: Email filtering configuration and phishing awareness records
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:tech.mail_gateway
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: devices
          population: asset inventory and malware detections
          method: reconcile the inventory against protected devices; trace detections to closure
        - id: s2
          min: 2
          max: 2
          unit: detections
          population: asset inventory and malware detections
          method: reconcile the inventory against protected devices; trace detections to closure
        interviewees:
        - sec_ops
        - endpoint
        - staff
        pitfalls:
        - id: p1
          text: Asset inventory and EDR agent count differ, servers or Linux hosts left uncovered
        - id: p2
          text: Local admins can disable the agent and some have
      a.8.8:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: What are your remediation deadlines per severity, and what is in scope of scanning?
        - id: q4
          stage: 1
          who:
          - sec_ops
          text: How do you learn about new vulnerabilities in software and devices you cannot scan (vendor
            advisories, CVE feeds, supplier notices), and who triages them against your asset inventory?
        - id: q2
          stage: 2
          who:
          - sec_ops
          text: Show me your latest scan and how many criticals are past their deadline.
        - id: q3
          stage: 2
          who:
          - sec_ops
          - infra
          text: 'Take this critical from three months ago: when was it found, when fixed, and how did
            you verify the fix?'
        requests:
        - id: r1
          label: Vulnerability management procedure with severity based SLAs
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.vulnerability
        - id: r2
          label: Latest internal and external vulnerability scan reports
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.vuln_scanner
        - id: r3
          label: Latest penetration test or vulnerability assessment report, if performed, and its remediation
            tracker
          kind: record
          reference_control: urn:intuitem:risk:function:doc-pol:proc.pentest
        - id: r4
          label: Patch compliance report for servers and endpoints
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:proc.update
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: high or critical findings
          population: scan and pentest findings in the audit period
          method: check detection date, ticket, fix date versus SLA, rescan evidence; exceptions need
            risk acceptance
        interviewees:
        - sec_ops
        - infra
        pitfalls:
        - id: p1
          text: Scans run but critical findings sit open for months with no risk acceptance
        - id: p2
          text: Scan scope misses cloud workloads, containers or newly added subnets
        - id: p3
          text: Pentest findings not tracked to closure; same issues reappear in next report
      a.8.9:
        questions:
        - id: q1
          stage: 1
          who:
          - infra
          text: Which secure configuration baselines do you use for servers, endpoints, network gear and
            cloud, and who owns them?
        - id: q2
          stage: 2
          who:
          - infra
          text: Show me how you detect a system that has drifted from its baseline.
        - id: q3
          stage: 2
          who:
          - infra
          text: 'Here is a production server: show me its current settings against the baseline.'
        requests:
        - id: r1
          label: Hardening baselines or templates (for example CIS based) per platform, with version and
            review date
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.hardening
        - id: r2
          label: Configuration compliance or drift report from a tool (Intune, GPO, CSPM, Ansible, Terraform
            state)
          kind: technical
          fresh_days: 40
        - id: r3
          label: Records of deviations from baseline with approval
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: systems
          population: critical servers, network devices and cloud accounts
          method: compare live configuration to the documented baseline
        interviewees:
        - infra
        - sec_ops
        pitfalls:
        - id: p1
          text: Baseline referenced in policy but never tailored, versioned or reviewed
        - id: p2
          text: Network devices and cloud services left out; only Windows covered by GPO
        - id: p3
          text: Default passwords or services still active on appliances
      a.8.10:
        questions:
        - id: q1
          stage: 1
          who:
          - dpo
          - legal
          text: How do you decide when information must be deleted, and is that tied to your retention
            schedule?
        - id: q2
          stage: 2
          who:
          - infra
          text: Show me that data past its retention date was deleted in an application, and how backup
            retention makes old copies expire.
        - id: q3
          stage: 2
          who:
          - infra
          text: How are disks and devices wiped or destroyed when retired, and by whom?
        requests:
        - id: r1
          label: Retention and deletion schedule per data category
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.retention
        - id: r2
          label: Deletion logs or purge job outputs from a key system
          kind: record
          fresh_days: 400
        - id: r3
          label: Certificates of destruction or wipe reports for retired media
          kind: record
          reference_control: urn:intuitem:risk:function:doc-pol:phys.equipment_disposal
        - id: r4
          label: Contract clauses or attestations of deletion from SaaS and cloud providers
          kind: document
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: retired devices
          population: assets disposed in audit period
          method: trace asset tag to wipe or destruction certificate; check records older than retention
            period are gone
        - id: s2
          min: 1
          max: 1
          unit: data category
          population: assets disposed in audit period
          method: trace asset tag to wipe or destruction certificate; check records older than retention
            period are gone
        interviewees:
        - infra
        - dpo
        - legal
        pitfalls:
        - id: p1
          text: Retention periods defined but no deletion mechanism exists; data is kept forever
        - id: p2
          text: Disposed laptops have no wipe or destruction certificate linked to serial numbers
        - id: p3
          text: Deletion of former customers' data in SaaS tools never requested or confirmed
      a.8.11:
        questions:
        - id: q1
          stage: 1
          who:
          - dpo
          text: Where do you use masking, pseudonymisation or anonymisation, and what drove that decision?
        - id: q2
          stage: 2
          who:
          - dev
          text: Show me how personal data looks in your test or analytics environment.
        - id: q3
          stage: 2
          who:
          - dev
          text: Which users see full card numbers or IDs in the application, and why?
        - id: q4
          stage: 2
          who:
          - dpo
          - dev
          text: How did you check that pseudonymised or anonymised data cannot be re-identified by combining
            fields?
        requests:
        - id: r1
          label: Data masking or pseudonymisation rules mapped to data classification
          kind: document
        - id: r2
          label: Screenshot of masked fields in application or non-production database
          kind: technical
          fresh_days: 100
        - id: r3
          label: Role configuration showing who can unmask data
          kind: technical
          fresh_days: 100
        sampling:
        - id: s1
          min: 1
          max: 2
          unit: datasets
          population: non-production copies and reporting extracts
          method: inspect records for unmasked personal or sensitive data
        interviewees:
        - dev
        - dpo
        pitfalls:
        - id: p1
          text: Production database cloned to test with real personal data and no masking
        - id: p2
          text: Control marked applicable with no defined approach; or excluded without justification
            while personal data is processed
        - id: p3
          text: Data called anonymised can still be re-identified by combining fields, and nobody checked
        - id: p4
          text: Least privilege offered as the masking measure; the auditor wants which data is masked,
            by which technique and with which tool
      a.8.12:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: Which channels could sensitive data leak through, and which ones do you control?
        - id: q2
          stage: 2
          who:
          - endpoint
          text: Show me what happens if I email a file labelled confidential to a personal address or
            copy it to USB.
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: If a DLP tool is used, who reviews its alerts and what did the last ones lead to?
        requests:
        - id: r1
          label: 'Leakage channel analysis: sensitive information types, channels, and the measure chosen
            for each channel'
          kind: document
        - id: r2
          label: DLP tool configuration export, if a DLP tool is used (M365 Purview, CASB, endpoint)
          kind: technical
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:tech.dlp
        - id: r3
          label: DLP alert log and triage records, if a DLP tool is used
          kind: record
          fresh_days: 100
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: alerts
          population: DLP events in the last quarter, if a DLP tool is used
          method: check each was reviewed and closed with a decision
        interviewees:
        - sec_ops
        - endpoint
        pitfalls:
        - id: p1
          text: DLP in audit-only mode since rollout, alerts never reviewed
        - id: p2
          text: Rules do not match the classification scheme so labelled data is not detected
        - id: p3
          text: Personal cloud storage, USB and unmanaged browsers not covered
        - id: p4
          text: Monitoring of staff communications deployed without checking privacy law or works council
            obligations
      a.8.13:
        questions:
        - id: q1
          stage: 1
          who:
          - infra
          text: What is backed up, how often, how long is it kept, and where are copies held?
        - id: q2
          stage: 2
          who:
          - infra
          text: When did you last restore from backup as a test, and what was the result?
        - id: q3
          stage: 2
          who:
          - infra
          text: Could ransomware with admin rights delete or encrypt your backups?
        requests:
        - id: r1
          label: Backup policy or schedule per system with RPO and retention
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.backup
        - id: r2
          label: Backup job reports showing success and failures
          kind: technical
          fresh_days: 40
        - id: r3
          label: Restore test records with date, scope, outcome and duration
          kind: record
          fresh_days: 400
        - id: r4
          label: Evidence of how backup copies are kept apart from, and protected against a compromise
            of, production (offsite, offline or immutable, as the risk assessment requires)
          kind: technical
          fresh_days: 100
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: systems
          population: critical systems in the asset register
          method: check each appears in backup jobs, verify recent success and at least one restore test
        interviewees:
        - infra
        pitfalls:
        - id: p1
          text: No restore test ever performed, or only single file restores
        - id: p2
          text: SaaS data (M365, CRM) assumed backed up by the provider
        - id: p3
          text: Failed jobs recurring for weeks with no ticket
      a.8.14:
        questions:
        - id: q1
          stage: 1
          who:
          - infra
          text: Which services need redundancy, and how did you derive that from their availability requirements?
        - id: q2
          stage: 2
          who:
          - infra
          text: Which systems must stay available, and what redundancy do they have?
        - id: q3
          stage: 2
          who:
          - infra
          text: Have you tested a failover? Show me the result.
        requests:
        - id: r1
          label: Availability requirements per critical service (from BIA or risk assessment)
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.bia
        - id: r2
          label: Architecture diagram showing redundant components, zones or sites
          kind: document
        - id: r3
          label: Failover test report
          kind: record
          fresh_days: 400
        sampling: []
        interviewees:
        - infra
        pitfalls:
        - id: p1
          text: Single points of failure (one firewall, one internet link, one region) not covered by
            risk treatment
        - id: p2
          text: Redundancy designed but never tested
      a.8.15:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: What events do you log, on which systems, and how long do you keep logs?
        - id: q2
          stage: 2
          who:
          - infra
          text: Show me the admin login events for this server from last month.
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Who can delete or alter logs, and how would you know?
        - id: q4
          stage: 2
          who:
          - sec_ops
          text: Who analyses these logs, how often? Show me a recent review and what came of it.
        requests:
        - id: r1
          label: 'Logging standard: sources, event types, retention'
