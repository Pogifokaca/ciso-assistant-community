            commonly ask for one or the other)
        - id: p2
          text: Severity criteria do not tie to regulatory notification thresholds
      a.5.25:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: What turns an event into an incident here? Show me the criteria and who makes the call.
        - id: q2
          stage: 2
          who:
          - sec_ops
          - service_desk
          text: 'Show me how an event becomes an incident: who decides, using which criteria?'
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Pick three events from the log that were not escalated. Why not?
        requests:
        - id: r1
          label: Event triage criteria or classification matrix
          kind: document
        - id: r2
          label: Event and incident log or ticket queue for the last 12 months
          kind: record
          fresh_days: 100
          reference_control: urn:intuitem:risk:function:doc-pol:doc.incident_register
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: events
          population: events and alerts in the last 12 months
          method: check triage decision is recorded and consistent with criteria
        interviewees:
        - sec_ops
        - service_desk
        pitfalls:
        - id: p1
          text: Zero incidents recorded in a year, which suggests events are closed in the service desk
            without security triage
        - id: p2
          text: Triage decisions not recorded, so nobody can explain why an event was dismissed
      a.5.26:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which incident scenarios have a written response, and who has the authority to act on
            them?
        - id: q2
          stage: 2
          who:
          - sec_ops
          text: Pick your most serious incident of the year. Walk me through detection, containment, communication
            and closure.
        - id: q3
          stage: 2
          who:
          - ciso
          - legal
          text: Who was notified, including customers or authorities, and when?
        requests:
        - id: r1
          label: Incident records with timeline, actions and closure
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.incident_register
        - id: r2
          label: Communication records for notified parties
          kind: record
        - id: r3
          label: Playbooks for common incident types (phishing, ransomware, data leak)
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.incident
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: incidents
          population: incidents in the last 12 months
          method: trace from detection to closure against the procedure
          note: including the most severe
        interviewees:
        - sec_ops
        - ciso
        - legal
        pitfalls:
        - id: p1
          text: Timeline missing, so notification deadlines cannot be shown to have been met
        - id: p2
          text: Incidents closed without root cause or with open containment actions
      a.5.27:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: How is an incident closed, and where does the post-incident review get recorded?
        - id: q2
          stage: 2
          who:
          - ciso
          - sec_ops
          text: Show me a lessons-learned review from a past incident and the actions it produced.
        - id: q3
          stage: 2
          who:
          - ciso
          - risk
          text: How do incident trends feed into your risk assessment and awareness programme?
        requests:
        - id: r1
          label: Post-incident review reports
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.post_incident
        - id: r2
          label: Corrective action tracking linked to incidents
          kind: record
          fresh_days: 400
        - id: r3
          label: Incident trend summary presented to management review
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: significant incidents
          population: incidents of medium severity or above
          method: check review held and actions closed
        interviewees:
        - ciso
        - sec_ops
        - risk
        pitfalls:
        - id: p1
          text: Lessons learned written but actions never assigned or closed
        - id: p2
          text: Repeated incidents of the same type with no change to controls or risk register
      a.5.28:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: Show me your procedure for collecting and preserving digital evidence.
        - id: q2
          stage: 2
          who:
          - sec_ops
          - legal
          text: If you needed to support legal action after an incident, how would you show the evidence
            was not altered?
        requests:
        - id: r1
          label: Evidence handling procedure with chain of custody form
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.forensics
        - id: r2
          label: Completed chain of custody records, if any
          kind: record
        - id: r3
          label: Log retention settings for key systems (see also A.8.15)
          kind: technical
          fresh_days: 400
        sampling: []
        interviewees:
        - sec_ops
        - legal
        pitfalls:
        - id: p1
          text: No chain of custody form; responders reimage machines before preserving evidence
        - id: p2
          text: No guidance on legal admissibility or jurisdiction; legal counsel or law enforcement only
            involved after the evidence was already handled
      a.5.29:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: Which security controls must keep running during a disruption, and where is that written
            down?
        - id: q2
          stage: 2
          who:
          - ciso
          - risk
          text: During a disruption, which security controls must stay in place and how is that written
            into your continuity plans?
        - id: q3
          stage: 2
          who:
          - infra
          text: In your last continuity test, did access control and logging keep working? How do you
            know?
        requests:
        - id: r1
          label: Business continuity plans with security requirements during disruption
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.bcp
        - id: r2
          label: Continuity test reports covering security aspects
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.bcp_exercise
        sampling: []
        interviewees:
        - ciso
        - infra
        - risk
        pitfalls:
        - id: p1
          text: Continuity plans focus on availability and allow bypassing security (shared admin accounts,
            disabled MFA) without controls
        - id: p2
          text: Recovery site not covered by the same security monitoring as production
      a.5.30:
        questions:
        - id: q1
          stage: 1
          who:
          - risk
          - infra
          text: Show me how your ICT recovery objectives were derived from the business impact analysis.
        - id: q2
          stage: 2
          who:
          - infra
          text: Show me the last disaster recovery or restore test for a critical service. Did you meet
            the RTO and RPO?
        - id: q3
          stage: 2
          who:
          - infra
          text: When a test failed or overran, what did you do about it?
        requests:
        - id: r1
          label: Business impact analysis listing critical processes, supporting ICT services, RTO and
            RPO
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.bia
        - id: r2
          label: ICT continuity or disaster recovery plans for critical services
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.drp
        - id: r3
          label: DR and restore test reports with measured recovery times
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.bcp_exercise
        - id: r4
          label: Corrective actions raised from failed or partial tests
          kind: record
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: critical ICT services
          population: services supporting critical processes in the BIA
          method: compare BIA objectives to plan and to measured test results
        interviewees:
        - infra
        - ciso
        - risk
        pitfalls:
        - id: p1
          text: RTO and RPO set by IT without a BIA, or BIA objectives that the architecture cannot meet
        - id: p2
          text: Backups tested by checking job success, never by an actual restore within the RTO
        - id: p3
          text: Test results not compared to objectives, so misses never become corrective actions
      a.5.31:
        questions:
        - id: q1
          stage: 1
          who:
          - legal
          text: Show me your register of legal, regulatory and contractual requirements relevant to security.
        - id: q2
          stage: 2
          who:
          - legal
          text: How do you find out about a new or changed law that affects you? Show me the last update
            you made.
        requests:
        - id: r1
          label: Legal and regulatory requirements register with owner and applicability
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.legal
        - id: r2
          label: Evidence of periodic review of the register
          kind: record
          fresh_days: 400
        - id: r3
          label: Analysis of cryptography export or use restrictions where relevant
          kind: document
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: requirements
          population: entries in the register
          method: check how each is met by a control or process
        interviewees:
        - legal
        - ciso
        - dpo
        pitfalls:
        - id: p1
          text: Register not updated for recent regulations such as NIS2, DORA or sector rules
        - id: p2
          text: Contractual security commitments to customers not captured, so nobody tracks them
      a.5.32:
        questions:
        - id: q1
          stage: 1
          who:
          - service_desk
          - dev
          text: How do you track software licences and the reuse of third-party or open source content?
        - id: q2
          stage: 2
          who:
          - service_desk
          - dev
          text: How do you make sure software in use is licensed and that open source licences are respected?
        - id: q3
          stage: 2
          who:
          - service_desk
          text: Show me the licence count against installations for one commercial product.
        requests:
        - id: r1
          label: Software licence register or software asset management report
          kind: record
          fresh_days: 200
        - id: r2
          label: Software installation restrictions (no local admin, approved software list)
          kind: technical
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:tech.app_control
        - id: r3
          label: Open source licence policy or scan results for developed software
          kind: technical
          fresh_days: 400
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: products
          population: commercial software and SaaS in use
          method: compare entitlements to installations or users
        interviewees:
        - service_desk
        - legal
        - dev
        pitfalls:
        - id: p1
          text: No reconciliation of licences to installations
        - id: p2
          text: Copyleft components shipped in products without licence review
      a.5.33:
        questions:
        - id: q1
          stage: 1
          who:
          - legal
          - dpo
          text: Show me your retention schedule for records, including legal basis.
        - id: q2
          stage: 2
          who:
          - infra
          text: Pick a record type and show me that it is kept for the right period and then destroyed.
        - id: q3
          stage: 2
          who:
          - infra
          text: How do you stop records being altered or read by the wrong people, and how will you still
            read archived or encrypted records at the end of their retention period?
        requests:
        - id: r1
          label: Records retention schedule by record type
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.retention
        - id: r2
          label: Evidence of retention settings in systems (mail, document management, backups)
          kind: technical
          fresh_days: 400
        - id: r3
          label: Destruction or deletion logs
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 3
          max: 3
          unit: record types
          population: record types in the retention schedule
          method: check system configuration and existence of records at expected age
        interviewees:
        - legal
        - dpo
        - infra
        pitfalls:
        - id: p1
          text: Retention schedule exists but systems keep everything forever
        - id: p2
          text: Records needed for ISMS evidence (logs, review records) deleted before the audit cycle
        - id: p3
          text: Archived records encrypted with keys, or stored in formats, that are no longer kept or
            supported
        - id: p4
          text: Records needed for audit or legal purposes can be edited by the people they describe
      a.5.34:
        questions:
        - id: q1
          stage: 1
          who:
          - dpo
          - legal
          text: Which laws on personal data apply to you, and where do you show how your controls cover
            them?
        - id: q2
          stage: 2
          who:
          - dpo
          text: Show me your record of processing activities and how it links to your security controls.
        - id: q3
          stage: 2
          who:
          - dpo
          - ciso
          text: Who is your DPO or privacy lead, and how do privacy and security work together on a breach?
        requests:
        - id: r1
          label: Record of processing activities
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.ropa
        - id: r2
          label: Privacy policy and internal data protection policy
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.privacy
        - id: r3
          label: DPIAs for high-risk processing
          kind: record
          reference_control: urn:intuitem:risk:function:doc-pol:proc.dpia
        - id: r4
          label: Personal data breach register
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:proc.breach_notif
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: processing activities
          population: entries in the record of processing
          method: check legal basis, retention and security measures are documented
        interviewees:
        - dpo
        - legal
        - ciso
        pitfalls:
        - id: p1
          text: Record of processing incomplete or not updated after new systems went live
        - id: p2
          text: Breach register kept separately from the incident log, with inconsistencies between them
      a.5.35:
        questions:
        - id: q1
          stage: 1
          who:
          - auditor
          text: How is the ISMS reviewed independently, and who does it? Show me the plan for this cycle.
        - id: q2
          stage: 2
          who:
          - auditor
          text: When was your security approach last reviewed by someone independent of the people running
            it? Show me the report.
        - id: q3
          stage: 2
          who:
          - ciso
          text: Show me how the findings of that review were tracked to closure.
        - id: q4
          stage: 2
          who:
          - top
          - ciso
          text: After your last significant change (reorganisation, new hosting, merger), was an independent
            review considered?
        requests:
        - id: r1
          label: Independent review plan or reports (internal audit, external assessment or an independent
            manager) covering people, processes and technology
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.audit_plan
        - id: r2
          label: Independent review or internal audit reports
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:pol.audit
        - id: r3
          label: Evidence of auditor independence and competence
          kind: record
        - id: r4
          label: Findings tracker with status and closure evidence
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.nc_log
        sampling: []
        interviewees:
        - auditor
        - ciso
        - top
        pitfalls:
        - id: p1
          text: Internal auditor audits their own work
        - id: p2
          text: Nobody can show which parts of the ISMS were independently reviewed, or over what period
        - id: p3
          text: Findings from the last review still open with no target date
      a.5.36:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: How do managers check that their teams follow the policies, and how often?
        - id: q2
          stage: 2
          who:
          - it_lead
          text: How do managers check compliance with security policies in their area? Show me the last
            check.
        - id: q3
          stage: 2
          who:
          - it_lead
          text: Show me a technical compliance review, such as a configuration scan against your hardening
            standard.
        requests:
        - id: r1
          label: Compliance check schedule or self-assessment programme
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.compliance_monitoring
        - id: r2
          label: Results of compliance checks and technical scans
          kind: record
          fresh_days: 200
        - id: r3
          label: Non-compliance log with corrective actions
          kind: record
          fresh_days: 400
          reference_control: urn:intuitem:risk:function:doc-pol:doc.nc_log
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: non-compliances
          population: issues raised in the last 12 months
          method: check root cause and corrective action recorded
        interviewees:
        - ciso
        - it_lead
        - auditor
        pitfalls:
        - id: p1
          text: Compliance checks only happen through the annual internal audit
        - id: p2
          text: Scans run but deviations from baseline never triaged
      a.5.37:
        questions:
        - id: q1
          stage: 1
          who:
          - service_desk
          text: Show me the list of documented operating procedures for your IT operations.
        - id: q2
          stage: 2
          who:
          - service_desk
          text: Pick a routine task such as backup or user creation. Show me the procedure and have the
            operator walk me through it.
        - id: q3
          stage: 2
          who:
          - service_desk
          text: Where does an on-call operator find the procedure at 3am, including when the main wiki
            or single sign-on is down?
        requests:
        - id: r1
          label: Index of operating procedures with owner and review date
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.proc_register
        - id: r2
          label: Sample procedures (backup, restore, patching, account provisioning, monitoring)
          kind: document
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: procedures
          population: documented operating procedures
          method: compare procedure to what the operator actually does
        interviewees:
        - service_desk
        - dev
        pitfalls:
        - id: p1
          text: Procedures out of date with the current tooling
        - id: p2
          text: Key knowledge held by one person with no written procedure
      a.6.1:
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: Which checks do you run for which roles, and who decided that privileged roles need more?
        - id: q2
          stage: 2
          who:
          - hr
          text: Show me the screening file for this engineer, and tell me whether the checks were finished
            before their first day.
        - id: q3
          stage: 2
          who:
          - proc
          - hr
          text: How do you make sure contractors and agency staff are screened to the level their role
            requires, and where is that written in the supplier contract?
        - id: q4
          stage: 2
          who:
          - hr
          text: For critical or privileged roles, how and how often do you re-check that people are still
            suitable after they start?
        requests:
        - id: r1
          label: Screening procedure with checks per role or risk level
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.bg_screening
        - id: r2
          label: Screening evidence for sampled hires (ID, right to work, references, criminal check where
            lawful)
          kind: record
        - id: r3
          label: Contract clauses or attestations requiring suppliers to screen their staff
          kind: document
        - id: r4
          label: HR starter list for the audit period with start dates
          kind: record
          fresh_days: 40
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: starters
          population: starters in the last 12 months
          method: compare screening completion date to start date and to the checks required for the role
          note: at least 2 in privileged or IT roles, plus 2 contractors
        interviewees:
        - hr
        - proc
        pitfalls:
        - id: p1
          text: Checks completed weeks after the start date with no documented interim restriction on
            access
        - id: p2
          text: Contractors and staff from agencies excluded from screening because HR only covers payroll
            employees
        - id: p3
          text: The same intrusive checks, such as criminal records, run for every role with no role-based
            rationale or confirmed legal basis in the local jurisdiction
        - id: p4
          text: Screening happens only at hiring, with no re-check for people promoted into or holding
            critical roles
      a.6.2:
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: Where in the employment contract do staff accept their information security responsibilities?
        - id: q2
          stage: 2
          who:
          - hr
          text: 'Pick a recent hire: show me what they signed and which policies it points to.'
        requests:
        - id: r1
          label: Employment contract and contractor agreement templates with security clauses highlighted
          kind: document
        - id: r2
          label: Signed contracts or acknowledgements for sampled starters
          kind: record
        - id: r3
          label: Staff handbook or code of conduct referenced by the contract
          kind: document
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: starters
          population: starters in the last 12 months
          method: check the signed contract or a signed addendum states security responsibilities and
            was in place before access was granted
          note: including 1 contractor
        interviewees:
        - hr
        - legal
        pitfalls:
        - id: p1
          text: Long-serving staff on contracts that say nothing about information security, with no addendum
            or signed acknowledgement filling the gap
        - id: p2
          text: Contractor agreements managed by procurement with no security clauses at all
      a.6.3:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: How did you decide what goes into the awareness programme, and how does it change for
            developers or admins?
        - id: q2
          stage: 2
          who:
          - hr
          - ciso
          text: What percentage of staff completed training this year, and what happens to those who did
            not?
        - id: q3
          stage: 2
          who:
          - staff
          text: Tell me, without looking it up, how you would report a suspicious email here.
        - id: q4
          stage: 2
          who:
          - ciso
          text: When a policy or procedure changed this year, how did the people it affects find out?
            Show me.
        - id: q5
          stage: 2
          who:
          - ciso
          text: How do you check that awareness actually landed (quiz, test, observed behaviour)? Show
            me the latest results.
        requests:
        - id: r1
          label: Awareness and training plan with topics per audience
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_plan
        - id: r2
          label: Training completion report from the LMS for all staff
          kind: record
          fresh_days: 100
          reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register
        - id: r3
          label: Phishing simulation results and follow-up actions, if simulations are run
          kind: record
          fresh_days: 200
        - id: r4
          label: Role-based training records for the ISMS team and privileged users
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: staff from different departments
          population: current headcount plus contractors and supplier staff with access
          method: trace each name to a completion record and ask each a short awareness question during
            interviews
          note: include 1-2 external personnel
        interviewees:
        - staff
        - ciso
        - hr
        pitfalls:
        - id: p1
          text: Completion below target with no chasing or escalation recorded
        - id: p2
          text: New starters not trained until the next annual campaign
        - id: p3
          text: Training content generic and never updated after incidents or risk changes
      a.6.4:
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: Where is it written what happens when someone breaches a security policy, and do staff
            know about it?
        - id: q2
          stage: 2
          who:
          - hr
          - legal
          text: Has the process been used since the last audit? Walk me through one case, anonymised if
            needed.
        requests:
        - id: r1
          label: Disciplinary procedure that explicitly covers security breaches
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.disciplinary
        - id: r2
          label: Anonymised log of security-related disciplinary cases
          kind: record
        - id: r3
          label: Communication showing staff were made aware of the process
          kind: record
        sampling: []
        interviewees:
        - hr
        - legal
        pitfalls:
        - id: p1
          text: Generic HR disciplinary policy with no mention of information security, so incidents are
            handled informally
        - id: p2
          text: Policy violations confirmed during incident review show no sign the disciplinary process
            was considered, nor a recorded reason for not using it
        - id: p3
          text: Disciplinary process covers employees only; there is no contractual route to act on a
            contractor or supplier employee who breaks policy
      a.6.5:
        questions:
        - id: q1
          stage: 1
          who:
          - hr
          text: Which obligations continue after someone leaves or changes role, and how are they told?
        - id: q4
          stage: 1
          who:
          - hr
          text: In which contract or agreement are the duties that continue after leaving written down,
            and for how long do they apply?
        - id: q2
          stage: 2
          who:
          - hr
          text: When someone leaves, how are they reminded of what still binds them, such as confidentiality?
        - id: q3
          stage: 2
          who:
          - hr
          text: 'Show me the exit record for this leaver: which ongoing obligations were restated, and
            who took over their security duties?'
        requests:
        - id: r1
          label: Leaver procedure or exit checklist covering continuing obligations
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:proc.hr_security
        - id: r2
          label: Completed exit checklists or exit letters for sampled leavers
          kind: record
        - id: r3
          label: HR leaver list for the audit period with last working days
          kind: record
          fresh_days: 40
        sampling:
        - id: s1
          min: 5
          max: 10
          unit: leavers
          population: leavers and role changes in the last 12 months
          method: check continuing obligations were stated in the contract and restated at exit, and any
            security role held was handed to a named person (asset return and access removal are checked
            under A.5.11 and A.5.18)
          note: including 1 mover and 1 contractor
        interviewees:
        - hr
        - iam
        pitfalls:
        - id: p1
          text: Exit checklist exists but is blank or missing for contractors and short-notice departures
        - id: p2
          text: A mover or leaver held a security duty (owner of a risk or an asset, an on-call role)
            and nobody was formally named to take it over
      a.6.6:
        questions:
        - id: q1
          stage: 1
          who:
          - legal
          text: Who has to sign an NDA, and when were the templates last reviewed by legal?
        - id: q3
          stage: 1
          who:
          - legal
          text: What do your agreements say about how long confidentiality lasts and what happens to information
            when the relationship ends?
        - id: q2
          stage: 2
          who:
          - proc
          - hr
          text: Show me signed agreements for these suppliers and staff who handle confidential data.
        requests:
        - id: r1
          label: NDA templates for staff, contractors and third parties
          kind: document
        - id: r2
          label: Register of signed NDAs or signed copies for the sample
          kind: record
        - id: r3
          label: Record of the last NDA template review
          kind: record
          fresh_days: 400
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: staff or contractors and 3 suppliers with data access
          population: people and suppliers with access to confidential information
          method: confirm a signed agreement exists and predates access
        interviewees:
        - legal
        - hr
        - proc
        pitfalls:
        - id: p1
          text: Supplier NDAs signed during sales talks expired or never covered the later service
        - id: p2
          text: Templates never reviewed since adoption, so the review requirement is not met
      a.6.7:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          text: What rules apply when people work from home, a café or abroad, and where are they written?
        - id: q2
          stage: 2
          who:
          - endpoint
          text: Show me how you enforce those rules technically on a laptop that is never in the office.
        - id: q3
          stage: 2
          who:
          - ciso
          text: Can staff work from another country, and who approves that?
        - id: q4
          stage: 2
          who:
          - endpoint
          text: How do remote users authenticate to internal systems, and is any remote path still single-factor?
        requests:
        - id: r1
          label: Remote working policy or section of the acceptable use policy
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:pol.work
        - id: r2
          label: Endpoint compliance report showing encryption, screen lock and VPN or ZTNA posture
          kind: technical
          fresh_days: 40
        - id: r3
          label: Approvals for working from abroad
          kind: record
        sampling:
        - id: s1
          min: 3
          max: 5
          unit: remote workers
          population: staff working partly or fully remotely
          method: check device compliance in the management console and ask each how they handle calls
            and printing at home
        interviewees:
        - staff
        - endpoint
        - ciso
        pitfalls:
        - id: p1
          text: Policy forbids public wifi or printing at home but nothing enforces or checks it
        - id: p2
          text: Personal devices used for remote work with no MDM or conditional access
        - id: p3
          text: Staff work from other countries for weeks without approval or a check of local legal constraints
      a.6.8:
        questions:
        - id: q1
          stage: 1
          who:
          - sec_ops
          text: How should staff report a security event, and how did you tell them about those channels?
        - id: q2
          stage: 2
          who:
          - staff
          text: If I saw something suspicious right now, how would I report it, and how fast would someone
            respond?
        - id: q3
          stage: 2
          who:
          - sec_ops
          text: Show me reports from staff in the last few months and what was done with them.
        requests:
        - id: r1
          label: Event reporting procedure and the channels advertised to staff
          kind: document
        - id: r2
          label: Ticket or mailbox log of staff-reported events with triage outcome
          kind: record
          fresh_days: 100
        - id: r3
          label: Phishing report button statistics
          kind: technical
          fresh_days: 100
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: reported events
          population: events reported by staff in the last 6 months
          method: check each report reached the defined channel promptly and was logged (triage quality
            is assessed under A.5.25)
        interviewees:
        - staff
        - sec_ops
        pitfalls:
        - id: p1
          text: Staff interviewed give different answers on how to report, or name a person who has left
        - id: p2
          text: Very few reports logged, which an auditor may probe as a possible awareness or channel
            problem
        - id: p3
          text: Reports handled in chat or by email with no record of triage
        - id: p4
          text: Staff encouraged to confirm a suspected weakness themselves before reporting it, risking
            damage and lost evidence
      a.7.1:
        questions:
        - id: q1
          stage: 1
          who:
          - ciso
          - facilities
          text: Which sites are in scope, and how did you define the boundary of each secure area?
        - id: q2
          stage: 2
          who:
          - facilities
          text: Walk me around the perimeter. Where could someone get in without passing a control?
        - id: q3
          stage: 2
          who:
          - ciso
          text: Where provider data centres are in scope, how do you know their perimeter controls are
            adequate? (Otherwise this is covered under A.5.19 to A.5.23.)
        requests:
        - id: r1
          label: Site list and floor plans marking secure zones and entry points
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:phys.secure_area
        - id: r2
          label: 'Site tour: doors, windows, fire exits and loading areas on the perimeter'
          kind: observation
        - id: r3
          label: Current ISO 27001 certificate or SOC 2 report for hosting or colocation providers, with
            scope covering the used regions
          kind: record
          fresh_days: 400
        sampling: []
        interviewees:
        - facilities
        - ciso
        pitfalls:
        - id: p1
          text: Fire exits propped open or without alarms, giving an unmonitored way in
        - id: p2
          text: Control marked not applicable for a remote-first company even though a small office or
            comms cupboard is in scope
        - id: p3
          text: Provider SOC 2 report collected but its scope does not cover the region or service actually
            used (where provider sites are in scope)
      a.7.2:
        questions:
        - id: q1
          stage: 1
          who:
          - facilities
          text: Which entry points to your sites are controlled, and how are badges, keys and visitors
            handled on paper?
        - id: q2
          stage: 2
          who:
          - facilities
          text: How do visitors get in, who escorts them, and how long do you keep the visitor log?
        - id: q3
          stage: 2
          who:
          - facilities
          text: When were badge rights to the server room last reviewed, and who removed the ones no longer
            needed?
        - id: q4
          stage: 2
          who:
          - facilities
          text: Who holds keys or door codes for restricted rooms, when were codes last changed, and how
            are delivery areas kept apart from secure zones?
        requests:
        - id: r1
          label: Visitor log for a recent period
          kind: record
          fresh_days: 40
          reference_control: urn:intuitem:risk:function:doc-pol:phys.visitor_mgmt
        - id: r2
          label: Badge system export of people with access to restricted zones
          kind: technical
          fresh_days: 40
        - id: r3
          label: Records of the last physical access rights review
          kind: record
          fresh_days: 200
        - id: r4
          label: 'Site tour: reception, badge readers, tailgating behaviour at entry points'
          kind: observation
        sampling:
        - id: s1
          min: 5
          max: 5
          unit: leavers and 5 badge holders for restricted zones
          population: badge database and leavers in the last 12 months
          method: check leaver badges were disabled on the last day and that each restricted-zone holder
            has a role justification
        interviewees:
        - facilities
        - hr
        pitfalls:
        - id: p1
          text: Badges of leavers still active because HR does not notify facilities or the building manager
        - id: p2
          text: Auditor follows staff through a door without being challenged
        - id: p3
          text: Visitor log incomplete, with no exit times or host names
        - id: p4
          text: Server room door code unchanged for years and known to former staff or contractors
      a.7.3:
        questions:
        - id: q1
          stage: 1
          who:
          - facilities
          text: Which rooms did you mark as needing extra protection, and how did you choose them?
        - id: q2
          stage: 2
          who:
          - facilities
          text: Which rooms hold sensitive information or equipment, and how are they protected from casual
            view and entry?
        - id: q3
          stage: 2
          who:
          - facilities
          text: Is there anything in public building directories or signage that tells outsiders where
            the sensitive rooms are?
        requests:
        - id: r1
          label: List of sensitive rooms such as server rooms, HR and finance offices, with their protections
          kind: document
        - id: r2
          label: 'Site tour: locks, window coverings and signage of sensitive rooms'
          kind: observation
        sampling: []
        interviewees:
        - facilities
        pitfalls:
        - id: p1
          text: Server room labelled on the door and visible from a public corridor
        - id: p2
          text: Meeting rooms with screens or whiteboards visible through glass from the street
      a.7.4:
        questions:
        - id: q1
          stage: 1
          who:
          - facilities
          text: What do you monitor physically, why those areas, and how long do you keep footage?
        - id: q2
          stage: 2
          who:
          - facilities
          text: Show me the last alarm test and what happened when an alarm went off out of hours.
        - id: q3
          stage: 2
          who:
          - facilities
          text: If you record video, can you retrieve footage from last Tuesday morning for this door
            right now?
        requests:
        - id: r1
          label: Coverage map of cameras, alarm zones and sensors against secure areas
          kind: document
          reference_control: urn:intuitem:risk:function:doc-pol:phys.cctv
        - id: r2
          label: Alarm and intrusion test log with dates and results
          kind: record
          fresh_days: 100
        - id: r3
          label: CCTV retention and access rules, with the privacy notice and signage required by local
            law
          kind: document
        - id: r4
          label: Live retrieval of a recorded clip from a chosen date, if video recording is used
          kind: observation
        sampling:
        - id: s1
          min: 2
          max: 3
          unit: alarm events
          population: alarms and out-of-hours events in the last 6 months
          method: trace each event to a response record and check response time against the defined target
        interviewees:
        - facilities
        - sec_ops
        pitfalls:
        - id: p1
          text: Cameras installed but recording failed or the retention is shorter than stated, discovered
            when footage is requested
        - id: p2
          text: Alarms with no defined out-of-hours responder or an outdated call list
        - id: p3
          text: Monitoring delegated to the landlord with no agreement or report showing what they actually
            do
        - id: p4
          text: CCTV recorder or alarm panel reachable on the office network or the internet with default
            credentials
        - id: p5
          text: SoA carried over from the 2013 version with no line or justification for this control,
            which is new in 2022
      a.7.5:
        questions:
        - id: q1
          stage: 1
          who:
