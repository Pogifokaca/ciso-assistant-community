convert_library_version: 'v2 ; Compat Mode: [0] {[v2.1] (DEFAULT) Don''t use any Compatibility Mode}'
urn: urn:intuitem:risk:library:core-cybersecurity-metrics
locale: en
ref_id: CORE-CYBER-METRICS
name: Core Cybersecurity Metrics
description: A curated set of 25 essential cybersecurity metrics for organizations of all sizes and industries.
  Covers governance, vulnerabilities, incidents, access, awareness, third-party risk, assets, and resilience.
copyright: intuitem
version: 4
publication_date: 2025-12-13
provider: intuitem
packager: intuitem
translations:
  mk:
    name: Основни метрики за сајбер безбедност
    description: Избран сет од 25 суштински метрики за сајбер безбедност за организации од сите големини
      и дејности. Опфаќа управување, ранливости, инциденти, пристап, свест, ризик од трети страни, средства
      и отпорност.
objects:
  metric_definitions:
  - urn: urn:intuitem:risk:metric:core:gov-01
    ref_id: GOV-01
    name: Compliance Score
    description: Overall compliance percentage across applicable security frameworks and regulatory requirements
    translations:
      mk:
        name: Оценка на усогласеност
        description: Вкупен процент на усогласеност со применливите безбедносни рамки и регулаторни барања
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 85.0
  - urn: urn:intuitem:risk:metric:core:gov-02
    ref_id: GOV-02
    name: Security Program Maturity
    description: Overall maturity of the organization's cybersecurity program based on people, process,
      and technology capabilities
    translations:
      mk:
        name: Зрелост на безбедносната програма
        description: Вкупна зрелост на програмата за сајбер безбедност на организацијата врз основа на
          способностите на луѓето, процесите и технологијата
    category: qualitative
    higher_is_better: true
    choices_definition:
    - name: Initial
      description: Ad-hoc security practices, reactive approach, no formal program
      translations:
        mk:
          name: Почетна
          description: Ад хок безбедносни практики, реактивен пристап, нема формална програма
    - name: Developing
      description: Basic policies exist, some processes documented, limited resources
      translations:
        mk:
          name: Во развој
          description: Постојат основни политики, дел од процесите се документирани, ограничени ресурси
    - name: Defined
      description: Formal security program, documented processes, dedicated team
      translations:
        mk:
          name: Дефинирана
          description: Формална безбедносна програма, документирани процеси, посветен тим
    - name: Managed
      description: Metrics-driven, regular assessments, integrated with business
      translations:
        mk:
          name: Управувана
          description: Водена од метрики, редовни проценки, интегрирана со деловното работење
    - name: Optimized
      description: Continuous improvement, proactive threat management, security culture embedded
      translations:
        mk:
          name: Оптимизирана
          description: Постојано подобрување, проактивно управување со заканите, вградена безбедносна
            култура
  - urn: urn:intuitem:risk:metric:core:gov-03
    ref_id: GOV-03
    name: Risk Management Maturity
    description: Maturity of risk identification, assessment, treatment, and monitoring processes
    translations:
      mk:
        name: Зрелост на управувањето со ризик
        description: Зрелост на процесите за идентификување, проценка, третман и следење на ризиците
    category: qualitative
    higher_is_better: true
    choices_definition:
    - name: Initial
      description: No formal risk process, risks addressed reactively
      translations:
        mk:
          name: Почетна
          description: Нема формален процес за ризик, ризиците се решаваат реактивно
    - name: Developing
      description: Basic risk register, informal assessments
      translations:
        mk:
          name: Во развој
          description: Основен регистар на ризици, неформални проценки
    - name: Defined
      description: Formal risk framework, regular assessments, documented treatment plans
      translations:
        mk:
          name: Дефинирана
          description: Формална рамка за ризик, редовни проценки, документирани планови за третман
    - name: Managed
      description: Quantitative risk analysis, KRIs tracked, risk-informed decisions
      translations:
        mk:
          name: Управувана
          description: Квантитативна анализа на ризикот, следење KRI, одлуки засновани на ризик
    - name: Optimized
      description: Real-time risk monitoring, predictive analytics, full business integration
      translations:
        mk:
          name: Оптимизирана
          description: Следење на ризиците во реално време, предвидувачка аналитика, целосна интеграција
            со деловното работење
  - urn: urn:intuitem:risk:metric:core:vuln-01
    ref_id: VULN-01
    name: Open Critical/High Vulnerabilities
    description: Total count of unresolved critical and high severity vulnerabilities across all systems
    translations:
      mk:
        name: Отворени критични/високи ранливости
        description: Вкупен број нерешени ранливости со критична и висока сериозност низ сите системи
    category: quantitative
    unit: count
    higher_is_better: false
    default_target: 0.0
  - urn: urn:intuitem:risk:metric:core:vuln-02
    ref_id: VULN-02
    name: Vulnerability Remediation Time
    description: Average number of days to remediate identified vulnerabilities from discovery to resolution
    translations:
      mk:
        name: Време за отстранување на ранливости
        description: Просечен број денови за отстранување на идентификуваните ранливости, од откривање
          до решавање
    category: quantitative
    unit: days
    higher_is_better: false
    default_target: 30.0
  - urn: urn:intuitem:risk:metric:core:vuln-03
    ref_id: VULN-03
    name: Patch Coverage
    description: Percentage of systems with security patches applied within defined SLA timeframes
    translations:
      mk:
        name: Покриеност со закрпи
        description: Процент на системи со безбедносни закрпи применети во рамки на дефинираните SLA рокови
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 95.0
  - urn: urn:intuitem:risk:metric:core:inc-01
    ref_id: INC-01
    name: Security Incidents Count
    description: Total number of confirmed security incidents during the measurement period
    translations:
      mk:
        name: Број на безбедносни инциденти
        description: Вкупен број потврдени безбедносни инциденти во периодот на мерење
    category: quantitative
    unit: count
    higher_is_better: false
    default_target: 0.0
  - urn: urn:intuitem:risk:metric:core:inc-02
    ref_id: INC-02
    name: Mean Time to Detect
    description: Average time in hours from when a security incident occurs to when it is detected
    translations:
      mk:
        name: Просечно време за откривање (MTTD)
        description: Просечно време во часови од настанувањето на безбедносниот инцидент до неговото откривање
    category: quantitative
    unit: hours
    higher_is_better: false
    default_target: 24.0
  - urn: urn:intuitem:risk:metric:core:inc-03
    ref_id: INC-03
    name: Mean Time to Respond
    description: Average time in hours from incident detection to initial containment response
    translations:
      mk:
        name: Просечно време за одговор (MTTR)
        description: Просечно време во часови од откривањето на инцидентот до почетното ограничување
    category: quantitative
    unit: hours
    higher_is_better: false
    default_target: 4.0
  - urn: urn:intuitem:risk:metric:core:inc-04
    ref_id: INC-04
    name: Incident Response Readiness
    description: Assessment of the organization's preparedness to detect, respond to, and recover from
      security incidents
    translations:
      mk:
        name: Подготвеност за одговор на инциденти
        description: Проценка на подготвеноста на организацијата да открие, одговори и закрепне од безбедносни
          инциденти
    category: qualitative
    higher_is_better: true
    choices_definition:
    - name: Unprepared
      description: No incident response plan, no defined roles or procedures
      translations:
        mk:
          name: Неподготвена
          description: Нема план за одговор на инциденти, ниту дефинирани улоги или процедури
    - name: Basic
      description: Documented IR plan exists but rarely tested, limited team training
      translations:
        mk:
          name: Основна
          description: Постои документиран план за одговор, но ретко се тестира, ограничена обука на тимот
    - name: Capable
      description: IR plan tested annually, trained response team, basic playbooks
      translations:
        mk:
          name: Способна
          description: Планот се тестира годишно, обучен тим за одговор, основни сценарија за постапување
            (playbooks)
    - name: Advanced
      description: Regular tabletop and live exercises, automated detection, established partnerships
      translations:
        mk:
          name: Напредна
          description: Редовни симулации и вежби во живо, автоматизирано откривање, воспоставени партнерства
    - name: Elite
      description: 24/7 response capability, threat hunting, continuous improvement from lessons learned
      translations:
        mk:
          name: Врвна
          description: Способност за одговор 24/7, лов на закани, постојано подобрување од научените лекции
  - urn: urn:intuitem:risk:metric:core:iam-01
    ref_id: IAM-01
    name: MFA Adoption Rate
    description: Percentage of user accounts and critical systems protected by multi-factor authentication
    translations:
      mk:
        name: Стапка на примена на MFA
        description: Процент на кориснички сметки и критични системи заштитени со повеќефакторска автентикација
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:iam-02
    ref_id: IAM-02
    name: Privileged Access Coverage
    description: Percentage of privileged accounts managed through privileged access management (PAM)
      controls
    translations:
      mk:
        name: Покриеност на привилегираниот пристап
        description: Процент на привилегирани сметки управувани преку контроли за управување со привилегиран
          пристап (PAM)
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:iam-03
    ref_id: IAM-03
    name: Dormant Account Rate
    description: Percentage of user accounts that have been inactive beyond the defined threshold and
      not yet disabled
    translations:
      mk:
        name: Стапка на неактивни сметки
        description: Процент на кориснички сметки што се неактивни подолго од дефинираниот праг, а сè
          уште не се оневозможени
    category: quantitative
    unit: percentage
    higher_is_better: false
    default_target: 0.0
  - urn: urn:intuitem:risk:metric:core:awr-01
    ref_id: AWR-01
    name: Security Training Completion
    description: Percentage of employees who have completed mandatory security awareness training within
      the required timeframe
    translations:
      mk:
        name: Завршена безбедносна обука
        description: Процент на вработени што ја завршиле задолжителната обука за безбедносна свест во
          предвидениот рок
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 95.0
  - urn: urn:intuitem:risk:metric:core:awr-02
    ref_id: AWR-02
    name: Phishing Click Rate
    description: Percentage of employees who clicked on simulated phishing emails during awareness testing
      campaigns
    translations:
      mk:
        name: Стапка на кликови на фишинг
        description: Процент на вработени што кликнале на симулирани фишинг пораки во кампањите за тестирање
          на свеста
    category: quantitative
    unit: percentage
    higher_is_better: false
    default_target: 5.0
  - urn: urn:intuitem:risk:metric:core:tpr-01
    ref_id: TPR-01
    name: Vendor Assessment Coverage
    description: Percentage of critical and high-risk vendors that have completed security assessments
      within the required period
    translations:
      mk:
        name: Покриеност со проценки на добавувачите
        description: Процент на критични и високоризични добавувачи што ја завршиле безбедносната проценка
          во предвидениот период
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:ast-01
    ref_id: AST-01
    name: Asset Inventory Coverage
    description: Percentage of IT assets (hardware, software, cloud resources) documented in the asset
      inventory
    translations:
      mk:
        name: Покриеност на пописот на средства
        description: Процент на ИТ средства (хардвер, софтвер, ресурси во облак) евидентирани во пописот
          на средства
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 95.0
  - urn: urn:intuitem:risk:metric:core:dat-01
    ref_id: DAT-01
    name: Data Protection Maturity
    description: Maturity of data classification, encryption, data loss prevention, and privacy controls
    translations:
      mk:
        name: Зрелост на заштитата на податоците
        description: Зрелост на класификацијата на податоци, шифрирањето, спречувањето загуба на податоци
          и контролите за приватност
    category: qualitative
    higher_is_better: true
    choices_definition:
    - name: Initial
      description: No data classification, encryption used inconsistently, no DLP
      translations:
        mk:
          name: Почетна
          description: Нема класификација на податоците, шифрирањето се користи недоследно, нема DLP
    - name: Developing
      description: Basic classification scheme, encryption for some data at rest
      translations:
        mk:
          name: Во развој
          description: Основна шема за класификација, шифрирање на дел од податоците во мирување
    - name: Defined
      description: Formal classification policy, encryption standards, basic DLP rules
      translations:
        mk:
          name: Дефинирана
          description: Формална политика за класификација, стандарди за шифрирање, основни DLP правила
    - name: Managed
      description: Automated classification, comprehensive encryption, DLP with monitoring
      translations:
        mk:
          name: Управувана
          description: Автоматизирана класификација, сеопфатно шифрирање, DLP со следење
    - name: Optimized
      description: Data-centric security, advanced DLP with ML, privacy by design embedded
      translations:
        mk:
          name: Оптимизирана
          description: Безбедност насочена кон податоците, напреден DLP со машинско учење, вградена приватност
            уште при дизајнот
  - urn: urn:intuitem:risk:metric:core:mon-01
    ref_id: MON-01
    name: Security Monitoring Maturity
    description: Maturity of security monitoring, logging, SIEM capabilities, and threat detection
    translations:
      mk:
        name: Зрелост на безбедносното следење
        description: Зрелост на безбедносното следење, евидентирањето, SIEM способностите и откривањето
          закани
    category: qualitative
    higher_is_better: true
    choices_definition:
    - name: Initial
      description: Minimal logging, no centralized monitoring, reactive only
      translations:
        mk:
          name: Почетна
          description: Минимално евидентирање, нема централизирано следење, само реактивно
    - name: Developing
      description: Basic log collection, some alerting, limited coverage
      translations:
        mk:
          name: Во развој
          description: Основно собирање логови, дел од известувањата, ограничена покриеност
    - name: Defined
      description: Centralized SIEM, correlation rules, defined use cases, 8x5 monitoring
      translations:
        mk:
          name: Дефинирана
          description: Централизиран SIEM, правила за корелација, дефинирани случаи на употреба, следење
            8x5
    - name: Managed
      description: Comprehensive visibility, tuned detection, threat intelligence integrated, 24x7 monitoring
      translations:
        mk:
          name: Управувана
          description: Сеопфатна видливост, прилагодено откривање, интегрирано разузнавање за закани,
            следење 24x7
    - name: Optimized
      description: Advanced analytics, proactive threat hunting, automated response, continuous optimization
      translations:
        mk:
          name: Оптимизирана
          description: Напредна аналитика, проактивен лов на закани, автоматизиран одговор, постојана
            оптимизација
  - urn: urn:intuitem:risk:metric:core:res-01
    ref_id: RES-01
    name: Backup Coverage
    description: Percentage of critical systems and data with regular automated backups configured
    translations:
      mk:
        name: Покриеност со резервни копии
        description: Процент на критични системи и податоци со конфигурирани редовни автоматски резервни
          копии
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:res-02
    ref_id: RES-02
    name: Immutable Backup Coverage
    description: Percentage of critical systems with air-gapped or immutable backups protected against
      ransomware
    translations:
      mk:
        name: Покриеност со непроменливи резервни копии
        description: Процент на критични системи со изолирани (air-gapped) или непроменливи резервни копии
          заштитени од ransomware
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:res-03
    ref_id: RES-03
    name: Backup Test Success Rate
    description: Percentage of backup restoration tests completed successfully within defined RTO
    translations:
      mk:
        name: Стапка на успешни тестови на резервни копии
        description: Процент на тестови за враќање од резервни копии успешно завршени во рамки на дефинираното
          RTO
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:res-04
    ref_id: RES-04
    name: Recovery Objectives Compliance
    description: Percentage of critical systems meeting their defined Recovery Time Objective (RTO) and
      Recovery Point Objective (RPO)
    translations:
      mk:
        name: Усогласеност со целите за обнова
        description: Процент на критични системи што ги исполнуваат дефинираните Целно време за обнова
          (RTO) и Целна точка за обнова (RPO)
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:res-05
    ref_id: RES-05
    name: BCP/DRP Coverage
    description: Percentage of critical business processes with documented and tested business continuity
      and disaster recovery plans
    translations:
      mk:
        name: Покриеност со BCP/DRP
        description: Процент на критични деловни процеси со документирани и тестирани планови за континуитет
          на работењето и обнова по катастрофа
    category: quantitative
    unit: percentage
    higher_is_better: true
    default_target: 100.0
  - urn: urn:intuitem:risk:metric:core:res-06
    ref_id: RES-06
    name: Mean Time to Recovery
    description: Average time in hours to fully restore critical business operations after a major incident
      or disaster
    translations:
      mk:
        name: Просечно време за закрепнување
        description: Просечно време во часови за целосно враќање на критичните деловни операции по голем
          инцидент или катастрофа
    category: quantitative
    unit: hours
    higher_is_better: false
    default_target: 24.0
