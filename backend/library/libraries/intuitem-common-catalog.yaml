urn: urn:intuitem:risk:library:intuitem-common-catalog
locale: en
ref_id: intuitem-common-catalog
name: INTUITEM Common Catalog
description: INTUITEM Common Catalog - Threats
copyright: © intuitem - 2025
version: 5
publication_date: 2026-11-20
provider: intuitem
packager: intuitem
translations:
  mk:
    name: Заеднички каталог на INTUITEM
    description: Заеднички каталог на INTUITEM - Закани
objects:
  threats:
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-001
    ref_id: ICT-001
    name: Ransomware
    description: Malicious software encrypts data, demanding ransom for decryption keys
    translations:
      mk:
        name: Ransomware (уцена со шифрирање)
        description: Злонамерен софтвер ги шифрира податоците и бара откуп за клучевите за дешифрирање
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-002
    ref_id: ICT-002
    name: Phishing and Spear Phishing
    description: Deceptive emails or messages trick users into revealing sensitive information or gaining
      access
    translations:
      mk:
        name: Фишинг и таргетиран фишинг (spear phishing)
        description: Измамнички пораки или е-пошта ги наведуваат корисниците да откријат чувствителни
          информации или да овозможат пристап
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-003
    ref_id: ICT-003
    name: Third-Party / Supply Chain Attacks
    description: Compromising third-party vendors to gain access to the main target
    translations:
      mk:
        name: Напади преку трети страни / синџирот на снабдување
        description: Компромитирање на добавувачи од трети страни за да се добие пристап до главната цел
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-004
    ref_id: ICT-004
    name: Zero-Day Exploits
    description: Exploiting unknown vulnerabilities before patches are available
    translations:
      mk:
        name: Експлоатации на zero-day ранливости
        description: Искористување на непознати ранливости пред да бидат достапни закрпи
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-005
    ref_id: ICT-005
    name: Insider Threats
    description: Malicious or negligent actions by employees or contractors
    translations:
      mk:
        name: Внатрешни закани
        description: Злонамерни или небрежни дејства на вработени или изведувачи
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-006
    ref_id: ICT-006
    name: Advanced Persistent Threats (APTs)
    description: Long-term, targeted cyber-espionage attacks by state-sponsored groups
    translations:
      mk:
        name: Напредни постојани закани (APT)
        description: Долгорочни, таргетирани напади за сајбер шпионажа од групи поддржани од држави
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-007
    ref_id: ICT-007
    name: DoS / DDoS
    description: Overwhelming systems to make services unavailable
    translations:
      mk:
        name: DoS / DDoS
        description: Преоптоварување на системите за услугите да станат недостапни
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-008
    ref_id: ICT-008
    name: Social Engineering
    description: Manipulating individuals into divulging confidential information or gaining access
    translations:
      mk:
        name: Социјален инженеринг
        description: Манипулирање со поединци да откријат доверливи информации или да овозможат пристап
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-009
    ref_id: ICT-009
    name: Malware and Spyware
    description: Malicious software designed to damage or spy on systems
    translations:
      mk:
        name: Злонамерен софтвер и шпионски софтвер
        description: Злонамерен софтвер дизајниран да оштети или да шпионира системи
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-010
    ref_id: ICT-010
    name: Cryptojacking
    description: Unauthorized use of computing resources to mine cryptocurrency
    translations:
      mk:
        name: Cryptojacking
        description: Неовластено користење на компјутерски ресурси за ископување криптовалути
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-011
    ref_id: ICT-011
    name: Domain Name System (DNS) Spoofing and Hijacking
    description: Gaining control over DNS to redirect users to malicious websites
    translations:
      mk:
        name: Лажирање и преземање на DNS (Domain Name System)
        description: Преземање контрола врз DNS за пренасочување на корисниците кон злонамерни веб-страници
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-012
    ref_id: ICT-012
    name: Password Attacks (Brute Force and Credential Stuffing)
    description: Repeated attempts to guess passwords or use stolen credentials
    translations:
      mk:
        name: Напади на лозинки (brute force и credential stuffing)
        description: Повторени обиди за погодување лозинки или користење украдени акредитиви
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-013
    ref_id: ICT-013
    name: Deepfake and Synthetic Identity Fraud
    description: Using AI-generated content for impersonation
    translations:
      mk:
        name: Deepfake и измама со синтетички идентитет
        description: Користење содржини генерирани со вештачка интелигенција за лажно претставување
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-014
    ref_id: ICT-014
    name: Artificial Intelligence (AI) Threats and Model Manipulation
    description: Model biases, adversarial attacks, model poisoning, data manipulation, and LLM escapes,
      leading to unauthorized actions, misinformation, and compromised decision-making
    translations:
      mk:
        name: Закани поврзани со вештачка интелигенција (АИ) и манипулација на модели
        description: Пристрасност на моделите, непријателски напади, труење на моделите, манипулација
          со податоци и заобиколување на LLM ограничувањата, што води до неовластени дејства, дезинформации
          и компромитирано одлучување
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-015
    ref_id: ICT-015
    name: Cloud Security Threats
    description: Misconfigurations, insecure APIs, and account hijacking in cloud environments leading
      to data exposure and unauthorized access
    translations:
      mk:
        name: Безбедносни закани во облак
        description: Погрешни конфигурации, небезбедни API-ја и преземање сметки во облачни околини, што
          води до изложување на податоци и неовластен пристап
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-016
    ref_id: ICT-016
    name: Internet of Things (IoT) Vulnerabilities
    description: Insecure smart devices and sensors, leading to network compromise and unauthorized access
      to sensitive data
    translations:
      mk:
        name: Ранливости на Интернет на нештата (IoT)
        description: Небезбедни паметни уреди и сензори, што води до компромитирање на мрежата и неовластен
          пристап до чувствителни податоци
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-017
    ref_id: ICT-017
    name: Mobile Device Threats
    description: Security risks related to mobile devices, including malicious apps, device theft, and
      unauthorized access to sensitive data
    translations:
      mk:
        name: Закани за мобилните уреди
        description: Безбедносни ризици поврзани со мобилните уреди, вклучително злонамерни апликации,
          кражба на уреди и неовластен пристап до чувствителни податоци
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-018
    ref_id: ICT-018
    name: API Security Threats
    description: Exploiting poorly secured APIs for unauthorized access, data breaches, and business logic
      manipulation
    translations:
      mk:
        name: Безбедносни закани за API
        description: Искористување на слабо заштитени API-ја за неовластен пристап, повреди на податоци
          и манипулација со деловната логика
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-019
    ref_id: ICT-019
    name: Data Breach, Leak and Shadow IT
    description: Unauthorized data exposure due to an attack, mistake or through applications or services
      used by employees without the organisation approval
    translations:
      mk:
        name: Повреда и истекување на податоци и „Shadow IT“
        description: Неовластено откривање на податоци поради напад, грешка или преку апликации и услуги
          што вработените ги користат без одобрение на организацијата
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-020
    ref_id: ICT-020
    name: Physical Security Threats (Manipulation and Theft)
    description: Unauthorized physical access to hardware, tampering, or theft, leading to data breaches
      or hardware manipulation
    translations:
      mk:
        name: Физички безбедносни закани (манипулација и кражба)
        description: Неовластен физички пристап до хардверот, манипулација или кражба, што води до повреди
          на податоци или манипулација со хардверот
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-021
    ref_id: ICT-021
    name: Disinformation and Reputation Attacks
    description: Deliberate dissemination of false or misleading information to damage an organization's
      reputation, manipulate public perception, or influence decision-making
    translations:
      mk:
        name: Дезинформации и напади врз угледот
        description: Намерно ширење лажни или заведувачки информации за да се наштети на угледот на организацијата,
          да се манипулира со јавната перцепција или да се влијае врз одлучувањето
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-022
    ref_id: ICT-022
    name: System Outage (Due to Failure, Bugs or Errors)
    description: Unplanned disruptions in system availability caused by failures, bugs, configuration
      errors, or human mistakes, leading to operational downtime and potential data loss
    translations:
      mk:
        name: Прекин на системот (поради откази, грешки во софтверот или човечки грешки)
        description: Непланирани прекини во достапноста на системите предизвикани од откази, софтверски
          грешки, грешки во конфигурацијата или човечки грешки, што води до оперативен застој и можна
          загуба на податоци
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-023
    ref_id: ICT-023
    name: Regulatory Non-Compliance
    description: Failure to meet legal and regulatory requirements resulting in penalties, legal actions,
      operational restrictions, and reputational damage
    translations:
      mk:
        name: Регулаторна неусогласеност
        description: Неисполнување на законските и регулаторните барања, што резултира со казни, правни
          постапки, оперативни ограничувања и штета на угледот
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-024
    ref_id: ICT-024
    name: Exploitation of Known Vulnerabilities
    description: Exploiting publicly known vulnerabilities in unpatched or unsupported applications, operating
      systems, firmware or online services, often with publicly available exploits
    translations:
      mk:
        name: Искористување на познати ранливости
        description: Искористување на јавно познати ранливости во незакрпени или неподдржани апликации,
          оперативни системи, фирмвер или онлајн услуги, често со јавно достапни експлоатации
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-025
    ref_id: ICT-025
    name: Privileged Account Compromise and Abuse
    description: Compromise or misuse of administrative and other privileged accounts, including escalation
      to privileged access, to take control of systems, disable security controls or move laterally
    translations:
      mk:
        name: Компромитирање и злоупотреба на привилегирани сметки
        description: Компромитирање или злоупотреба на администраторски и други привилегирани сметки,
          вклучително ескалација до привилегиран пристап, за преземање контрола врз системите, оневозможување
          на безбедносните контроли или латерално движење
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-026
    ref_id: ICT-026
    name: Malicious Documents and Macros
    description: Office documents, macros, scripts or other content opened by users that execute malicious
      code on their workstation
    translations:
      mk:
        name: Злонамерни документи и макроа
        description: Office документи, макроа, скрипти или друга содржина што корисниците ја отвораат,
          а што извршува злонамерен код на нивната работна станица
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-027
    ref_id: ICT-027
    name: Multi-Factor Authentication Bypass
    description: Circumventing multi-factor authentication through push fatigue, adversary-in-the-middle
      phishing, session token theft, SIM swapping or weak fallback methods
    translations:
      mk:
        name: Заобиколување на повеќефакторската автентикација
        description: Заобиколување на повеќефакторската автентикација преку замор од push известувања,
          фишинг со напаѓач во средина (AitM), кражба на токени за сесија, замена на SIM картичка или
          слаби резервни методи
  - urn: urn:intuitem:risk:threat:intuitem-common-catalog:ict-028
    ref_id: ICT-028
    name: Destruction of Data and Backups
    description: Deliberate deletion, corruption or encryption of data and of its backups to prevent recovery
      and maximise the impact of an attack
    translations:
      mk:
        name: Уништување на податоците и резервните копии
        description: Намерно бришење, оштетување или шифрирање на податоците и нивните резервни копии
          за да се спречи обновата и да се максимизира влијанието на нападот
