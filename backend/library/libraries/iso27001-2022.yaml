      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '9'
      name: Performance evaluation
      implementation_groups:
      - Clauses
      translations:
        mk:
          name: Оценување на перформансите
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9
      ref_id: '9.1'
      name: Monitoring, measurement, analysis and evaluation
      description: Monitor, measure, analyze, and evaluate the ISMS’s performance and effectiveness using
        appropriate methods aligned with the organization’s objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.monitor
      - urn:intuitem:risk:function:doc-pol:doc.audit_plan
      translations:
        mk:
          name: Следење, мерење, анализа и оценување
          description: Следете, мерете, анализирајте и оценувајте ги перформансите и ефективноста на СУБИ
            со соодветни методи усогласени со целите на организацијата.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9
      ref_id: '9.2'
      name: Internal audit
      implementation_groups:
      - Clauses
      translations:
        mk:
          name: Внатрешна ревизија
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.2.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.2
      ref_id: 9.2.1
      name: General
      description: Conduct internal audits at planned intervals to ensure the ISMS complies with ISO/IEC
        27001 requirements and is effectively implemented and maintained.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.audit
      translations:
        mk:
          name: Општо
          description: Спроведувајте внатрешни ревизии во планирани интервали за да се потврди дека СУБИ
            е усогласен со барањата на ISO/IEC 27001 и дека е ефективно имплементиран и одржуван.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.2.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.2
      ref_id: 9.2.2
      name: Internal audit programme
      description: Plan and perform internal audits, including defining criteria, scope, methods, and
        responsibilities, and report the results to relevant management.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.audit_plan
      translations:
        mk:
          name: Програма за внатрешна ревизија
          description: Планирајте и спроведувајте внатрешни ревизии, вклучително дефинирање на критериумите,
            опсегот, методите и одговорностите, и известувајте го релевантното раководство за резултатите.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9
      ref_id: '9.3'
      name: Management review
      implementation_groups:
      - Clauses
      translations:
        mk:
          name: Преглед од раководството
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      ref_id: 9.3.1
      name: General
      description: Review the ISMS periodically to ensure its suitability, adequacy, and effectiveness
        in achieving organizational objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        mk:
          name: Општо
          description: Периодично преиспитувајте го СУБИ за да се потврди неговата погодност, соодветност
            и ефективност во постигнувањето на целите на организацијата.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      ref_id: 9.3.2
      name: Management review inputs
      description: Include inputs such as audit results, ISMS performance, risk status, improvement opportunities,
        and required changes in the management review.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        mk:
          name: Влезни елементи за прегледот од раководството
          description: Вклучете влезни елементи како резултати од ревизии, перформанси на СУБИ, состојба
            на ризиците, можности за подобрување и потребни промени во прегледот од раководството.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3.3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      ref_id: 9.3.3
      name: Management review results
      description: Document the results of the management reviews, including decisions on improvements,
        ISMS changes, and resource requirements.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        mk:
          name: Резултати од прегледот од раководството
          description: Документирајте ги резултатите од прегледите од раководството, вклучително и одлуките
            за подобрувања, промени во СУБИ и потребни ресурси.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '10'
      name: Improvement
      implementation_groups:
      - Clauses
      translations:
        mk:
          name: Подобрување
    - urn: urn:intuitem:risk:req_node:iso27001-2022:10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:10
      ref_id: '10.1'
      name: Continual improvement
      description: Identify and act on opportunities for continual improvement to enhance the ISMS's effectiveness
        and alignment with organizational goals.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      translations:
        mk:
          name: Постојано подобрување
          description: Идентификувајте ги и искористете ги можностите за постојано подобрување за да се
            зголеми ефективноста на СУБИ и неговата усогласеност со целите на организацијата.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:10
      ref_id: '10.2'
      name: Nonconformity and corrective action
      description: Address nonconformities by taking corrective actions, identifying root causes, and
        implementing measures to prevent recurrence while documenting the process.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      - urn:intuitem:risk:function:doc-pol:pol.incident
      - urn:intuitem:risk:function:doc-pol:doc.nc_log
      - urn:intuitem:risk:function:doc-pol:doc.proc_register
      - urn:intuitem:risk:function:doc-pol:doc.raci
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        mk:
          name: Неусогласеност и корективна мерка
          description: Справете се со неусогласеностите со преземање корективни мерки, утврдување на основните
            причини и имплементација на мерки за спречување на повторувањето, документирајќи го процесот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      assessable: false
      depth: 1
      ref_id: annex-a
      name: Statement of Applicability
      implementation_groups:
      - SoA
      translations:
        mk:
          name: Изјава за применливост
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.5
      name: Organisational controls
      implementation_groups:
      - SoA
      translations:
        mk:
          name: Организациски контроли
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.1
      name: Policies for information security
      description: This control establishes and maintains information security policies aligned with organizational
        objectives. Measures include defining scope, setting goals, and ensuring alignment with compliance
        requirements.
      implementation_groups:
      - SoA
      - Governance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.1
      - urn:intuitem:risk:function:doc-pol:pol.main
      - urn:intuitem:risk:function:doc-pol:doc.doc_register
      translations:
        mk:
          name: Политики за безбедност на информациите
          description: Оваа контрола воспоставува и одржува политики за безбедност на информациите усогласени
            со целите на организацијата. Мерките вклучуваат дефинирање на опсегот, поставување цели и
            обезбедување усогласеност со барањата за сообразност.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.2
      name: Information security roles and responsibilities
      description: This control defines and assigns roles and responsibilities for information security
        to ensure accountability. Measures include clear documentation of responsibilities, periodic reviews,
        and enforcement mechanisms.
      implementation_groups:
      - SoA
      - Governance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.2
      - urn:intuitem:risk:function:doc-pol:doc.raci
      translations:
        mk:
          name: Улоги и одговорности за безбедност на информациите
          description: Оваа контрола ги дефинира и доделува улогите и одговорностите за безбедност на
            информациите за да се обезбеди отчетност. Мерките вклучуваат јасно документирање на одговорностите,
            периодични прегледи и механизми за спроведување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.3
      name: Segregation of duties
      description: This control ensures segregation of duties to reduce the risk of errors, fraud, and
        unauthorized access. Measures include role separation, access restrictions, and regular audits.
      implementation_groups:
      - SoA
      - Governance
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.3
      - urn:intuitem:risk:function:doc-pol:pol.seg_duty
      translations:
        mk:
          name: Поделба на должностите
          description: Оваа контрола обезбедува поделба на должностите за да се намали ризикот од грешки,
            измама и неовластен пристап. Мерките вклучуваат раздвојување на улогите, ограничувања на пристапот
            и редовни ревизии.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.4
      name: Management responsibilities
      description: This control ensures management responsibilities for information security are clearly
        defined and implemented. Measures include setting objectives, allocating resources, and overseeing
        compliance.
      implementation_groups:
      - SoA
      - Governance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.4
      - urn:intuitem:risk:function:doc-pol:doc.educ_register
      translations:
        mk:
          name: Одговорности на раководството
          description: Оваа контрола обезбедува одговорностите на раководството за безбедност на информациите
            да бидат јасно дефинирани и спроведени. Мерките вклучуваат поставување цели, распределба на
            ресурси и надзор над усогласеноста.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.5
      name: Contact with authorities
      description: This control ensures timely communication with relevant authorities during information
        security incidents. Measures include establishing contact protocols, maintaining updated contact
        lists, and assigning responsibilities.
      implementation_groups:
      - SoA
      - Governance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.5
      translations:
        mk:
          name: Контакт со надлежните органи
          description: Оваа контрола обезбедува навремена комуникација со надлежните органи при инциденти
            со безбедноста на информациите. Мерките вклучуваат воспоставување протоколи за контакт, одржување
            ажурни листи на контакти и доделување одговорности.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.6
      name: Contact with special interest groups
      description: This control facilitates contact with special interest groups to stay informed about
        security trends and practices. Measures include participation in forums, memberships, and collaborative
        initiatives.
      implementation_groups:
      - SoA
      - Governance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.6
      translations:
        mk:
          name: Контакт со групи од посебен интерес
          description: Оваа контрола го олеснува контактот со групи од посебен интерес за следење на безбедносните
            трендови и практики. Мерките вклучуваат учество на форуми, членства и заеднички иницијативи.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.7
      name: Threat intelligence
      description: This control ensures threat intelligence is developed and maintained to identify and
        mitigate security risks. Measures include monitoring threat feeds, analyzing trends, and sharing
        actionable insights.
      implementation_groups:
      - SoA
      - Threat_and_vulnerability_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.7
      - urn:intuitem:risk:function:doc-pol:proc.threat_intel
      translations:
        mk:
          name: Разузнавање за закани
          description: Оваа контрола обезбедува развивање и одржување разузнавање за закани за да се идентификуваат
            и ублажат безбедносните ризици. Мерките вклучуваат следење на извори на закани, анализа на
            трендови и споделување применливи сознанија.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.8
      name: Information security in project management
      description: This control incorporates information security into project management practices. Measures
        include risk assessments, compliance reviews, and security checkpoints during project lifecycles.
      implementation_groups:
      - SoA
      - Governance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.8
      - urn:intuitem:risk:function:doc-pol:pol.project
      translations:
        mk:
          name: Безбедност на информациите во управувањето со проекти
          description: Оваа контрола ја вклучува безбедноста на информациите во практиките за управување
            со проекти. Мерките вклучуваат проценки на ризик, прегледи на усогласеноста и безбедносни
            контролни точки во текот на животниот циклус на проектите.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.9
      name: Inventory of information and other associated assets
      description: This control ensures an accurate inventory of information and associated assets is
        maintained. Measures include asset tracking, periodic audits, and classification by sensitivity.
      implementation_groups:
      - SoA
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.9
      - urn:intuitem:risk:function:doc-pol:doc.asset_register
      - urn:intuitem:risk:function:doc-pol:tech.asset_discovery
      - urn:intuitem:risk:function:doc-pol:pol.asset
      translations:
        mk:
          name: Попис на информации и други поврзани средства
          description: Оваа контрола обезбедува одржување точен попис на информациите и поврзаните средства.
            Мерките вклучуваат следење на средствата, периодични ревизии и класификација според чувствителноста.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.10
      name: Acceptable use of information and other associated assets
      description: This control defines acceptable use of information and associated assets to ensure
        proper handling. Measures include documented policies, user training, and enforcement mechanisms.
      implementation_groups:
      - SoA
      - Asset_management
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.10
      - urn:intuitem:risk:function:doc-pol:pol.accept
      translations:
        mk:
          name: Прифатлива употреба на информации и други поврзани средства
          description: Оваа контрола ја дефинира прифатливата употреба на информациите и поврзаните средства
            за да се обезбеди соодветно ракување. Мерките вклучуваат документирани политики, обука на
            корисниците и механизми за спроведување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.11
      name: Return of assets
      description: This control ensures the secure return of assets when employees or contractors leave
        or change roles. Measures include checklists, asset tracking, and decommissioning protocols.
      implementation_groups:
      - SoA
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.11
      translations:
        mk:
          name: Враќање на средствата
          description: Оваа контрола обезбедува безбедно враќање на средствата кога вработените или изведувачите
            заминуваат или ја менуваат улогата. Мерките вклучуваат контролни листи, следење на средствата
            и протоколи за повлекување од употреба.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.12
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.12
      name: Classification of information
      description: This control ensures information is classified based on its sensitivity and value to
        ensure appropriate protection. Measures include classification schemes, access restrictions, and
        labeling guidelines.
      implementation_groups:
      - SoA
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.12
      - urn:intuitem:risk:function:doc-pol:pol.classif
      translations:
        mk:
          name: Класификација на информациите
          description: Оваа контрола обезбедува класификација на информациите според нивната чувствителност
            и вредност за да се обезбеди соодветна заштита. Мерките вклучуваат шеми за класификација,
            ограничувања на пристапот и упатства за означување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.13
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.13
      name: Labelling of information
      description: This control ensures consistent labeling of information to reflect its classification
        and handling requirements. Measures include standardized templates, training, and audits.
      implementation_groups:
      - SoA
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.13
      translations:
        mk:
          name: Означување на информациите
          description: Оваа контрола обезбедува доследно означување на информациите во согласност со нивната
            класификација и барањата за ракување. Мерките вклучуваат стандардизирани обрасци, обука и
            ревизии.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.14
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.14
      name: Information transfer
      description: This control establishes secure processes for transferring information between systems
        or organizations. Measures include encryption, access controls, and secure transfer protocols.
      implementation_groups:
      - SoA
      - Asset_management
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.14
      - urn:intuitem:risk:function:doc-pol:pol.transfer
      translations:
        mk:
          name: Пренос на информации
          description: Оваа контрола воспоставува безбедни процеси за пренос на информации меѓу системи
            или организации. Мерките вклучуваат шифрирање, контроли на пристапот и безбедни протоколи
            за пренос.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.15
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.15
      name: Access control
      description: This control implements and maintains access control mechanisms to restrict access
        to authorized individuals. Measures include role-based access, multi-factor authentication, and
        periodic reviews.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.15
      - urn:intuitem:risk:function:doc-pol:pol.access
      translations:
        mk:
          name: Контрола на пристапот
          description: Оваа контрола имплементира и одржува механизми за контрола на пристапот за пристапот
            да биде ограничен на овластени лица. Мерките вклучуваат пристап заснован на улоги, повеќефакторска
            автентикација и периодични прегледи.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.16
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.16
      name: Identity management
      description: This control ensures identities are managed securely to guarantee accurate and reliable
        access to systems. Measures include identity verification, lifecycle management, and access provisioning.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.16
      - urn:intuitem:risk:function:doc-pol:tech.iam
      translations:
        mk:
          name: Управување со идентитети
          description: Оваа контрола обезбедува безбедно управување со идентитетите за да се гарантира
            точен и сигурен пристап до системите. Мерките вклучуваат верификација на идентитетот, управување
            со животниот циклус и доделување пристап.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.17
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.17
      name: Authentication information
      description: This control protects authentication information, such as passwords, to prevent unauthorized
        access. Measures include encryption, secure storage, and periodic password updates.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.17
      - urn:intuitem:risk:function:doc-pol:tech.mfa
      - urn:intuitem:risk:function:doc-pol:tech.password_manager
      translations:
        mk:
          name: Информации за автентикација
          description: Оваа контрола ги штити информациите за автентикација, како што се лозинките, за
            да се спречи неовластен пристап. Мерките вклучуваат шифрирање, безбедно чување и периодично
            менување на лозинките.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.18
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.18
      name: Access rights
      description: This control ensures access rights are regularly reviewed and managed to align with
        roles and responsibilities. Measures include periodic audits, access revocation, and automated
        access management.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.18
      - urn:intuitem:risk:function:doc-pol:proc.recertification
      - urn:intuitem:risk:function:doc-pol:proc.pam
      translations:
        mk:
          name: Права на пристап
          description: Оваа контрола обезбедува правата на пристап редовно да се преиспитуваат и да се
            управуваат во согласност со улогите и одговорностите. Мерките вклучуваат периодични ревизии,
            одземање на пристапот и автоматизирано управување со пристапот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.19
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.19
      name: Information security in supplier relationships
      description: This control ensures information security is embedded in supplier relationships and
        processes. Measures include due diligence, security reviews, and ongoing monitoring.
      implementation_groups:
      - SoA
      - Supplier_relationships_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.19
      - urn:intuitem:risk:function:doc-pol:pol.supplier
      - urn:intuitem:risk:function:doc-pol:doc.supplier_register
      - urn:intuitem:risk:function:doc-pol:proc.tprm_assessment
      translations:
        mk:
          name: Безбедност на информациите во односите со добавувачите
          description: Оваа контрола обезбедува безбедноста на информациите да биде вградена во односите
            и процесите со добавувачите. Мерките вклучуваат длабинска анализа, безбедносни прегледи и
            тековно следење.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.20
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.20
      name: Addressing information security within supplier agreements
      description: This control addresses information security requirements within supplier agreements.
        Measures include explicit contract clauses, compliance audits, and defined penalties for violations.
      implementation_groups:
      - SoA
      - Supplier_relationships_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.20
      translations:
        mk:
          name: Опфаќање на безбедноста на информациите во договорите со добавувачите
          description: Оваа контрола ги опфаќа барањата за безбедност на информациите во договорите со
            добавувачите. Мерките вклучуваат изречни договорни одредби, ревизии на усогласеноста и дефинирани
            казни за прекршувања.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.21
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.21
      name: Managing information security in the ICT supply chain
      description: This control manages information security risks in the ICT supply chain to ensure security
        of services and components. Measures include risk assessments, supplier evaluations, and incident
        response protocols.
      implementation_groups:
      - SoA
      - Supplier_relationships_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.21
      - urn:intuitem:risk:function:doc-pol:proc.sbom
      translations:
        mk:
          name: Управување со безбедноста на информациите во ИКТ синџирот на снабдување
          description: Оваа контрола управува со ризиците за безбедноста на информациите во ИКТ синџирот
            на снабдување за да се обезбеди безбедност на услугите и компонентите. Мерките вклучуваат
            проценки на ризик, евалуации на добавувачите и протоколи за одговор на инциденти.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.22
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.22
      name: Monitoring, review and change management of supplier services
      description: This control ensures supplier services are monitored, reviewed, and adjusted to maintain
        information security. Measures include service level agreements, periodic reviews, and contract
        updates.
      implementation_groups:
      - SoA
      - Supplier_relationships_security
      - Information_security_assurance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.22
      translations:
        mk:
          name: Следење, преиспитување и управување со промени на услугите на добавувачите
          description: Оваа контрола обезбедува услугите на добавувачите да се следат, преиспитуваат и
            прилагодуваат за да се одржи безбедноста на информациите. Мерките вклучуваат договори за ниво
            на услуга, периодични прегледи и ажурирања на договорите.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.23
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.23
      name: Information security for use of cloud services
      description: This control ensures the secure use of cloud services by addressing associated risks.
        Measures include data encryption, access controls, and provider compliance reviews.
      implementation_groups:
      - SoA
      - Supplier_relationships_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.23
      - urn:intuitem:risk:function:doc-pol:pol.cloud
      translations:
        mk:
          name: Безбедност на информациите при користење услуги во облак
          description: Оваа контрола обезбедува безбедно користење на услугите во облак преку справување
            со поврзаните ризици. Мерките вклучуваат шифрирање на податоците, контроли на пристапот и
            прегледи на усогласеноста на давателот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.24
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.24
      name: Information security incident management planning and preparation
      description: This control ensures proper planning and preparation for managing information security
        incidents. Measures include incident response plans, training exercises, and communication protocols.
      implementation_groups:
      - SoA
      - Governance
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.24
      - urn:intuitem:risk:function:doc-pol:pol.incident
      - urn:intuitem:risk:function:doc-pol:proc.ir_exercise
      translations:
        mk:
          name: Планирање и подготовка за управување со инциденти со безбедноста на информациите
          description: Оваа контрола обезбедува соодветно планирање и подготовка за управување со инциденти
            со безбедноста на информациите. Мерките вклучуваат планови за одговор на инциденти, вежби
            и протоколи за комуникација.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.25
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.25
      name: Assessment and decision on information security events
      description: This control establishes processes for assessing and deciding on actions related to
        information security events. Measures include root cause analysis, risk evaluation, and mitigation
        plans.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.25
      - urn:intuitem:risk:function:doc-pol:doc.incident_register
      translations:
        mk:
          name: Проценка и одлучување за настани поврзани со безбедноста на информациите
          description: Оваа контрола воспоставува процеси за проценка и одлучување за дејствата поврзани
            со настани од областа на безбедноста на информациите. Мерките вклучуваат анализа на основната
            причина, евалуација на ризикот и планови за ублажување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.26
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.26
      name: Response to information security incidents
      description: This control ensures effective response to information security incidents to minimize
        impact and recover quickly. Measures include incident reporting, escalation protocols, and containment
        strategies.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.26
      - urn:intuitem:risk:function:doc-pol:doc.incident_register
      - urn:intuitem:risk:function:doc-pol:proc.incident
      translations:
        mk:
          name: Одговор на инциденти со безбедноста на информациите
          description: Оваа контрола обезбедува ефективен одговор на инцидентите со безбедноста на информациите
            за да се минимизира влијанието и да се овозможи брзо закрепнување. Мерките вклучуваат пријавување
            инциденти, протоколи за ескалација и стратегии за ограничување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.27
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.27
      name: Learning from information security incidents
      description: This control ensures lessons learned from information security incidents are documented
        and implemented to improve processes. Measures include post-incident reviews, action plans, and
        policy updates.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.27
      - urn:intuitem:risk:function:doc-pol:proc.post_incident
      translations:
        mk:
          name: Учење од инцидентите со безбедноста на информациите
          description: Оваа контрола обезбедува научените лекции од инцидентите со безбедноста на информациите
            да бидат документирани и применети за подобрување на процесите. Мерките вклучуваат прегледи
            по инцидентите, акциски планови и ажурирање на политиките.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.28
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.28
      name: Collection of evidence
      description: This control ensures evidence is collected and preserved during security incidents
        to support investigations. Measures include chain-of-custody procedures, secure storage, and access
        controls.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.28
      - urn:intuitem:risk:function:doc-pol:proc.forensics
      translations:
        mk:
          name: Собирање докази
          description: Оваа контрола обезбедува собирање и зачувување докази при безбедносни инциденти
            за поддршка на истрагите. Мерките вклучуваат процедури за синџир на чување, безбедно складирање
            и контроли на пристапот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.29
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.29
      name: Information security during disruption
      description: This control ensures information security is maintained during disruptions to guarantee
        continuity of operations. Measures include contingency plans, backup systems, and failover mechanisms.
      implementation_groups:
      - SoA
      - Continuity
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.29
      - urn:intuitem:risk:function:doc-pol:pol.bcp
      - urn:intuitem:risk:function:doc-pol:proc.bcp_exercise
      translations:
        mk:
          name: Безбедност на информациите при нарушување
          description: Оваа контрола обезбедува одржување на безбедноста на информациите при нарушувања
            за да се гарантира континуитет на работењето. Мерките вклучуваат планови за непредвидени ситуации,
            резервни системи и механизми за преземање (failover).
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.30
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.30
      name: ICT readiness for business continuity
      description: This control ensures ICT readiness for business continuity to minimize downtime during
        disruptions. Measures include testing recovery plans, redundant systems, and disaster recovery
        sites.
      implementation_groups:
      - SoA
      - Continuity
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.30
      - urn:intuitem:risk:function:doc-pol:doc.bia
      - urn:intuitem:risk:function:doc-pol:proc.drp
      - urn:intuitem:risk:function:doc-pol:proc.bcp_exercise
      translations:
        mk:
          name: Подготвеност на ИКТ за континуитет на работењето
          description: Оваа контрола обезбедува подготвеност на ИКТ за континуитет на работењето за да
            се минимизира застојот при нарушувања. Мерките вклучуваат тестирање на плановите за обнова,
            редундантни системи и локации за обнова по катастрофа.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.31
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.31
      name: Legal, statutory, regulatory and contractual requirements
      description: This control ensures compliance with legal, statutory, regulatory, and contractual
        information security requirements. Measures include policy reviews, audits, and evidence documentation.
      implementation_groups:
      - SoA
      - Legal_and_compliance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.31
      - urn:intuitem:risk:function:doc-pol:doc.legal
      translations:
        mk:
          name: Законски, регулаторни и договорни барања
          description: Оваа контрола обезбедува усогласеност со законските, регулаторните и договорните
            барања за безбедност на информациите. Мерките вклучуваат прегледи на политиките, ревизии и
            документирање на доказите.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.32
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.32
      name: Intellectual property rights
      description: This control ensures intellectual property rights are protected through appropriate
        information security measures. Measures include access restrictions, encryption, and legal agreements.
      implementation_groups:
      - SoA
      - Legal_and_compliance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.32
      - urn:intuitem:risk:function:doc-pol:tech.app_control
      translations:
        mk:
          name: Права на интелектуална сопственост
          description: Оваа контрола обезбедува правата на интелектуална сопственост да бидат заштитени
            со соодветни мерки за безбедност на информациите. Мерките вклучуваат ограничувања на пристапот,
            шифрирање и правни договори.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.33
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.33
      name: Protection of records
      description: This control ensures records are securely stored and protected to prevent loss or unauthorized
        access. Measures include retention policies, secure storage, and access controls.
      implementation_groups:
      - SoA
      - Legal_and_compliance
      - Asset_management
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.33
      - urn:intuitem:risk:function:doc-pol:pol.retention
      translations:
        mk:
          name: Заштита на записите
          description: Оваа контрола обезбедува записите безбедно да се чуваат и штитат за да се спречи
            губење или неовластен пристап. Мерките вклучуваат политики за чување, безбедно складирање
            и контроли на пристапот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.34
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.34
      name: Privacy and protection of PII
      description: This control protects privacy and ensures the secure handling of personally identifiable
        information (PII). Measures include anonymization, encryption, and compliance with privacy laws.
      implementation_groups:
      - SoA
      - Information_protection
      - Legal_and_compliance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.34
      - urn:intuitem:risk:function:doc-pol:doc.ropa
      - urn:intuitem:risk:function:doc-pol:pol.privacy
      - urn:intuitem:risk:function:doc-pol:proc.dpia
      - urn:intuitem:risk:function:doc-pol:proc.breach_notif
      translations:
        mk:
          name: Приватност и заштита на лични податоци
          description: Оваа контрола ја штити приватноста и обезбедува безбедно ракување со личните податоци.
            Мерките вклучуваат анонимизација, шифрирање и усогласеност со прописите за заштита на личните
            податоци.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.35
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.35
      name: Independent review of information security
      description: This control ensures independent reviews of information security to evaluate effectiveness
        and compliance. Measures include external audits, risk assessments, and follow-up actions.
      implementation_groups:
      - SoA
      - Information_security_assurance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.35
      - urn:intuitem:risk:function:doc-pol:doc.audit_plan
      - urn:intuitem:risk:function:doc-pol:pol.audit
      - urn:intuitem:risk:function:doc-pol:doc.nc_log
      translations:
        mk:
          name: Независно преиспитување на безбедноста на информациите
          description: Оваа контрола обезбедува независни преиспитувања на безбедноста на информациите
            за да се оцени ефективноста и усогласеноста. Мерките вклучуваат надворешни ревизии, проценки
            на ризик и последователни дејства.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.36
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.36
      name: Compliance with policies, rules and standards for information security
      description: This control ensures compliance with all policies, rules, and standards for information
        security. Measures include regular training, policy reviews, and enforcement mechanisms.
      implementation_groups:
      - SoA
      - Legal_and_compliance
      - Information_security_assurance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.36
      - urn:intuitem:risk:function:doc-pol:proc.compliance_monitoring
      - urn:intuitem:risk:function:doc-pol:doc.nc_log
      translations:
        mk:
          name: Усогласеност со политиките, правилата и стандардите за безбедност на информациите
          description: Оваа контрола обезбедува усогласеност со сите политики, правила и стандарди за
            безбедност на информациите. Мерките вклучуваат редовна обука, прегледи на политиките и механизми
            за спроведување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.37
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.37
      name: Documented operating procedures
      description: This control develops and maintains documented operating procedures to ensure consistency
        in security practices. Measures include process documentation, version control, and accessibility.
      implementation_groups:
      - SoA
      - Asset_management
      - Physical_security
      - System_and_network_security
      - Application_security
      - Secure_configuration
      - Identity_and_access_management
      - Threat_and_vulnerability_management
      - Continuity
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.37
      - urn:intuitem:risk:function:doc-pol:doc.proc_register
      translations:
        mk:
          name: Документирани оперативни процедури
          description: Оваа контрола развива и одржува документирани оперативни процедури за да се обезбеди
            доследност во безбедносните практики. Мерките вклучуваат документирање на процесите, контрола
            на верзии и достапност.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.6
      name: People controls
      implementation_groups:
      - SoA
      translations:
        mk:
          name: Контроли поврзани со луѓето
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.1
      name: Screening
      description: This control ensures the implementation of screening processes to verify the suitability
        of candidates before employment. Measures include background checks, identity verification, and
        assessment of qualifications to reduce security risks.
      implementation_groups:
      - SoA
      - Human_resource_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.1
      - urn:intuitem:risk:function:doc-pol:proc.bg_screening
      translations:
        mk:
          name: Проверка на кандидатите
          description: Оваа контрола обезбедува спроведување процеси за проверка на подобноста на кандидатите
            пред вработување. Мерките вклучуваат безбедносни проверки, верификација на идентитетот и проценка
            на квалификациите за да се намалат безбедносните ризици.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.2
      name: Terms and conditions of employment
      description: This control ensures that terms and conditions of employment include information security
        responsibilities. Measures include explicit clauses about confidentiality, compliance with policies,
        and consequences for breaches.
      implementation_groups:
      - SoA
      - Human_resource_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.2
      translations:
        mk:
          name: Услови за вработување
          description: Оваа контрола обезбедува условите за вработување да ги вклучуваат одговорностите
            за безбедност на информациите. Мерките вклучуваат изречни одредби за доверливост, усогласеност
            со политиките и последици за прекршувања.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.3
      name: Information security awareness, education and training
      description: This control ensures that employees receive regular information security awareness,
        education, and training. Measures include scheduled training sessions, e-learning programs, and
        simulated phishing exercises.
      implementation_groups:
      - SoA
      - Human_resource_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.3
      - urn:intuitem:risk:function:doc-pol:doc.educ_plan
      - urn:intuitem:risk:function:doc-pol:doc.educ_register
      translations:
        mk:
          name: Подигнување на свеста, едукација и обука за безбедност на информациите
          description: Оваа контрола обезбедува вработените редовно да добиваат подигнување на свеста,
            едукација и обука за безбедност на информациите. Мерките вклучуваат закажани обуки, програми
            за е-учење и симулирани фишинг вежби.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.4
      name: Disciplinary process
      description: This control establishes a disciplinary process to address breaches of information
        security policies. Measures include clear guidelines, escalation procedures, and consistent enforcement
        to maintain accountability.
      implementation_groups:
      - SoA
      - Human_resource_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.4
      - urn:intuitem:risk:function:doc-pol:proc.disciplinary
      translations:
        mk:
          name: Дисциплинска постапка
          description: Оваа контрола воспоставува дисциплинска постапка за прекршувања на политиките за
            безбедност на информациите. Мерките вклучуваат јасни упатства, постапки за ескалација и доследно
            спроведување за одржување на отчетноста.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.5
      name: Responsibilities after termination or change of employment
      description: This control ensures that responsibilities related to information security are defined
        and enforced after termination or role changes. Measures include revoking access rights, collecting
        organizational assets, and conducting exit interviews.
      implementation_groups:
      - SoA
      - Human_resource_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.5
      - urn:intuitem:risk:function:doc-pol:proc.hr_security
      translations:
        mk:
          name: Одговорности по престанок или промена на вработувањето
          description: Оваа контрола обезбедува одговорностите поврзани со безбедноста на информациите
            да бидат дефинирани и спроведени по престанок на вработувањето или промена на улогата. Мерките
            вклучуваат одземање на правата на пристап, враќање на средствата на организацијата и излезни
            интервјуа.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.6
      name: Confidentiality or non-disclosure agreements
      description: This control implements confidentiality or non-disclosure agreements to protect sensitive
        information. Measures include signed agreements at the start of employment, periodic reminders,
        and enforcement of legal actions in case of violations.
      implementation_groups:
      - SoA
      - Human_resource_security
      - Information_protection
      - Supplier_relationships_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.6
      translations:
        mk:
          name: Договори за доверливост или неоткривање
          description: Оваа контрола имплементира договори за доверливост или неоткривање за заштита на
            чувствителните информации. Мерките вклучуваат потпишани договори на почетокот на вработувањето,
            периодични потсетувања и правни мерки во случај на прекршување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.7
      name: Remote working
      description: This control ensures the secure management of information security risks during remote
        working. Measures include secure access to corporate systems, mandatory use of VPNs, and policies
        for handling sensitive data remotely.
      implementation_groups:
      - SoA
      - Asset_management
      - Information_protection
      - Physical_security
      - System_and_network_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.7
      - urn:intuitem:risk:function:doc-pol:pol.work
      translations:
        mk:
          name: Работа од далечина
          description: Оваа контрола обезбедува безбедно управување со ризиците за безбедноста на информациите
            при работа од далечина. Мерките вклучуваат безбеден пристап до корпоративните системи, задолжителна
            употреба на VPN и политики за ракување со чувствителни податоци од далечина.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.8
      name: Information security event reporting
      description: This control ensures employees can promptly report information security events. Measures
        include incident reporting channels, awareness campaigns, and follow-up procedures to investigate
        and address reported events.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.8
      translations:
        mk:
          name: Пријавување настани поврзани со безбедноста на информациите
          description: Оваа контрола обезбедува вработените навремено да можат да пријават настани поврзани
            со безбедноста на информациите. Мерките вклучуваат канали за пријавување инциденти, кампањи
            за подигнување на свеста и постапки за истражување и решавање на пријавените настани.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.7
      name: Physical controls
      implementation_groups:
      - SoA
      translations:
        mk:
          name: Физички контроли
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.1
      name: Physical security perimeters
      description: This control establishes physical security perimeters to protect critical areas from
        unauthorized access. Measures include barriers, access controls, and monitoring systems to ensure
        only authorized individuals can enter.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.1
      - urn:intuitem:risk:function:doc-pol:phys.secure_area
      translations:
        mk:
          name: Физички безбедносни периметри
          description: Оваа контрола воспоставува физички безбедносни периметри за заштита на критичните
            простори од неовластен пристап. Мерките вклучуваат бариери, контроли на пристапот и системи
            за надзор, за да влегуваат само овластени лица.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.2
      name: Physical entry
      description: This control ensures physical entry points are controlled and monitored to prevent
        unauthorized access. Measures include badge systems, security personnel, and visitor logs.
      implementation_groups:
      - SoA
      - Physical_security
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.2
      - urn:intuitem:risk:function:doc-pol:phys.visitor_mgmt
      translations:
        mk:
          name: Физички влез
          description: Оваа контрола обезбедува физичките влезни точки да се контролираат и надгледуваат
            за да се спречи неовластен пристап. Мерките вклучуваат системи со картички, обезбедување и
            евиденција на посетители.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.3
      name: Securing offices, rooms and facilities
      description: This control ensures that offices, rooms, and facilities are secured to protect information
        and resources. Measures include locked doors, restricted areas, and surveillance systems.
      implementation_groups:
      - SoA
      - Physical_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.3
      translations:
        mk:
          name: Обезбедување на канцелариите, просториите и објектите
          description: Оваа контрола обезбедува канцелариите, просториите и објектите да бидат обезбедени
            за заштита на информациите и ресурсите. Мерките вклучуваат заклучени врати, ограничени зони
            и системи за надзор.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.4
      name: Physical security monitoring
      description: This control implements physical security monitoring to detect and respond promptly
        to threats. Measures include CCTV systems, motion detectors, and real-time alerts.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.4
      - urn:intuitem:risk:function:doc-pol:phys.cctv
      translations:
        mk:
          name: Физички безбедносен надзор
          description: Оваа контрола имплементира физички безбедносен надзор за навремено откривање и
            реагирање на закани. Мерките вклучуваат видеонадзор, сензори за движење и известувања во реално
            време.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.5
      name: Protecting against physical and environmental threats
      description: This control protects systems and resources from physical and environmental threats.
        Measures include fire suppression systems, temperature controls, and flood prevention barriers.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.5
      translations:
        mk:
          name: Заштита од физички закани и закани од околината
          description: Оваа контрола ги штити системите и ресурсите од физички закани и закани од околината.
            Мерките вклучуваат системи за гаснење пожар, контрола на температурата и бариери против поплави.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.6
      name: Working In secure areas
      description: This control ensures that secure areas are managed to allow authorized access only.
        Measures include access control systems, visitor escorts, and activity monitoring.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.6
      translations:
        mk:
          name: Работа во безбедни простори
          description: Оваа контрола обезбедува безбедните простори да се управуваат така што е дозволен
            само овластен пристап. Мерките вклучуваат системи за контрола на пристапот, придружба на посетителите
            и следење на активностите.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.7
      name: Clear desk and clear screen
      description: This control ensures sensitive information is not left exposed by adopting clear desk
        and clear screen policies. Measures include locking sensitive documents away and auto-locking
        screens when not in use.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.7
      - urn:intuitem:risk:function:doc-pol:phys.clear_desk
      translations:
        mk:
          name: Чисто биро и чист екран
          description: Оваа контрола обезбедува чувствителните информации да не останат изложени преку
            политики за чисто биро и чист екран. Мерките вклучуваат заклучување на чувствителните документи
            и автоматско заклучување на екраните кога не се користат.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.8
      name: Equipment siting and protection
      description: This control ensures that equipment is positioned and protected to prevent unauthorized
        access or damage. Measures include secure mounting, locked cabinets, and restricted access areas.
      implementation_groups:
      - SoA
      - Physical_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.8
      translations:
        mk:
          name: Поставување и заштита на опремата
          description: Оваа контрола обезбедува опремата да биде поставена и заштитена за да се спречи
            неовластен пристап или оштетување. Мерките вклучуваат безбедно монтирање, заклучени ормари
            и зони со ограничен пристап.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.9
      name: Security of assets off-premises
      description: This control ensures assets used or stored off-premises are secured to maintain confidentiality
        and integrity. Measures include encryption, secure transport, and access tracking.
      implementation_groups:
      - SoA
      - Physical_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.9
      - urn:intuitem:risk:function:doc-pol:pol.work
      translations:
        mk:
          name: Безбедност на средствата надвор од просториите
          description: Оваа контрола обезбедува средствата што се користат или чуваат надвор од просториите
            на организацијата да бидат заштитени за да се одржат доверливоста и интегритетот. Мерките
            вклучуваат шифрирање, безбеден транспорт и следење на пристапот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.10
      name: Storage media
      description: This control safeguards storage media to prevent unauthorized access or tampering.
        Measures include secure storage, encryption, and access restrictions.
      implementation_groups:
      - SoA
      - Physical_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.10
      - urn:intuitem:risk:function:doc-pol:pol.removable_media
      translations:
        mk:
          name: Медиуми за складирање
          description: Оваа контрола ги штити медиумите за складирање за да се спречи неовластен пристап
            или манипулација. Мерките вклучуваат безбедно чување, шифрирање и ограничувања на пристапот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.11
      name: Supporting utilities
      description: This control ensures that supporting utilities, such as power and cooling systems,
        are reliable and protected from disruptions. Measures include redundant systems and physical security.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.11
      - urn:intuitem:risk:function:doc-pol:phys.power_env
      translations:
        mk:
          name: Помошни комунални услуги
          description: Оваа контрола обезбедува помошните комунални услуги, како напојувањето и ладењето,
            да бидат сигурни и заштитени од прекини. Мерките вклучуваат редундантни системи и физичка
            безбедност.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.12
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.12
      name: Cabling security
      description: This control ensures that cables are secured to prevent unauthorized interception or
        damage. Measures include protective conduits, proper labeling, and secure routing.
      implementation_groups:
      - SoA
      - Physical_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.12
      translations:
        mk:
          name: Безбедност на каблите
          description: Оваа контрола обезбедува каблите да бидат заштитени за да се спречи неовластено
            пресретнување или оштетување. Мерките вклучуваат заштитни канали, соодветно означување и безбедно
            трасирање.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.13
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.13
      name: Equipment maintenance
      description: This control ensures that equipment is maintained to guarantee proper functioning and
        prevent failures. Measures include regular servicing, secure maintenance practices, and authorized
        personnel access.
      implementation_groups:
      - SoA
      - Physical_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.13
      - urn:intuitem:risk:function:doc-pol:pol.maintenance
      translations:
        mk:
          name: Одржување на опремата
          description: Оваа контрола обезбедува одржување на опремата за да се гарантира правилно функционирање
            и да се спречат дефекти. Мерките вклучуваат редовен сервис, безбедни практики за одржување
            и пристап само за овластен персонал.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.14
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.14
      name: Secure disposal or re-use of equipment
      description: This control ensures the secure disposal or reuse of equipment to protect sensitive
        information. Measures include data sanitization, physical destruction, and certified disposal
        processes.
      implementation_groups:
      - SoA
      - Physical_security
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.14
      - urn:intuitem:risk:function:doc-pol:proc.disposal
      - urn:intuitem:risk:function:doc-pol:phys.equipment_disposal
      translations:
        mk:
          name: Безбедно отстранување или повторна употреба на опремата
          description: Оваа контрола обезбедува безбедно отстранување или повторна употреба на опремата
            за заштита на чувствителните информации. Мерките вклучуваат бришење на податоците, физичко
            уништување и сертифицирани процеси за отстранување.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.8
      name: Technological controls
      implementation_groups:
      - SoA
      translations:
        mk:
          name: Технолошки контроли
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.1
      name: User end point devices
      description: This control ensures the protection of endpoint devices such as laptops, desktops,
        and mobile devices by implementing security measures like endpoint detection, encryption, and
        secure configurations to minimize risks.
      implementation_groups:
      - SoA
      - Asset_management
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.1
      - urn:intuitem:risk:function:doc-pol:tech.mdm
      translations:
        mk:
          name: Кориснички крајни уреди
          description: Оваа контрола обезбедува заштита на крајните уреди, како што се лаптопи, десктоп
            компјутери и мобилни уреди, со безбедносни мерки како откривање на крајни точки, шифрирање
            и безбедни конфигурации за минимизирање на ризиците.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.2
      name: Privileged access rights
      description: This control ensures that privileged access rights are granted, managed, and monitored
        carefully to prevent misuse and enhance security. Measures include role-based access controls,
        periodic reviews, and strict account management.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.2
      - urn:intuitem:risk:function:doc-pol:doc.pam_register
      - urn:intuitem:risk:function:doc-pol:proc.pam
      translations:
        mk:
          name: Привилегирани права на пристап
          description: Оваа контрола обезбедува привилегираните права на пристап внимателно да се доделуваат,
            управуваат и следат за да се спречи злоупотреба и да се зајакне безбедноста. Мерките вклучуваат
            контроли на пристап засновани на улоги, периодични прегледи и строго управување со сметките.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.3
      name: Information access restriction
      description: This control restricts access to sensitive information based on need-to-know principles.
        Measures include user authentication, role-based permissions, and regular access reviews.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.3
      translations:
        mk:
          name: Ограничување на пристапот до информациите
          description: Оваа контрола го ограничува пристапот до чувствителните информации според принципот
            „потребно да знае“. Мерките вклучуваат автентикација на корисниците, дозволи засновани на
            улоги и редовни прегледи на пристапот.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.4
      name: Access to source code
      description: This control secures access to source code by preventing unauthorized viewing, modification,
        or exposure. Measures include version control, secure repositories, and restricted developer access.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      - Application_security
      - Secure_configuration
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.4
      translations:
        mk:
          name: Пристап до изворниот код
          description: Оваа контрола го обезбедува пристапот до изворниот код преку спречување неовластено
            прегледување, менување или откривање. Мерките вклучуваат контрола на верзии, безбедни репозиториуми
            и ограничен пристап за развивачите.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.5
      name: Secure authentication
      description: This control implements strong authentication mechanisms, such as multi-factor authentication,
        to verify user identities and prevent unauthorized access.
      implementation_groups:
      - SoA
      - Identity_and_access_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.5
      - urn:intuitem:risk:function:doc-pol:tech.mfa
      translations:
        mk:
          name: Безбедна автентикација
          description: Оваа контрола имплементира силни механизми за автентикација, како повеќефакторска
            автентикација, за верификација на идентитетот на корисниците и спречување неовластен пристап.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.6
      name: Capacity management
      description: This control ensures system capacity is managed to provide adequate performance and
        prevent disruptions. Measures include monitoring resource usage and planning for future needs.
      implementation_groups:
      - SoA
      - Continuity
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.6
      - urn:intuitem:risk:function:doc-pol:proc.capacity_mgmt
      translations:
        mk:
          name: Управување со капацитетот
          description: Оваа контрола обезбедува управување со капацитетот на системите за соодветни перформанси
            и спречување прекини. Мерките вклучуваат следење на искористеноста на ресурсите и планирање
            за идните потреби.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.7
      name: Protection against malware
      description: This control deploys measures like antivirus software, threat detection tools, and
        regular updates to protect systems from malware and malicious attacks.
      implementation_groups:
      - SoA
      - System_and_network_security
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.7
      - urn:intuitem:risk:function:doc-pol:tech.endpoint_protection
      - urn:intuitem:risk:function:doc-pol:tech.mail_gateway
      translations:
        mk:
          name: Заштита од злонамерен софтвер
          description: Оваа контрола применува мерки како антивирусен софтвер, алатки за откривање закани
            и редовни ажурирања за заштита на системите од злонамерен софтвер и напади.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.8
      name: Management of technical vulnerabilities
      description: This control identifies, evaluates, and remediates technical vulnerabilities promptly
        to minimize security risks. Measures include vulnerability scanning and patch management.
      implementation_groups:
      - SoA
      - Threat_and_vulnerability_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.8
      - urn:intuitem:risk:function:doc-pol:pol.vulnerability
      - urn:intuitem:risk:function:doc-pol:tech.vuln_scanner
      - urn:intuitem:risk:function:doc-pol:proc.pentest
      - urn:intuitem:risk:function:doc-pol:proc.update
      translations:
        mk:
          name: Управување со технички ранливости
          description: Оваа контрола навремено ги идентификува, оценува и отстранува техничките ранливости
            за да се минимизираат безбедносните ризици. Мерките вклучуваат скенирање на ранливости и управување
            со закрпи.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.9
      name: Configuration management
      description: This control ensures consistent management of system configurations to maintain security
        settings and prevent unauthorized changes.
      implementation_groups:
      - SoA
      - Secure_configuration
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.9
      - urn:intuitem:risk:function:doc-pol:pol.hardening
      translations:
        mk:
          name: Управување со конфигурации
          description: Оваа контрола обезбедува доследно управување со конфигурациите на системите за
            одржување на безбедносните поставки и спречување неовластени промени.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.10
      name: Information deletion
      description: This control ensures sensitive information is securely deleted when no longer required
        to prevent unauthorized recovery or exposure.
      implementation_groups:
      - SoA
      - Information_protection
      - Legal_and_compliance
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.10
      - urn:intuitem:risk:function:doc-pol:pol.retention
      - urn:intuitem:risk:function:doc-pol:phys.equipment_disposal
      translations:
        mk:
          name: Бришење на информации
          description: Оваа контрола обезбедува чувствителните информации безбедно да се бришат кога повеќе
            не се потребни, за да се спречи неовластено враќање или откривање.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.11
      name: Data masking
      description: This control protects sensitive information during processing or display by using data
        masking techniques to obscure data from unauthorized users.
      implementation_groups:
      - SoA
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.11
      translations:
        mk:
          name: Маскирање на податоци
          description: Оваа контрола ги штити чувствителните информации при обработка или прикажување
            со техники за маскирање на податоците, со кои податоците се прикриваат од неовластени корисници.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.12
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.12
      name: Data leakage prevention
      description: This control implements mechanisms to prevent the accidental exposure of sensitive
        data through email, removable media, or other channels.
      implementation_groups:
      - SoA
      - Information_protection
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.12
      - urn:intuitem:risk:function:doc-pol:tech.dlp
      translations:
        mk:
          name: Спречување на истекување на податоци
          description: Оваа контрола имплементира механизми за спречување на ненамерно откривање на чувствителни
            податоци преку е-пошта, преносливи медиуми или други канали.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.13
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.13
      name: Information backup
      description: This control ensures critical information is backed up regularly and securely to ensure
        its availability in case of incidents or disasters.
      implementation_groups:
      - SoA
      - Continuity
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.13
      - urn:intuitem:risk:function:doc-pol:pol.backup
      translations:
        mk:
          name: Резервни копии на информациите
          description: Оваа контрола обезбедува редовно и безбедно правење резервни копии од критичните
            информации за да бидат достапни во случај на инциденти или катастрофи.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.14
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.14
      name: Redundancy of information processing facilities
      description: This control ensures redundancy is built into processing facilities to maintain availability
        and operations during system failures or emergencies.
      implementation_groups:
      - SoA
      - Continuity
      - Asset_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.14
      - urn:intuitem:risk:function:doc-pol:doc.bia
      translations:
        mk:
          name: Редундантност на средствата за обработка на информации
          description: Оваа контрола обезбедува вградена редундантност во средствата за обработка за да
            се одржат достапноста и работењето при откази на системите или вонредни ситуации.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.15
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.15
      name: Logging
      description: This control enables logging of activities within systems to support monitoring, incident
        detection, and forensic investigations.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.15
      - urn:intuitem:risk:function:doc-pol:proc.logging
      - urn:intuitem:risk:function:doc-pol:tech.siem
      translations:
        mk:
          name: Евидентирање (логирање)
          description: Оваа контрола овозможува евидентирање на активностите во системите за поддршка
            на следењето, откривањето инциденти и форензичките истраги.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.16
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.16
      name: Monitoring activities
      description: This control ensures the ongoing monitoring of system activities to detect, respond
        to, and mitigate security threats.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.16
      - urn:intuitem:risk:function:doc-pol:pol.monitor
      translations:
        mk:
          name: Следење на активностите
          description: Оваа контрола обезбедува тековно следење на активностите во системите за откривање,
            реагирање и ублажување на безбедносните закани.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.17
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.17
      name: Clock synchronization
      description: This control ensures system clocks are synchronized to maintain accurate and consistent
        timestamps for logs and other critical processes.
      implementation_groups:
      - SoA
      - Information_security_event_management
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.17
      - urn:intuitem:risk:function:doc-pol:proc.ntp
      translations:
        mk:
          name: Синхронизација на часовниците
          description: Оваа контрола обезбедува синхронизација на системските часовници за точни и доследни
            временски печати во логовите и другите критични процеси.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.18
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.18
      name: Use of privileged utility programs
      description: This control restricts and monitors the use of privileged utility programs to prevent
        misuse and unauthorized actions.
      implementation_groups:
      - SoA
      - System_and_network_security
      - Secure_configuration
      - Application_security
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.18
      - urn:intuitem:risk:function:doc-pol:tech.app_control
      translations:
        mk:
          name: Користење привилегирани помошни програми
          description: Оваа контрола ја ограничува и следи употребата на привилегирани помошни програми
            за да се спречат злоупотреба и неовластени дејства.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.19
      assessable: true
      depth: 3
