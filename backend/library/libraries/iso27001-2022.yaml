urn: urn:intuitem:risk:library:iso27001-2022
locale: en
ref_id: ISO/IEC 27001:2022
name: International standard ISO/IEC 27001:2022
description: Information security, cybersecurity and privacy protection — Information security management
  systems — Requirements
copyright: This is the outline of the ISO27001-2022 standard. You can purchase the full standard from
  https://www.iso.org/standard/27001
version: 22
publication_date: 2026-11-25
provider: ISO/IEC
packager: intuitem
translations:
  mk:
    name: Меѓународен стандард ISO/IEC 27001:2022
    description: Безбедност на информациите, сајбер безбедност и заштита на приватноста — Системи за управување
      со безбедност на информациите — Барања
    copyright: Ова е преглед на стандардот ISO 27001:2022. Целосниот стандард може да се купи на https://www.iso.org/standard/27001
dependencies:
- urn:intuitem:risk:library:doc-pol
objects:
  reference_controls:
  - urn: urn:intuitem:risk:function:doc-pol:a.5.1
    ref_id: A.5.1
    name: Policies for information security
    category: policy
    description: This control establishes and maintains information security policies aligned with organizational
      objectives. Measures include defining scope, setting goals, and ensuring alignment with compliance
      requirements.
    translations:
      mk:
        name: Политики за безбедност на информациите
        description: Оваа контрола воспоставува и одржува политики за безбедност на информациите усогласени
          со целите на организацијата. Мерките вклучуваат дефинирање на опсегот, поставување цели и обезбедување
          усогласеност со барањата за сообразност.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.2
    ref_id: A.5.2
    name: Information security roles and responsibilities
    category: process
    description: This control defines and assigns roles and responsibilities for information security
      to ensure accountability. Measures include clear documentation of responsibilities, periodic reviews,
      and enforcement mechanisms.
    translations:
      mk:
        name: Улоги и одговорности за безбедност на информациите
        description: Оваа контрола ги дефинира и доделува улогите и одговорностите за безбедност на информациите
          за да се обезбеди отчетност. Мерките вклучуваат јасно документирање на одговорностите, периодични
          прегледи и механизми за спроведување.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.3
    ref_id: A.5.3
    name: Segregation of duties
    category: process
    description: This control ensures segregation of duties to reduce the risk of errors, fraud, and unauthorized
      access. Measures include role separation, access restrictions, and regular audits.
    translations:
      mk:
        name: Поделба на должностите
        description: Оваа контрола обезбедува поделба на должностите за да се намали ризикот од грешки,
          измама и неовластен пристап. Мерките вклучуваат раздвојување на улогите, ограничувања на пристапот
          и редовни ревизии.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.4
    ref_id: A.5.4
    name: Management responsibilities
    category: process
    description: This control ensures management responsibilities for information security are clearly
      defined and implemented. Measures include setting objectives, allocating resources, and overseeing
      compliance.
    translations:
      mk:
        name: Одговорности на раководството
        description: Оваа контрола обезбедува одговорностите на раководството за безбедност на информациите
          да бидат јасно дефинирани и спроведени. Мерките вклучуваат поставување цели, распределба на
          ресурси и надзор над усогласеноста.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.5
    ref_id: A.5.5
    name: Contact with authorities
    category: process
    description: This control ensures timely communication with relevant authorities during information
      security incidents. Measures include establishing contact protocols, maintaining updated contact
      lists, and assigning responsibilities.
    translations:
      mk:
        name: Контакт со надлежните органи
        description: Оваа контрола обезбедува навремена комуникација со надлежните органи при инциденти
          со безбедноста на информациите. Мерките вклучуваат воспоставување протоколи за контакт, одржување
          ажурни листи на контакти и доделување одговорности.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.6
    ref_id: A.5.6
    name: Contact with special interest groups
    category: process
    description: This control facilitates contact with special interest groups to stay informed about
      security trends and practices. Measures include participation in forums, memberships, and collaborative
      initiatives.
    translations:
      mk:
        name: Контакт со групи од посебен интерес
        description: Оваа контрола го олеснува контактот со групи од посебен интерес за следење на безбедносните
          трендови и практики. Мерките вклучуваат учество на форуми, членства и заеднички иницијативи.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.7
    ref_id: A.5.7
    name: Threat intelligence
    category: process
    description: This control ensures threat intelligence is developed and maintained to identify and
      mitigate security risks. Measures include monitoring threat feeds, analyzing trends, and sharing
      actionable insights.
    translations:
      mk:
        name: Разузнавање за закани
        description: Оваа контрола обезбедува развивање и одржување разузнавање за закани за да се идентификуваат
          и ублажат безбедносните ризици. Мерките вклучуваат следење на извори на закани, анализа на трендови
          и споделување применливи сознанија.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.8
    ref_id: A.5.8
    name: Information security in project management
    category: process
    description: This control incorporates information security into project management practices. Measures
      include risk assessments, compliance reviews, and security checkpoints during project lifecycles.
    translations:
      mk:
        name: Безбедност на информациите во управувањето со проекти
        description: Оваа контрола ја вклучува безбедноста на информациите во практиките за управување
          со проекти. Мерките вклучуваат проценки на ризик, прегледи на усогласеноста и безбедносни контролни
          точки во текот на животниот циклус на проектите.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.9
    ref_id: A.5.9
    name: Inventory of information and other associated assets
    category: process
    description: This control ensures an accurate inventory of information and associated assets is maintained.
      Measures include asset tracking, periodic audits, and classification by sensitivity.
    translations:
      mk:
        name: Попис на информации и други поврзани средства
        description: Оваа контрола обезбедува одржување точен попис на информациите и поврзаните средства.
          Мерките вклучуваат следење на средствата, периодични ревизии и класификација според чувствителноста.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.10
    ref_id: A.5.10
    name: Acceptable use of information and other associated assets
    category: process
    description: This control defines acceptable use of information and associated assets to ensure proper
      handling. Measures include documented policies, user training, and enforcement mechanisms.
    translations:
      mk:
        name: Прифатлива употреба на информации и други поврзани средства
        description: Оваа контрола ја дефинира прифатливата употреба на информациите и поврзаните средства
          за да се обезбеди соодветно ракување. Мерките вклучуваат документирани политики, обука на корисниците
          и механизми за спроведување.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.11
    ref_id: A.5.11
    name: Return of assets
    category: process
    description: This control ensures the secure return of assets when employees or contractors leave
      or change roles. Measures include checklists, asset tracking, and decommissioning protocols.
    translations:
      mk:
        name: Враќање на средствата
        description: Оваа контрола обезбедува безбедно враќање на средствата кога вработените или изведувачите
          заминуваат или ја менуваат улогата. Мерките вклучуваат контролни листи, следење на средствата
          и протоколи за повлекување од употреба.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.12
    ref_id: A.5.12
    name: Classification of information
    category: process
    description: This control ensures information is classified based on its sensitivity and value to
      ensure appropriate protection. Measures include classification schemes, access restrictions, and
      labeling guidelines.
    translations:
      mk:
        name: Класификација на информациите
        description: Оваа контрола обезбедува класификација на информациите според нивната чувствителност
          и вредност за да се обезбеди соодветна заштита. Мерките вклучуваат шеми за класификација, ограничувања
          на пристапот и упатства за означување.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.13
    ref_id: A.5.13
    name: Labelling of information
    category: process
    description: This control ensures consistent labeling of information to reflect its classification
      and handling requirements. Measures include standardized templates, training, and audits.
    translations:
      mk:
        name: Означување на информациите
        description: Оваа контрола обезбедува доследно означување на информациите во согласност со нивната
          класификација и барањата за ракување. Мерките вклучуваат стандардизирани обрасци, обука и ревизии.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.14
    ref_id: A.5.14
    name: Information transfer
    category: process
    description: This control establishes secure processes for transferring information between systems
      or organizations. Measures include encryption, access controls, and secure transfer protocols.
    translations:
      mk:
        name: Пренос на информации
        description: Оваа контрола воспоставува безбедни процеси за пренос на информации меѓу системи
          или организации. Мерките вклучуваат шифрирање, контроли на пристапот и безбедни протоколи за
          пренос.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.15
    ref_id: A.5.15
    name: Access control
    category: process
    description: This control implements and maintains access control mechanisms to restrict access to
      authorized individuals. Measures include role-based access, multi-factor authentication, and periodic
      reviews.
    translations:
      mk:
        name: Контрола на пристапот
        description: Оваа контрола имплементира и одржува механизми за контрола на пристапот за пристапот
          да биде ограничен на овластени лица. Мерките вклучуваат пристап заснован на улоги, повеќефакторска
          автентикација и периодични прегледи.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.16
    ref_id: A.5.16
    name: Identity management
    category: process
    description: This control ensures identities are managed securely to guarantee accurate and reliable
      access to systems. Measures include identity verification, lifecycle management, and access provisioning.
    translations:
      mk:
        name: Управување со идентитети
        description: Оваа контрола обезбедува безбедно управување со идентитетите за да се гарантира точен
          и сигурен пристап до системите. Мерките вклучуваат верификација на идентитетот, управување со
          животниот циклус и доделување пристап.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.17
    ref_id: A.5.17
    name: Authentication information
    category: process
    description: This control protects authentication information, such as passwords, to prevent unauthorized
      access. Measures include encryption, secure storage, and periodic password updates.
    translations:
      mk:
        name: Информации за автентикација
        description: Оваа контрола ги штити информациите за автентикација, како што се лозинките, за да
          се спречи неовластен пристап. Мерките вклучуваат шифрирање, безбедно чување и периодично менување
          на лозинките.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.18
    ref_id: A.5.18
    name: Access rights
    category: process
    description: This control ensures access rights are regularly reviewed and managed to align with roles
      and responsibilities. Measures include periodic audits, access revocation, and automated access
      management.
    translations:
      mk:
        name: Права на пристап
        description: Оваа контрола обезбедува правата на пристап редовно да се преиспитуваат и да се управуваат
          во согласност со улогите и одговорностите. Мерките вклучуваат периодични ревизии, одземање на
          пристапот и автоматизирано управување со пристапот.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.19
    ref_id: A.5.19
    name: Information security in supplier relationships
    category: process
    description: This control ensures information security is embedded in supplier relationships and processes.
      Measures include due diligence, security reviews, and ongoing monitoring.
    translations:
      mk:
        name: Безбедност на информациите во односите со добавувачите
        description: Оваа контрола обезбедува безбедноста на информациите да биде вградена во односите
          и процесите со добавувачите. Мерките вклучуваат длабинска анализа, безбедносни прегледи и тековно
          следење.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.20
    ref_id: A.5.20
    name: Addressing information security within supplier agreements
    category: process
    description: This control addresses information security requirements within supplier agreements.
      Measures include explicit contract clauses, compliance audits, and defined penalties for violations.
    translations:
      mk:
        name: Опфаќање на безбедноста на информациите во договорите со добавувачите
        description: Оваа контрола ги опфаќа барањата за безбедност на информациите во договорите со добавувачите.
          Мерките вклучуваат изречни договорни одредби, ревизии на усогласеноста и дефинирани казни за
          прекршувања.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.21
    ref_id: A.5.21
    name: Managing information security in the ICT supply chain
    category: process
    description: This control manages information security risks in the ICT supply chain to ensure security
      of services and components. Measures include risk assessments, supplier evaluations, and incident
      response protocols.
    translations:
      mk:
        name: Управување со безбедноста на информациите во ИКТ синџирот на снабдување
        description: Оваа контрола управува со ризиците за безбедноста на информациите во ИКТ синџирот
          на снабдување за да се обезбеди безбедност на услугите и компонентите. Мерките вклучуваат проценки
          на ризик, евалуации на добавувачите и протоколи за одговор на инциденти.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.22
    ref_id: A.5.22
    name: Monitoring, review and change management of supplier services
    category: process
    description: This control ensures supplier services are monitored, reviewed, and adjusted to maintain
      information security. Measures include service level agreements, periodic reviews, and contract
      updates.
    translations:
      mk:
        name: Следење, преиспитување и управување со промени на услугите на добавувачите
        description: Оваа контрола обезбедува услугите на добавувачите да се следат, преиспитуваат и прилагодуваат
          за да се одржи безбедноста на информациите. Мерките вклучуваат договори за ниво на услуга, периодични
          прегледи и ажурирања на договорите.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.23
    ref_id: A.5.23
    name: Information security for use of cloud services
    category: process
    description: This control ensures the secure use of cloud services by addressing associated risks.
      Measures include data encryption, access controls, and provider compliance reviews.
    translations:
      mk:
        name: Безбедност на информациите при користење услуги во облак
        description: Оваа контрола обезбедува безбедно користење на услугите во облак преку справување
          со поврзаните ризици. Мерките вклучуваат шифрирање на податоците, контроли на пристапот и прегледи
          на усогласеноста на давателот.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.24
    ref_id: A.5.24
    name: Information security incident management planning and preparation
    category: process
    description: This control ensures proper planning and preparation for managing information security
      incidents. Measures include incident response plans, training exercises, and communication protocols.
    translations:
      mk:
        name: Планирање и подготовка за управување со инциденти со безбедноста на информациите
        description: Оваа контрола обезбедува соодветно планирање и подготовка за управување со инциденти
          со безбедноста на информациите. Мерките вклучуваат планови за одговор на инциденти, вежби и
          протоколи за комуникација.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.25
    ref_id: A.5.25
    name: Assessment and decision on information security events
    category: process
    description: This control establishes processes for assessing and deciding on actions related to information
      security events. Measures include root cause analysis, risk evaluation, and mitigation plans.
    translations:
      mk:
        name: Проценка и одлучување за настани поврзани со безбедноста на информациите
        description: Оваа контрола воспоставува процеси за проценка и одлучување за дејствата поврзани
          со настани од областа на безбедноста на информациите. Мерките вклучуваат анализа на основната
          причина, евалуација на ризикот и планови за ублажување.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.26
    ref_id: A.5.26
    name: Response to information security incidents
    category: process
    description: This control ensures effective response to information security incidents to minimize
      impact and recover quickly. Measures include incident reporting, escalation protocols, and containment
      strategies.
    translations:
      mk:
        name: Одговор на инциденти со безбедноста на информациите
        description: Оваа контрола обезбедува ефективен одговор на инцидентите со безбедноста на информациите
          за да се минимизира влијанието и да се овозможи брзо закрепнување. Мерките вклучуваат пријавување
          инциденти, протоколи за ескалација и стратегии за ограничување.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.27
    ref_id: A.5.27
    name: Learning from information security incidents
    category: process
    description: This control ensures lessons learned from information security incidents are documented
      and implemented to improve processes. Measures include post-incident reviews, action plans, and
      policy updates.
    translations:
      mk:
        name: Учење од инцидентите со безбедноста на информациите
        description: Оваа контрола обезбедува научените лекции од инцидентите со безбедноста на информациите
          да бидат документирани и применети за подобрување на процесите. Мерките вклучуваат прегледи
          по инцидентите, акциски планови и ажурирање на политиките.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.28
    ref_id: A.5.28
    name: Collection of evidence
    category: process
    description: This control ensures evidence is collected and preserved during security incidents to
      support investigations. Measures include chain-of-custody procedures, secure storage, and access
      controls.
    translations:
      mk:
        name: Собирање докази
        description: Оваа контрола обезбедува собирање и зачувување докази при безбедносни инциденти за
          поддршка на истрагите. Мерките вклучуваат процедури за синџир на чување, безбедно складирање
          и контроли на пристапот.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.29
    ref_id: A.5.29
    name: Information security during disruption
    category: process
    description: This control ensures information security is maintained during disruptions to guarantee
      continuity of operations. Measures include contingency plans, backup systems, and failover mechanisms.
    translations:
      mk:
        name: Безбедност на информациите при нарушување
        description: Оваа контрола обезбедува одржување на безбедноста на информациите при нарушувања
          за да се гарантира континуитет на работењето. Мерките вклучуваат планови за непредвидени ситуации,
          резервни системи и механизми за преземање (failover).
  - urn: urn:intuitem:risk:function:doc-pol:a.5.30
    ref_id: A.5.30
    name: ICT readiness for business continuity
    category: process
    description: This control ensures ICT readiness for business continuity to minimize downtime during
      disruptions. Measures include testing recovery plans, redundant systems, and disaster recovery sites.
    translations:
      mk:
        name: Подготвеност на ИКТ за континуитет на работењето
        description: Оваа контрола обезбедува подготвеност на ИКТ за континуитет на работењето за да се
          минимизира застојот при нарушувања. Мерките вклучуваат тестирање на плановите за обнова, редундантни
          системи и локации за обнова по катастрофа.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.31
    ref_id: A.5.31
    name: Legal, statutory, regulatory and contractual requirements
    category: process
    description: This control ensures compliance with legal, statutory, regulatory, and contractual information
      security requirements. Measures include policy reviews, audits, and evidence documentation.
    translations:
      mk:
        name: Законски, регулаторни и договорни барања
        description: Оваа контрола обезбедува усогласеност со законските, регулаторните и договорните
          барања за безбедност на информациите. Мерките вклучуваат прегледи на политиките, ревизии и документирање
          на доказите.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.32
    ref_id: A.5.32
    name: Intellectual property rights
    category: process
    description: This control ensures intellectual property rights are protected through appropriate information
      security measures. Measures include access restrictions, encryption, and legal agreements.
    translations:
      mk:
        name: Права на интелектуална сопственост
        description: Оваа контрола обезбедува правата на интелектуална сопственост да бидат заштитени
          со соодветни мерки за безбедност на информациите. Мерките вклучуваат ограничувања на пристапот,
          шифрирање и правни договори.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.33
    ref_id: A.5.33
    name: Protection of records
    category: process
    description: This control ensures records are securely stored and protected to prevent loss or unauthorized
      access. Measures include retention policies, secure storage, and access controls.
    translations:
      mk:
        name: Заштита на записите
        description: Оваа контрола обезбедува записите безбедно да се чуваат и штитат за да се спречи
          губење или неовластен пристап. Мерките вклучуваат политики за чување, безбедно складирање и
          контроли на пристапот.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.34
    ref_id: A.5.34
    name: Privacy and protection of PII
    category: process
    description: This control protects privacy and ensures the secure handling of personally identifiable
      information (PII). Measures include anonymization, encryption, and compliance with privacy laws.
    translations:
      mk:
        name: Приватност и заштита на лични податоци
        description: Оваа контрола ја штити приватноста и обезбедува безбедно ракување со личните податоци.
          Мерките вклучуваат анонимизација, шифрирање и усогласеност со прописите за заштита на личните
          податоци.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.35
    ref_id: A.5.35
    name: Independent review of information security
    category: process
    description: This control ensures independent reviews of information security to evaluate effectiveness
      and compliance. Measures include external audits, risk assessments, and follow-up actions.
    translations:
      mk:
        name: Независно преиспитување на безбедноста на информациите
        description: Оваа контрола обезбедува независни преиспитувања на безбедноста на информациите за
          да се оцени ефективноста и усогласеноста. Мерките вклучуваат надворешни ревизии, проценки на
          ризик и последователни дејства.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.36
    ref_id: A.5.36
    name: Compliance with policies, rules and standards for information security
    category: process
    description: This control ensures compliance with all policies, rules, and standards for information
      security. Measures include regular training, policy reviews, and enforcement mechanisms.
    translations:
      mk:
        name: Усогласеност со политиките, правилата и стандардите за безбедност на информациите
        description: Оваа контрола обезбедува усогласеност со сите политики, правила и стандарди за безбедност
          на информациите. Мерките вклучуваат редовна обука, прегледи на политиките и механизми за спроведување.
  - urn: urn:intuitem:risk:function:doc-pol:a.5.37
    ref_id: A.5.37
    name: Documented operating procedures
    category: process
    description: This control develops and maintains documented operating procedures to ensure consistency
      in security practices. Measures include process documentation, version control, and accessibility.
    translations:
      mk:
        name: Документирани оперативни процедури
        description: Оваа контрола развива и одржува документирани оперативни процедури за да се обезбеди
          доследност во безбедносните практики. Мерките вклучуваат документирање на процесите, контрола
          на верзии и достапност.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.1
    ref_id: A.6.1
    name: Screening
    category: process
    description: This control ensures the implementation of screening processes to verify the suitability
      of candidates before employment. Measures include background checks, identity verification, and
      assessment of qualifications to reduce security risks.
    translations:
      mk:
        name: Проверка на кандидатите
        description: Оваа контрола обезбедува спроведување процеси за проверка на подобноста на кандидатите
          пред вработување. Мерките вклучуваат безбедносни проверки, верификација на идентитетот и проценка
          на квалификациите за да се намалат безбедносните ризици.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.2
    ref_id: A.6.2
    name: Terms and conditions of employment
    category: process
    description: This control ensures that terms and conditions of employment include information security
      responsibilities. Measures include explicit clauses about confidentiality, compliance with policies,
      and consequences for breaches.
    translations:
      mk:
        name: Услови за вработување
        description: Оваа контрола обезбедува условите за вработување да ги вклучуваат одговорностите
          за безбедност на информациите. Мерките вклучуваат изречни одредби за доверливост, усогласеност
          со политиките и последици за прекршувања.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.3
    ref_id: A.6.3
    name: Information security awareness, education and training
    category: process
    description: This control ensures that employees receive regular information security awareness, education,
      and training. Measures include scheduled training sessions, e-learning programs, and simulated phishing
      exercises.
    translations:
      mk:
        name: Подигнување на свеста, едукација и обука за безбедност на информациите
        description: Оваа контрола обезбедува вработените редовно да добиваат подигнување на свеста, едукација
          и обука за безбедност на информациите. Мерките вклучуваат закажани обуки, програми за е-учење
          и симулирани фишинг вежби.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.4
    ref_id: A.6.4
    name: Disciplinary process
    category: process
    description: This control establishes a disciplinary process to address breaches of information security
      policies. Measures include clear guidelines, escalation procedures, and consistent enforcement to
      maintain accountability.
    translations:
      mk:
        name: Дисциплинска постапка
        description: Оваа контрола воспоставува дисциплинска постапка за прекршувања на политиките за
          безбедност на информациите. Мерките вклучуваат јасни упатства, постапки за ескалација и доследно
          спроведување за одржување на отчетноста.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.5
    ref_id: A.6.5
    name: Responsibilities after termination or change of employment
    category: process
    description: This control ensures that responsibilities related to information security are defined
      and enforced after termination or role changes. Measures include revoking access rights, collecting
      organizational assets, and conducting exit interviews.
    translations:
      mk:
        name: Одговорности по престанок или промена на вработувањето
        description: Оваа контрола обезбедува одговорностите поврзани со безбедноста на информациите да
          бидат дефинирани и спроведени по престанок на вработувањето или промена на улогата. Мерките
          вклучуваат одземање на правата на пристап, враќање на средствата на организацијата и излезни
          интервјуа.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.6
    ref_id: A.6.6
    name: Confidentiality or non-disclosure agreements
    category: process
    description: This control implements confidentiality or non-disclosure agreements to protect sensitive
      information. Measures include signed agreements at the start of employment, periodic reminders,
      and enforcement of legal actions in case of violations.
    translations:
      mk:
        name: Договори за доверливост или неоткривање
        description: Оваа контрола имплементира договори за доверливост или неоткривање за заштита на
          чувствителните информации. Мерките вклучуваат потпишани договори на почетокот на вработувањето,
          периодични потсетувања и правни мерки во случај на прекршување.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.7
    ref_id: A.6.7
    name: Remote working
    category: process
    description: This control ensures the secure management of information security risks during remote
      working. Measures include secure access to corporate systems, mandatory use of VPNs, and policies
      for handling sensitive data remotely.
    translations:
      mk:
        name: Работа од далечина
        description: Оваа контрола обезбедува безбедно управување со ризиците за безбедноста на информациите
          при работа од далечина. Мерките вклучуваат безбеден пристап до корпоративните системи, задолжителна
          употреба на VPN и политики за ракување со чувствителни податоци од далечина.
  - urn: urn:intuitem:risk:function:doc-pol:a.6.8
    ref_id: A.6.8
    name: Information security event reporting
    category: process
    description: This control ensures employees can promptly report information security events. Measures
      include incident reporting channels, awareness campaigns, and follow-up procedures to investigate
      and address reported events.
    translations:
      mk:
        name: Пријавување настани поврзани со безбедноста на информациите
        description: Оваа контрола обезбедува вработените навремено да можат да пријават настани поврзани
          со безбедноста на информациите. Мерките вклучуваат канали за пријавување инциденти, кампањи
          за подигнување на свеста и постапки за истражување и решавање на пријавените настани.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.1
    ref_id: A.7.1
    name: Physical security perimeters
    category: physical
    description: This control establishes physical security perimeters to protect critical areas from
      unauthorized access. Measures include barriers, access controls, and monitoring systems to ensure
      only authorized individuals can enter.
    translations:
      mk:
        name: Физички безбедносни периметри
        description: Оваа контрола воспоставува физички безбедносни периметри за заштита на критичните
          простори од неовластен пристап. Мерките вклучуваат бариери, контроли на пристапот и системи
          за надзор, за да влегуваат само овластени лица.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.2
    ref_id: A.7.2
    name: Physical entry
    category: physical
    description: This control ensures physical entry points are controlled and monitored to prevent unauthorized
      access. Measures include badge systems, security personnel, and visitor logs.
    translations:
      mk:
        name: Физички влез
        description: Оваа контрола обезбедува физичките влезни точки да се контролираат и надгледуваат
          за да се спречи неовластен пристап. Мерките вклучуваат системи со картички, обезбедување и евиденција
          на посетители.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.3
    ref_id: A.7.3
    name: Securing offices, rooms and facilities
    category: physical
    description: This control ensures that offices, rooms, and facilities are secured to protect information
      and resources. Measures include locked doors, restricted areas, and surveillance systems.
    translations:
      mk:
        name: Обезбедување на канцелариите, просториите и објектите
        description: Оваа контрола обезбедува канцелариите, просториите и објектите да бидат обезбедени
          за заштита на информациите и ресурсите. Мерките вклучуваат заклучени врати, ограничени зони
          и системи за надзор.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.4
    ref_id: A.7.4
    name: Physical security monitoring
    category: physical
    description: This control implements physical security monitoring to detect and respond promptly to
      threats. Measures include CCTV systems, motion detectors, and real-time alerts.
    translations:
      mk:
        name: Физички безбедносен надзор
        description: Оваа контрола имплементира физички безбедносен надзор за навремено откривање и реагирање
          на закани. Мерките вклучуваат видеонадзор, сензори за движење и известувања во реално време.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.5
    ref_id: A.7.5
    name: Protecting against physical and environmental threats
    category: physical
    description: This control protects systems and resources from physical and environmental threats.
      Measures include fire suppression systems, temperature controls, and flood prevention barriers.
    translations:
      mk:
        name: Заштита од физички закани и закани од околината
        description: Оваа контрола ги штити системите и ресурсите од физички закани и закани од околината.
          Мерките вклучуваат системи за гаснење пожар, контрола на температурата и бариери против поплави.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.6
    ref_id: A.7.6
    name: Working In secure areas
    category: physical
    description: This control ensures that secure areas are managed to allow authorized access only. Measures
      include access control systems, visitor escorts, and activity monitoring.
    translations:
      mk:
        name: Работа во безбедни простори
        description: Оваа контрола обезбедува безбедните простори да се управуваат така што е дозволен
          само овластен пристап. Мерките вклучуваат системи за контрола на пристапот, придружба на посетителите
          и следење на активностите.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.7
    ref_id: A.7.7
    name: Clear desk and clear screen
    category: physical
    description: This control ensures sensitive information is not left exposed by adopting clear desk
      and clear screen policies. Measures include locking sensitive documents away and auto-locking screens
      when not in use.
    translations:
      mk:
        name: Чисто биро и чист екран
        description: Оваа контрола обезбедува чувствителните информации да не останат изложени преку политики
          за чисто биро и чист екран. Мерките вклучуваат заклучување на чувствителните документи и автоматско
          заклучување на екраните кога не се користат.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.8
    ref_id: A.7.8
    name: Equipment siting and protection
    category: physical
    description: This control ensures that equipment is positioned and protected to prevent unauthorized
      access or damage. Measures include secure mounting, locked cabinets, and restricted access areas.
    translations:
      mk:
        name: Поставување и заштита на опремата
        description: Оваа контрола обезбедува опремата да биде поставена и заштитена за да се спречи неовластен
          пристап или оштетување. Мерките вклучуваат безбедно монтирање, заклучени ормари и зони со ограничен
          пристап.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.9
    ref_id: A.7.9
    name: Security of assets off-premises
    category: physical
    description: This control ensures assets used or stored off-premises are secured to maintain confidentiality
      and integrity. Measures include encryption, secure transport, and access tracking.
    translations:
      mk:
        name: Безбедност на средствата надвор од просториите
        description: Оваа контрола обезбедува средствата што се користат или чуваат надвор од просториите
          на организацијата да бидат заштитени за да се одржат доверливоста и интегритетот. Мерките вклучуваат
          шифрирање, безбеден транспорт и следење на пристапот.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.10
    ref_id: A.7.10
    name: Storage media
    category: physical
    description: This control safeguards storage media to prevent unauthorized access or tampering. Measures
      include secure storage, encryption, and access restrictions.
    translations:
      mk:
        name: Медиуми за складирање
        description: Оваа контрола ги штити медиумите за складирање за да се спречи неовластен пристап
          или манипулација. Мерките вклучуваат безбедно чување, шифрирање и ограничувања на пристапот.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.11
    ref_id: A.7.11
    name: Supporting utilities
    category: physical
    description: This control ensures that supporting utilities, such as power and cooling systems, are
      reliable and protected from disruptions. Measures include redundant systems and physical security.
    translations:
      mk:
        name: Помошни комунални услуги
        description: Оваа контрола обезбедува помошните комунални услуги, како напојувањето и ладењето,
          да бидат сигурни и заштитени од прекини. Мерките вклучуваат редундантни системи и физичка безбедност.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.12
    ref_id: A.7.12
    name: Cabling security
    category: physical
    description: This control ensures that cables are secured to prevent unauthorized interception or
      damage. Measures include protective conduits, proper labeling, and secure routing.
    translations:
      mk:
        name: Безбедност на каблите
        description: Оваа контрола обезбедува каблите да бидат заштитени за да се спречи неовластено пресретнување
          или оштетување. Мерките вклучуваат заштитни канали, соодветно означување и безбедно трасирање.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.13
    ref_id: A.7.13
    name: Equipment maintenance
    category: physical
    description: This control ensures that equipment is maintained to guarantee proper functioning and
      prevent failures. Measures include regular servicing, secure maintenance practices, and authorized
      personnel access.
    translations:
      mk:
        name: Одржување на опремата
        description: Оваа контрола обезбедува одржување на опремата за да се гарантира правилно функционирање
          и да се спречат дефекти. Мерките вклучуваат редовен сервис, безбедни практики за одржување и
          пристап само за овластен персонал.
  - urn: urn:intuitem:risk:function:doc-pol:a.7.14
    ref_id: A.7.14
    name: Secure disposal or re-use of equipment
    category: physical
    description: This control ensures the secure disposal or reuse of equipment to protect sensitive information.
      Measures include data sanitization, physical destruction, and certified disposal processes.
    translations:
      mk:
        name: Безбедно отстранување или повторна употреба на опремата
        description: Оваа контрола обезбедува безбедно отстранување или повторна употреба на опремата
          за заштита на чувствителните информации. Мерките вклучуваат бришење на податоците, физичко уништување
          и сертифицирани процеси за отстранување.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.1
    ref_id: A.8.1
    name: User end point devices
    category: technical
    description: This control ensures the protection of endpoint devices such as laptops, desktops, and
      mobile devices by implementing security measures like endpoint detection, encryption, and secure
      configurations to minimize risks.
    translations:
      mk:
        name: Кориснички крајни уреди
        description: Оваа контрола обезбедува заштита на крајните уреди, како што се лаптопи, десктоп
          компјутери и мобилни уреди, со безбедносни мерки како откривање на крајни точки, шифрирање и
          безбедни конфигурации за минимизирање на ризиците.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.2
    ref_id: A.8.2
    name: Privileged access rights
    category: technical
    description: This control ensures that privileged access rights are granted, managed, and monitored
      carefully to prevent misuse and enhance security. Measures include role-based access controls, periodic
      reviews, and strict account management.
    translations:
      mk:
        name: Привилегирани права на пристап
        description: Оваа контрола обезбедува привилегираните права на пристап внимателно да се доделуваат,
          управуваат и следат за да се спречи злоупотреба и да се зајакне безбедноста. Мерките вклучуваат
          контроли на пристап засновани на улоги, периодични прегледи и строго управување со сметките.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.3
    ref_id: A.8.3
    name: Information access restriction
    category: technical
    description: This control restricts access to sensitive information based on need-to-know principles.
      Measures include user authentication, role-based permissions, and regular access reviews.
    translations:
      mk:
        name: Ограничување на пристапот до информациите
        description: Оваа контрола го ограничува пристапот до чувствителните информации според принципот
          „потребно да знае“. Мерките вклучуваат автентикација на корисниците, дозволи засновани на улоги
          и редовни прегледи на пристапот.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.4
    ref_id: A.8.4
    name: Access to source code
    category: technical
    description: This control secures access to source code by preventing unauthorized viewing, modification,
      or exposure. Measures include version control, secure repositories, and restricted developer access.
    translations:
      mk:
        name: Пристап до изворниот код
        description: Оваа контрола го обезбедува пристапот до изворниот код преку спречување неовластено
          прегледување, менување или откривање. Мерките вклучуваат контрола на верзии, безбедни репозиториуми
          и ограничен пристап за развивачите.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.5
    ref_id: A.8.5
    name: Secure authentication
    category: technical
    description: This control implements strong authentication mechanisms, such as multi-factor authentication,
      to verify user identities and prevent unauthorized access.
    translations:
      mk:
        name: Безбедна автентикација
        description: Оваа контрола имплементира силни механизми за автентикација, како повеќефакторска
          автентикација, за верификација на идентитетот на корисниците и спречување неовластен пристап.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.6
    ref_id: A.8.6
    name: Capacity management
    category: technical
    description: This control ensures system capacity is managed to provide adequate performance and prevent
      disruptions. Measures include monitoring resource usage and planning for future needs.
    translations:
      mk:
        name: Управување со капацитетот
        description: Оваа контрола обезбедува управување со капацитетот на системите за соодветни перформанси
          и спречување прекини. Мерките вклучуваат следење на искористеноста на ресурсите и планирање
          за идните потреби.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.7
    ref_id: A.8.7
    name: Protection against malware
    category: technical
    description: This control deploys measures like antivirus software, threat detection tools, and regular
      updates to protect systems from malware and malicious attacks.
    translations:
      mk:
        name: Заштита од злонамерен софтвер
        description: Оваа контрола применува мерки како антивирусен софтвер, алатки за откривање закани
          и редовни ажурирања за заштита на системите од злонамерен софтвер и напади.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.8
    ref_id: A.8.8
    name: Management of technical vulnerabilities
    category: technical
    description: This control identifies, evaluates, and remediates technical vulnerabilities promptly
      to minimize security risks. Measures include vulnerability scanning and patch management.
    translations:
      mk:
        name: Управување со технички ранливости
        description: Оваа контрола навремено ги идентификува, оценува и отстранува техничките ранливости
          за да се минимизираат безбедносните ризици. Мерките вклучуваат скенирање на ранливости и управување
          со закрпи.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.9
    ref_id: A.8.9
    name: Configuration management
    category: technical
    description: This control ensures consistent management of system configurations to maintain security
      settings and prevent unauthorized changes.
    translations:
      mk:
        name: Управување со конфигурации
        description: Оваа контрола обезбедува доследно управување со конфигурациите на системите за одржување
          на безбедносните поставки и спречување неовластени промени.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.10
    ref_id: A.8.10
    name: Information deletion
    category: technical
    description: This control ensures sensitive information is securely deleted when no longer required
      to prevent unauthorized recovery or exposure.
    translations:
      mk:
        name: Бришење на информации
        description: Оваа контрола обезбедува чувствителните информации безбедно да се бришат кога повеќе
          не се потребни, за да се спречи неовластено враќање или откривање.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.11
    ref_id: A.8.11
    name: Data masking
    category: technical
    description: This control protects sensitive information during processing or display by using data
      masking techniques to obscure data from unauthorized users.
    translations:
      mk:
        name: Маскирање на податоци
        description: Оваа контрола ги штити чувствителните информации при обработка или прикажување со
          техники за маскирање на податоците, со кои податоците се прикриваат од неовластени корисници.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.12
    ref_id: A.8.12
    name: Data leakage prevention
    category: technical
    description: This control implements mechanisms to prevent the accidental exposure of sensitive data
      through email, removable media, or other channels.
    translations:
      mk:
        name: Спречување на истекување на податоци
        description: Оваа контрола имплементира механизми за спречување на ненамерно откривање на чувствителни
          податоци преку е-пошта, преносливи медиуми или други канали.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.13
    ref_id: A.8.13
    name: Information backup
    category: technical
    description: This control ensures critical information is backed up regularly and securely to ensure
      its availability in case of incidents or disasters.
    translations:
      mk:
        name: Резервни копии на информациите
        description: Оваа контрола обезбедува редовно и безбедно правење резервни копии од критичните
          информации за да бидат достапни во случај на инциденти или катастрофи.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.14
    ref_id: A.8.14
    name: Redundancy of information processing facilities
    category: technical
    description: This control ensures redundancy is built into processing facilities to maintain availability
      and operations during system failures or emergencies.
    translations:
      mk:
        name: Редундантност на средствата за обработка на информации
        description: Оваа контрола обезбедува вградена редундантност во средствата за обработка за да
          се одржат достапноста и работењето при откази на системите или вонредни ситуации.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.15
    ref_id: A.8.15
    name: Logging
    category: technical
    description: This control enables logging of activities within systems to support monitoring, incident
      detection, and forensic investigations.
    translations:
      mk:
        name: Евидентирање (логирање)
        description: Оваа контрола овозможува евидентирање на активностите во системите за поддршка на
          следењето, откривањето инциденти и форензичките истраги.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.16
    ref_id: A.8.16
    name: Monitoring activities
    category: technical
    description: This control ensures the ongoing monitoring of system activities to detect, respond to,
      and mitigate security threats.
    translations:
      mk:
        name: Следење на активностите
        description: Оваа контрола обезбедува тековно следење на активностите во системите за откривање,
          реагирање и ублажување на безбедносните закани.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.17
    ref_id: A.8.17
    name: Clock synchronization
    category: technical
    description: This control ensures system clocks are synchronized to maintain accurate and consistent
      timestamps for logs and other critical processes.
    translations:
      mk:
        name: Синхронизација на часовниците
        description: Оваа контрола обезбедува синхронизација на системските часовници за точни и доследни
          временски печати во логовите и другите критични процеси.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.18
    ref_id: A.8.18
    name: Use of privileged utility programs
    category: technical
    description: This control restricts and monitors the use of privileged utility programs to prevent
      misuse and unauthorized actions.
    translations:
      mk:
        name: Користење привилегирани помошни програми
        description: Оваа контрола ја ограничува и следи употребата на привилегирани помошни програми
          за да се спречат злоупотреба и неовластени дејства.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.19
    ref_id: A.8.19
    name: Installation of software on operational systems
    category: technical
    description: This control ensures software installation on operational systems is managed securely
      to prevent vulnerabilities or unauthorized changes.
    translations:
      mk:
        name: Инсталирање софтвер на оперативните системи
        description: Оваа контрола обезбедува инсталирањето софтвер на оперативните (продукциски) системи
          да се управува безбедно за да се спречат ранливости или неовластени промени.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.20
    ref_id: A.8.20
    name: Networks security
    category: technical
    description: This control ensures network security through firewalls, intrusion detection systems,
      and access controls to protect against unauthorized access and attacks.
    translations:
      mk:
        name: Безбедност на мрежите
        description: Оваа контрола ја обезбедува безбедноста на мрежата преку заштитни ѕидови, системи
          за откривање упади и контроли на пристапот за заштита од неовластен пристап и напади.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.21
    ref_id: A.8.21
    name: Security of network services
    category: technical
    description: This control ensures network services are protected to maintain confidentiality, integrity,
      and availability during use.
    translations:
      mk:
        name: Безбедност на мрежните услуги
        description: Оваа контрола обезбедува мрежните услуги да бидат заштитени за да се одржат доверливоста,
          интегритетот и достапноста при нивното користење.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.22
    ref_id: A.8.22
    name: Segregation of networks
    category: technical
    description: This control implements network segregation to limit the spread of threats and minimize
      the impact of potential breaches.
    translations:
      mk:
        name: Сегрегација на мрежите
        description: Оваа контрола имплементира сегрегација на мрежите за да се ограничи ширењето на заканите
          и да се минимизира влијанието на можните пробиви.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.23
    ref_id: A.8.23
    name: Web filtering
    category: technical
    description: This control uses web filtering tools to block unauthorized or harmful content from being
      accessed over the internet.
    translations:
      mk:
        name: Филтрирање на веб-содржини
        description: Оваа контрола користи алатки за филтрирање на веб-содржини за блокирање на пристапот
          до неовластени или штетни содржини на интернет.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.24
    ref_id: A.8.24
    name: Use of cryptography
    category: technical
    description: This control ensures cryptographic techniques are applied to protect data confidentiality,
      integrity, and authenticity.
    translations:
      mk:
        name: Користење криптографија
        description: Оваа контрола обезбедува примена на криптографски техники за заштита на доверливоста,
          интегритетот и автентичноста на податоците.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.25
    ref_id: A.8.25
    name: Secure development life cycle
    category: technical
    description: This control integrates security into all stages of the development life cycle to ensure
      systems and applications are built securely.
    translations:
      mk:
        name: Безбеден животен циклус на развој
        description: Оваа контрола ја вградува безбедноста во сите фази на животниот циклус на развојот
          за системите и апликациите да бидат безбедно изградени.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.26
    ref_id: A.8.26
    name: Application security requirements
    category: technical
    description: This control defines and enforces security requirements for applications to safeguard
      against vulnerabilities.
    translations:
      mk:
        name: Безбедносни барања за апликациите
        description: Оваа контрола ги дефинира и спроведува безбедносните барања за апликациите за заштита
          од ранливости.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.27
    ref_id: A.8.27
    name: Secure system architecture and engineering principles
    category: technical
    description: This control ensures secure design principles are adopted during the development of system
      architectures.
    translations:
      mk:
        name: Принципи за безбедна архитектура и инженеринг на системи
        description: Оваа контрола обезбедува примена на принципи за безбеден дизајн при развојот на системските
          архитектури.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.28
    ref_id: A.8.28
    name: Secure coding
    category: technical
    description: This control implements secure coding practices to minimize vulnerabilities in developed
      software.
    translations:
      mk:
        name: Безбедно кодирање
        description: Оваа контрола имплементира практики за безбедно кодирање за минимизирање на ранливостите
          во развиениот софтвер.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.29
    ref_id: A.8.29
    name: Security testing in development and acceptance
    category: technical
    description: This control ensures security testing is conducted during development and acceptance
      phases to identify weaknesses.
    translations:
      mk:
        name: Безбедносно тестирање при развој и прифаќање
        description: Оваа контрола обезбедува спроведување безбедносно тестирање во фазите на развој и
          прифаќање за откривање на слабостите.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.30
    ref_id: A.8.30
    name: Outsourced development
    category: technical
    description: This control ensures security risks are managed effectively when development is outsourced
      to third-party vendors.
    translations:
      mk:
        name: Надворешен (ангажиран) развој
        description: Оваа контрола обезбедува ефективно управување со безбедносните ризици кога развојот
          е доверен на трети страни.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.31
    ref_id: A.8.31
    name: Separation of development, test and production environments
    category: technical
    description: This control ensures development, test, and production environments are segregated to
      prevent unintended interactions and unauthorized access.
    translations:
      mk:
        name: Раздвојување на развојната, тестовата и продукциската околина
        description: Оваа контрола обезбедува раздвојување на развојната, тестовата и продукциската околина
          за да се спречат несакани интеракции и неовластен пристап.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.32
    ref_id: A.8.32
    name: Change management
    category: technical
    description: This control ensures changes to systems are managed securely to minimize risks and maintain
      operational stability.
    translations:
      mk:
        name: Управување со промени
        description: Оваа контрола обезбедува безбедно управување со промените во системите за минимизирање
          на ризиците и одржување на оперативната стабилност.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.33
    ref_id: A.8.33
    name: Test information
    category: technical
    description: This control protects test data to prevent the exposure of sensitive or confidential
      information during testing processes.
    translations:
      mk:
        name: Тест информации
        description: Оваа контрола ги штити тест податоците за да се спречи откривање на чувствителни
          или доверливи информации при тестирањето.
  - urn: urn:intuitem:risk:function:doc-pol:a.8.34
    ref_id: A.8.34
    name: Protection of information systems during audit testing
    category: technical
    description: This control ensures that systems and data are safeguarded during audits by preventing
      unauthorized access, data leakage, or disruptions. Measures include using non-production environments,
      access restrictions, and confidentiality agreements to maintain system security and integrity.
    translations:
      mk:
        name: Заштита на информациските системи при ревизорско тестирање
        description: Оваа контрола обезбедува системите и податоците да бидат заштитени при ревизии преку
          спречување неовластен пристап, истекување на податоци или прекини. Мерките вклучуваат користење
          непродукциски околини, ограничувања на пристапот и договори за доверливост за одржување на безбедноста
          и интегритетот на системите.
