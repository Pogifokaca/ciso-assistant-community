urn: urn:intuitem:risk:library:doc-pol
locale: en
ref_id: usual-controls
name: CISO Assistant Key Reference Controls
description: 'Curated set of key reference controls maintained by intuitem: policies, procedures, documents,
  training, technical and physical capabilities. Covers governance, access, data protection, resilience,
  privacy, AI, cloud and physical domains. Frameworks across CISO Assistant reference these controls to
  drive applied-control suggestions. URN namespace preserved from the legacy `doc-pol` library.'
copyright: © intuitem - 2026
version: 11
publication_date: 2026-11-20
provider: intuitem
packager: intuitem
