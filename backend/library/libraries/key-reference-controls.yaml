  - urn: urn:intuitem:risk:function:doc-pol:doc.educ_plan
    ref_id: DOC.EDUC_PLAN
    name: Information security awareness and training plan
    category: process
    csf_function: govern
    description: 'Objective: Raise awareness for all employees and provide targeted training for relevant
      staff to promote secure behaviors, ensure compliance, and reduce risks.

      Scope: Awareness for all employees and contractors; targeted training for specific teams (e.g.,
      IT, security, access managers).

      Roles and Responsibilities: Assign responsibilities to IT, HR, and security teams.

      Training Requirements: Define mandatory topics (e.g., access management, secure configurations)
      and frequency (e.g., annual, onboarding).

      Delivery Methods: Awareness through e-learning and campaigns; training through hands-on workshops
      and simulations.

      Evaluation: Track participation rates, quiz scores, and phishing test results.

      Compliance: Align with regulations (e.g., GDPR, ISO 27001) and maintain audit-ready records.

      Continuous Improvement: Update based on feedback and emerging threats.'
    annotation: '7.3.c

      A.6.3

      cis-v8: 14.1, 14.2, 14.9'
