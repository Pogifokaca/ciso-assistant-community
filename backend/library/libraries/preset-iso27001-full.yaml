urn: urn:intuitem:risk:preset:iso27001-full
locale: en
ref_id: preset-iso27001-full
name: ISO 27001:2022 — Full Implementation
description: Comprehensive ISO 27001 ISMS implementation following the Plan–Do–Check–Act cycle. Creates
  a compliance assessment with suggested controls, organisational context, a risk assessment, metric definitions
  for KPIs, and periodic task templates for ongoing management.
version: 5
provider: intuitem
packager: intuitem
translations:
  mk:
    name: ISO 27001:2022 — Целосна имплементација
    description: Сеопфатна имплементација на СУБИ според ISO 27001, следејќи го циклусот Планирај–Направи–Провери–Дејствувај.
      Креира проценка на усогласеност со предложени контроли, организациски контекст, проценка на ризик,
      дефиниции на метрики за KPI и обрасци за периодични задачи за тековно управување.
dependencies:
- urn:intuitem:risk:library:iso27001-2022
- urn:intuitem:risk:library:risk-matrix-5x5-iso27005
- urn:intuitem:risk:library:intuitem-common-catalog
- urn:intuitem:risk:library:core-cybersecurity-metrics
objects:
  preset:
    profile:
      company_size:
      - sme
      - large
      industry:
      - general
      region:
      - global
      goal: iso27001-certification
    feature_flags:
      enable:
      - compliance
      - metrology
      - tprm
      - organisation_issues
      - organisation_objectives
      - tasks
      - follow_up
      - reports
    scaffolded_objects:
    - type: organisation_issue
      name: Regulatory and contractual requirements
      description: Applicable laws, regulations, and contractual obligations that impose information security
        requirements on the organisation (e.g. GDPR, NIS2, sector-specific regulations).
      category: legal
      origin: external
      status: active
      translations:
        mk:
          name: Регулаторни и договорни барања
          description: Применливите закони, прописи и договорни обврски што наметнуваат барања за безбедност
            на информациите на организацијата (на пр. GDPR, NIS2, секторски прописи).
    - type: organisation_issue
      name: Cyber threat landscape
      description: External threat environment including ransomware, phishing, supply-chain attacks, and
        emerging threats relevant to the organisation's sector and geography.
      category: technology
      origin: external
      status: active
      translations:
        mk:
          name: Опкружување на сајбер закани
          description: Надворешната средина на закани, вклучително ransomware, фишинг, напади преку синџирот
            на снабдување и нови закани релевантни за секторот и регионот на организацијата.
    - type: organisation_issue
      name: Current security maturity
      description: Internal assessment of the organisation's existing security practices, gaps, and capabilities
        that influence the ISMS scope and priorities.
      category: internalProcesses
      origin: internal
      status: active
      translations:
        mk:
          name: Тековна безбедносна зрелост
          description: Внатрешна проценка на постојните безбедносни практики, недостатоци и способности
            на организацијата што влијаат врз опсегот и приоритетите на СУБИ.
    - type: organisation_objective
      name: Achieve ISO 27001 certification
      ref: certification_objective
      description: Obtain ISO/IEC 27001:2022 certification through a successful Stage 1 and Stage 2 audit
        by an accredited certification body.
      status: in_progress
      translations:
        mk:
          name: Добивање ISO 27001 сертификација
          description: Добивање ISO/IEC 27001:2022 сертификат преку успешна ревизија во фаза 1 и фаза
            2 од акредитирано сертификациско тело.
    - type: organisation_objective
      name: Maintain acceptable risk levels
      description: Ensure all identified information security risks are treated to within the organisation's
        risk appetite, with residual risk formally accepted by management.
      status: draft
      translations:
        mk:
          name: Одржување прифатливи нивоа на ризик
          description: Сите идентификувани ризици за безбедноста на информациите да бидат третирани до
            нивото на склоност кон ризик на организацијата, со формално прифаќање на резидуалниот ризик
            од раководството.
    - type: organisation_objective
      name: Foster a security-aware culture
      description: Establish and maintain a security awareness programme so that all personnel understand
        their ISMS responsibilities and can recognise common threats.
      status: draft
      translations:
        mk:
          name: Негување култура на безбедносна свест
          description: Воспоставување и одржување програма за безбедносна свест, така што целиот персонал
            ги разбира своите одговорности во СУБИ и ги препознава вообичаените закани.
    - type: risk_assessment
      name: Information Security Risk Assessment
      risk_matrix: urn:intuitem:risk:library:risk-matrix-5x5-iso27005
      ref: main_ra
      translations:
        mk:
          name: Проценка на ризиците за безбедноста на информациите
    - type: compliance_assessment
      name: ISO 27001:2022 Compliance Assessment
      framework: urn:intuitem:risk:library:iso27001-2022
      create_suggested_controls: true
      ref: iso_audit
      translations:
        mk:
          name: Проценка на усогласеност со ISO 27001:2022
    - type: task_template
      name: Internal ISMS audit
      audit: iso_audit
      requirements:
      - 9.2.1
      - 9.2.2
      description: Conduct a full internal audit of the ISMS to verify conformity with ISO 27001 requirements
        and the organisation's own policies (clause 9.2).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        mk:
          name: Внатрешна ревизија на СУБИ
          description: Спроведете целосна внатрешна ревизија на СУБИ за да се потврди усогласеноста со
            барањата на ISO 27001 и сопствените политики на организацијата (клаузула 9.2).
    - type: task_template
      name: Management review
      audit: iso_audit
      requirements:
      - 9.3.1
      - 9.3.2
      - 9.3.3
      description: Hold a management review meeting to evaluate ISMS performance, risk treatment effectiveness,
        and opportunities for improvement (clause 9.3).
      is_recurrent: true
      schedule:
        interval: 6
        frequency: MONTHLY
      translations:
        mk:
          name: Преглед од раководството
          description: Одржете состанок за преглед од раководството за оценување на перформансите на СУБИ,
            ефективноста на третманот на ризиците и можностите за подобрување (клаузула 9.3).
    - type: task_template
      name: Access rights review
      audit: iso_audit
      requirements:
      - A.5.18
      description: Review user access rights across all critical systems to ensure least-privilege and
        timely revocation of unnecessary access (Annex A 5.18).
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
      translations:
        mk:
          name: Преглед на правата на пристап
          description: Преиспитајте ги корисничките права на пристап во сите критични системи за да се
            обезбеди принципот на најмала привилегија и навремено одземање на непотребниот пристап (Анекс
            А 5.18).
    - type: task_template
      name: Risk assessment review
      audit: iso_audit
      requirements:
      - '8.2'
      description: Review and update the information security risk assessment to account for changes in
        threats, vulnerabilities, assets, and business context (clause 8.2).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        mk:
          name: Преглед на проценката на ризик
          description: Преиспитајте ја и ажурирајте ја проценката на ризиците за безбедноста на информациите
            за да се земат предвид промените во заканите, ранливостите, средствата и деловниот контекст
            (клаузула 8.2).
    - type: task_template
      name: Security awareness training
      audit: iso_audit
      requirements:
      - A.6.3
      description: Deliver information security awareness training to all personnel, covering current
        threats, policies, and expected behaviours (Annex A 6.3).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        mk:
          name: Обука за безбедносна свест
          description: Спроведете обука за свест за безбедноста на информациите за целиот персонал, со
            опфаќање на актуелните закани, политиките и очекуваното однесување (Анекс А 6.3).
    - type: task_template
      name: Business continuity testing
      audit: iso_audit
      requirements:
      - A.5.30
      description: Test business continuity and disaster recovery plans to verify they meet recovery objectives
        and address current risks (Annex A 5.30).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
      translations:
        mk:
          name: Тестирање на континуитетот на работењето
          description: Тестирајте ги плановите за континуитет на работењето и обнова по катастрофа за
            да се потврди дека ги исполнуваат целите за обнова и ги опфаќаат тековните ризици (Анекс А
            5.30).
    - type: findings_assessment
      name: Certification audit — Stage 1
      category: audit
      ref: stage1_findings
      audit: iso_audit
      translations:
        mk:
          name: Сертификациска ревизија — фаза 1
    - type: findings_assessment
      name: Certification audit — Stage 2
      category: audit
      ref: stage2_findings
      audit: iso_audit
      translations:
        mk:
          name: Сертификациска ревизија — фаза 2
    - type: findings_assessment
      name: Penetration Test Findings
      category: pentest
      ref: pentest_findings
      translations:
        mk:
          name: Наоди од пенетрациски тест
    - type: metric_instance
      name: Compliance Score
      description: Overall compliance score against ISO 27001 requirements and Annex A controls.
      metric_definition: urn:intuitem:risk:metric:core:gov-01
      collection_frequency: monthly
      target_value: 85.0
      status: active
      translations:
        mk:
          name: Оценка на усогласеност
          description: Вкупна оценка на усогласеност со барањата на ISO 27001 и контролите од Анекс А.
    - type: metric_instance
      name: Security Program Maturity
      description: Qualitative assessment of the ISMS maturity level across governance, processes, and
        technology.
      metric_definition: urn:intuitem:risk:metric:core:gov-02
      collection_frequency: quarterly
      status: active
      translations:
        mk:
          name: Зрелост на безбедносната програма
          description: Квалитативна проценка на нивото на зрелост на СУБИ во управувањето, процесите и
            технологијата.
    - type: metric_instance
      name: Open Critical/High Vulnerabilities
      description: Number of unresolved critical or high-severity vulnerabilities across systems in scope.
      metric_definition: urn:intuitem:risk:metric:core:vuln-01
      collection_frequency: monthly
      target_value: 0.0
      status: active
      translations:
        mk:
          name: Отворени критични/високи ранливости
          description: Број на нерешени ранливости со критична или висока сериозност во системите во опсегот.
    - type: metric_instance
      name: Vulnerability Remediation Time
      description: Average number of days to remediate critical and high vulnerabilities from detection
        to closure.
      metric_definition: urn:intuitem:risk:metric:core:vuln-02
      collection_frequency: monthly
      target_value: 30.0
      status: active
      translations:
        mk:
          name: Време за отстранување на ранливости
          description: Просечен број денови за отстранување на критичните и високите ранливости, од откривање
            до затворање.
    - type: metric_instance
      name: Security Incidents Count
      description: Total number of confirmed security incidents over the measurement period.
      metric_definition: urn:intuitem:risk:metric:core:inc-01
      collection_frequency: monthly
      target_value: 0.0
      status: active
      translations:
        mk:
          name: Број на безбедносни инциденти
          description: Вкупен број потврдени безбедносни инциденти во периодот на мерење.
    - type: metric_instance
      name: MFA Adoption Rate
      description: Percentage of user accounts with multi-factor authentication enabled (Annex A 8.5).
      metric_definition: urn:intuitem:risk:metric:core:iam-01
      collection_frequency: monthly
      target_value: 100.0
      status: active
      translations:
        mk:
          name: Стапка на примена на MFA
          description: Процент на кориснички сметки со овозможена повеќефакторска автентикација (Анекс
            А 8.5).
    - type: metric_instance
      name: Security Training Completion
      description: Percentage of personnel who completed the mandatory security awareness training (Annex
        A 6.3).
      metric_definition: urn:intuitem:risk:metric:core:awr-01
      collection_frequency: quarterly
      target_value: 95.0
      status: active
      translations:
        mk:
          name: Завршена безбедносна обука
          description: Процент на персонал што ја завршил задолжителната обука за безбедносна свест (Анекс
            А 6.3).
    - type: metric_instance
      name: Phishing Click Rate
      description: Percentage of users who clicked on a simulated phishing link during the latest campaign.
      metric_definition: urn:intuitem:risk:metric:core:awr-02
      collection_frequency: quarterly
      target_value: 5.0
      status: active
      translations:
        mk:
          name: Стапка на кликови на фишинг
          description: Процент на корисници што кликнале на симулирана фишинг врска во последната кампања.
    journey:
      steps:
      - key: context_issues
        title: Establish organisational context
        description: Document internal and external factors affecting your ISMS — threats, regulatory
          environment, business strategy, and existing capabilities (clause 4.1).
        target_model: organisation-issues
        translations:
          mk:
            description: Документирајте ги внатрешните и надворешните фактори што влијаат врз СУБИ — заканите,
              регулаторната средина, деловната стратегија и постојните способности (клаузула 4.1).
            title: Воспоставете го организацискиот контекст
      - key: interested_parties
        title: Identify interested parties and their requirements
        description: List the stakeholders relevant to your ISMS (customers, regulators, partners, employees)
          and document their information security requirements (clause 4.2). Use entities to model each
          interested party.
        target_model: entities
        translations:
          mk:
            description: Наведете ги засегнатите страни релевантни за СУБИ (клиенти, регулатори, партнери,
              вработени) и документирајте ги нивните барања за безбедност на информациите (клаузула 4.2).
              Користете субјекти за моделирање на секоја заинтересирана страна.
            title: Идентификувајте ги заинтересираните страни и нивните барања
      - key: scope
        title: Determine ISMS scope
        description: Define the boundaries and applicability of the ISMS — which sites, systems, processes,
          and information are covered (clause 4.3).
        target_model: perimeters
        translations:
          mk:
            description: Дефинирајте ги границите и применливоста на СУБИ — кои локации, системи, процеси
              и информации се опфатени (клаузула 4.3).
            title: Утврдете го опсегот на СУБИ
      - key: objectives
        title: Define information security objectives
        description: Set preliminary ISMS objectives aligned with your business strategy and risk appetite
          (clause 6.2).
        target_model: organisation-objectives
        translations:
          mk:
            description: Поставете прелиминарни цели на СУБИ усогласени со деловната стратегија и склоноста
              кон ризик (клаузула 6.2).
            title: Дефинирајте ги целите за безбедност на информациите
      - key: assets
        title: Identify key processes and assets
        description: Inventory primary assets (information, business processes) and supporting assets
          (hardware, software, networks, personnel) within the ISMS scope.
        target_model: assets
        translations:
          mk:
            description: Направете попис на примарните средства (информации, деловни процеси) и поддржувачките
              средства (хардвер, софтвер, мрежи, персонал) во опсегот на СУБИ.
            title: Идентификувајте ги клучните процеси и средства
      - key: roles
        title: Define roles and responsibilities
        description: 'Assign ISMS roles: information security manager, risk owners, asset owners. Create
          teams to reflect your organisation and ensure top management commitment is documented (clause
          5.3).'
        target_model: actors
        translations:
          mk:
            description: 'Доделете ги улогите во СУБИ: менаџер за безбедност на информациите, сопственици
              на ризици, сопственици на средства. Креирајте тимови според вашата организација и документирајте
              ја посветеноста на највисокото раководство (клаузула 5.3).'
            title: Дефинирајте ги улогите и одговорностите
      - key: maturity_baseline
        title: Measure current cyber maturity
        description: Perform an initial self-assessment of the ISO 27001 requirements to baseline your
          current maturity level and identify the main gaps to address (clause 6.1).
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          mk:
            description: Спроведете почетна самопроценка на барањата на ISO 27001 за да го утврдите тековното
              ниво на зрелост и главните недостатоци што треба да се решат (клаузула 6.1).
            title: Измерете ја тековната сајбер зрелост
      - key: action_plan
        title: Establish ISMS action plan
        description: 'Based on the maturity baseline, define the ISMS implementation plan: priorities,
          resource needs (HR, budget), milestones, and timeline.'
        target_model: applied-controls
        translations:
          mk:
            description: 'Врз основа на утврдената зрелост, дефинирајте го планот за имплементација на
              СУБИ: приоритети, потребни ресурси (луѓе, буџет), клучни точки и временска рамка.'
            title: Воспоставете акциски план за СУБИ
      - key: risk_assessment
        title: Conduct risk assessment
        description: Define risk criteria, choose an analysis method, create risk scenarios by combining
          threats with assets, and assess likelihood and impact (clauses 6.1.1–6.1.2).
        target_model: risk-assessments
        target_ref: main_ra
        translations:
          mk:
            description: Дефинирајте критериуми за ризик, изберете метод за анализа, креирајте сценарија
              на ризик со комбинирање на закани и средства и проценете ја веројатноста и влијанието (клаузули
              6.1.1–6.1.2).
            title: Спроведете проценка на ризик
      - key: soa
        title: Annex A self-assessment
        description: Walk through each Annex A control and assess its applicability. For each control,
          document whether it is included or excluded and provide a justification (clause 6.1.3 d).
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          mk:
            description: Поминете ја секоја контрола од Анекс А и проценете ја нејзината применливост.
              За секоја контрола документирајте дали е вклучена или исклучена и дадете образложение (клаузула
              6.1.3 г).
            title: Самопроценка според Анекс А
      - key: soa_review
        title: Review Statement of Applicability
        description: Generate and review the Statement of Applicability (SoA) report, pre-scoped to the
          ISO 27001 compliance assessment and the main risk assessment with the 'SoA' implementation group.
        target_url: /reports/soa/results
        target_params:
          compliance_assessment: '{{ref:iso_audit}}'
          risk_assessments: '{{ref:main_ra}}'
          implementation_groups:
          - SoA
        translations:
          mk:
            description: Генерирајте ја и прегледајте ја Изјавата за применливост (SoA), со опсег веќе
              поставен на проценката на усогласеност со ISO 27001 и главната проценка на ризик со групата
              за имплементација „SoA“.
            title: Прегледајте ја Изјавата за применливост
      - key: risk_treatment
        title: Plan risk treatment
        description: Review the auto-created controls from ISO 27001 Annex A, assign owners, and define
          implementation plans for each applicable control (clause 8.3).
        target_model: applied-controls
        translations:
          mk:
            description: Прегледајте ги автоматски креираните контроли од Анекс А на ISO 27001, доделете
              сопственици и дефинирајте планови за имплементација за секоја применлива контрола (клаузула
              8.3).
            title: Планирајте го третманот на ризиците
      - key: policies
        title: Write and approve policies
        description: Draft your information security policies (e.g. acceptable use, access control, incident
          management), define the target state of the ISMS, and submit them for management approval (clause
          5.2, 7.5.1, Annex A 5.1).
        target_model: policies
        translations:
          mk:
            description: Изгответе ги политиките за безбедност на информациите (на пр. прифатлива употреба,
              контрола на пристапот, управување со инциденти), дефинирајте ја целната состојба на СУБИ
              и доставете ги на одобрување до раководството (клаузули 5.2, 7.5.1, Анекс А 5.1).
            title: Напишете ги и одобрете ги политиките
      - key: evidences
        title: Collect evidence
        description: Gather and organise the evidence demonstrating your ISMS implementation — documents,
          screenshots, logs, and records needed for audit (clause 7.5).
        target_model: evidences
        translations:
          mk:
            description: Соберете ги и организирајте ги доказите за имплементацијата на СУБИ — документи,
              снимки од екран, логови и записи потребни за ревизијата (клаузула 7.5).
            title: Соберете докази
      - key: kpis
        title: Define and track KPIs
        description: 'Set up metric instances to monitor ISMS effectiveness: compliance score, vulnerability
          remediation time, incident count, and other relevant KPIs (clause 9.1).'
        target_model: metric-instances
        translations:
          mk:
            description: 'Поставете инстанци на метрики за следење на ефективноста на СУБИ: оценка на
              усогласеност, време за отстранување на ранливости, број на инциденти и други релевантни
              KPI (клаузула 9.1).'
            title: Дефинирајте и следете KPI
      - key: findings
        title: Track audit and pentest findings
        description: Import or create findings from penetration tests, vulnerability scans, and audits.
          Assign owners, set priorities, and track remediation progress.
        target_model: findings-assessments
        target_ref: pentest_findings
        translations:
          mk:
            description: Увезете или креирајте наоди од пенетрациски тестови, скенирања на ранливости
              и ревизии. Доделете сопственици, поставете приоритети и следете го напредокот на отстранувањето.
            title: Следете ги наодите од ревизии и пенетрациски тестови
      - key: nonconformities
        title: Treat non-conformities and corrective actions
        description: Review your compliance assessment to identify non-conformities, document root causes,
          and implement corrective actions to close the gaps (clause 10.1).
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          mk:
            description: Прегледајте ја проценката на усогласеност за да ги идентификувате неусогласеностите,
              документирајте ги основните причини и спроведете корективни мерки за затворање на недостатоците
              (клаузула 10.1).
            title: Третирајте ги неусогласеностите и корективните мерки
      - key: ongoing_tasks
        title: Configure recurring ISMS tasks
        description: Review the periodic task templates (internal audits, management reviews, access reviews,
          awareness training) and adjust schedules to fit your organisation.
        target_model: task-templates
        translations:
          mk:
            description: Прегледајте ги обрасците за периодични задачи (внатрешни ревизии, прегледи од
              раководството, прегледи на пристапот, обуки за свест) и прилагодете ги распоредите на вашата
              организација.
            title: Конфигурирајте повторувачки задачи за СУБИ
      - key: auditor_preread
        title: Anticipate the auditor
        description: See, requirement by requirement, what the certification auditor will ask and which
          records you can already show. Pair your evidence with the requests, fill the gaps, then prepare
          each audit session one requirement at a time.
        target_url: /experimental/auditor-preread/{{ref:iso_audit}}
        translations:
          mk:
            description: Видете, барање по барање, што ќе праша сертификацискиот ревизор и кои записи
              веќе можете да ги покажете. Спарете ги доказите со барањата, пополнете ги недостатоците,
              а потоа подгответе ја секоја ревизорска сесија барање по барање.
            title: Предвидете ги прашањата на ревизорот
      - key: audit_export
        title: Prepare the export for your lead auditor
        description: Generate and review the compliance assessment export to share with your certification
          body's lead auditor ahead of the Stage 1 or Stage 2 audit.
        target_model: compliance-assessments
        target_ref: iso_audit
        translations:
          mk:
            description: Генерирајте го и прегледајте го извозот на проценката на усогласеност за да го
              споделите со водечкиот ревизор на сертификациското тело пред ревизијата во фаза 1 или фаза
              2.
            title: Подгответе го извозот за водечкиот ревизор
      - key: stage1_findings
        title: Record the Stage 1 findings
        description: After Stage 1, record each finding of the certification body and link it to its requirement.
          The auditor pre-read then flags them, so you can show what was done about each before Stage
          2.
        target_model: findings-assessments
        target_ref: stage1_findings
        translations:
          mk:
            description: По фаза 1, евидентирајте го секој наод на сертификациското тело и поврзете го
              со неговото барање. Претходниот преглед за ревизорот потоа ги означува, па пред фаза 2 можете
              да покажете што е направено за секој.
            title: Евидентирајте ги наодите од фаза 1
      - key: stage1_followup
        title: Close the Stage 1 findings
        description: For each Stage 1 finding, carry out the action, attach its proof and record what
          changed. The auditor checks them first at Stage 2; the auditor pre-read flags those still open.
        target_url: /experimental/auditor-preread/{{ref:iso_audit}}
        translations:
          mk:
            description: За секој наод од фаза 1, спроведете го дејството, прикачете доказ и евидентирајте
              што е променето. Ревизорот прво ги проверува во фаза 2; претходниот преглед ги означува
              оние што се сè уште отворени.
            title: Затворете ги наодите од фаза 1
      - key: stage2_plan
        title: Plan Stage 2 with the certification body
        description: Record the stage, the audit dates, the certification body and the auditors, schedule
          each audit session from the certification body's plan, and name who answers for each interview
          role.
        target_url: /experimental/auditor-preread/{{ref:iso_audit}}
        translations:
          mk:
            description: Евидентирајте ја фазата, датумите на ревизијата, сертификациското тело и ревизорите,
              закажете ја секоја ревизорска сесија според планот на сертификациското тело и именувајте
              кој одговара за секоја улога на интервју.
            title: Планирајте ја фазата 2 со сертификациското тело
      - key: stage2_sessions
        title: Prepare session by session
        description: 'Work through each audit session one requirement at a time: pair the evidence, fill
          the gaps, set aside what does not apply, and read the questions the auditor will ask.'
        target_url: /experimental/auditor-preread/{{ref:iso_audit}}
        target_params:
          view: sessions
        translations:
          mk:
            description: 'Поминете ја секоја ревизорска сесија барање по барање: спарете ги доказите,
              пополнете ги недостатоците, издвојте го она што не се применува и прочитајте ги прашањата
              што ќе ги постави ревизорот.'
            title: Подгответе се сесија по сесија
      - key: stage2_findings
        title: Record the Stage 2 findings and the corrective action plan
        description: Record each finding of the Stage 2 report, link it to its requirement and plan the
          corrective action. Send the plan to the certification body within the deadline it sets, usually
          shorter for major nonconformities.
        target_model: findings-assessments
        target_ref: stage2_findings
        translations:
          mk:
            description: Евидентирајте го секој наод од извештајот за фаза 2, поврзете го со неговото
              барање и планирајте ја корективната мерка. Доставете го планот до сертификациското тело
              во рокот што го поставува, обично пократок за големите неусогласености.
            title: Евидентирајте ги наодите од фаза 2 и планот за корективни мерки
      - key: certification
        title: Obtain the certificate and plan the surveillance audit
        description: Once the certification body has accepted the corrective actions, set this objective
          to Achieved, file the certificate with your evidence, then plan the first surveillance audit,
          usually within twelve months.
        target_model: organisation-objectives
        target_ref: certification_objective
        translations:
          mk:
            description: Откако сертификациското тело ќе ги прифати корективните мерки, поставете ја оваа
              цел на „Постигнато“, зачувајте го сертификатот со доказите и планирајте ја првата надзорна
              ревизија, обично во рок од дванаесет месеци.
            title: Добијте го сертификатот и планирајте ја надзорната ревизија
