<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <title>RegTech</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F2557"/>
    </linearGradient>
  </defs>
  <!-- light card so the logo reads on both light and dark themes -->
  <rect x="6" y="30" width="388" height="140" rx="22" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="2"/>
  <!-- shield -->
  <path d="M74 46 L116 60 V98 C116 126 98 145 74 154 C50 145 32 126 32 98 V60 Z" fill="url(#shield)"/>
  <!-- document -->
  <path d="M58 72 H84 L94 82 V126 H58 Z" fill="#FFFFFF"/>
  <path d="M84 72 V82 H94 Z" fill="#C7D2FE"/>
  <rect x="64" y="88" width="20" height="3.5" rx="1.75" fill="#94A3B8"/>
  <rect x="64" y="96" width="24" height="3.5" rx="1.75" fill="#94A3B8"/>
  <!-- check -->
  <circle cx="90" cy="120" r="15" fill="#0EA5A4" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M83 120 L88 125 L97 115" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="132" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">
    <tspan fill="#1E3A8A">Reg</tspan><tspan fill="#0EA5A4">Tech</tspan>
  </text>
  <text x="135" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#64748B">REGULATORY COMPLIANCE</text>
</svg>
